<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Wizard Chess</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:wght@400;500;700&family=Cormorant+SC:wght@600;700&family=IM+Fell+English+SC&display=swap">
<style>
/* Layout: the whole screen is the candle-lit hall (WebGL); a thin parchment-and-gold HUD floats on top,
   inside a side gutter that clears phone system bars. One committed dark look, so no light-theme branch. */
:root{
  --night:#09070a;          /* hall shadow behind everything */
  --ink:#f2e6cc;            /* parchment text */
  --ink-dim:#c4b18c;        /* secondary text */
  --gold:#d6a446;           /* rune gold */
  --gold-hi:#ffd98c;        /* lit gold */
  --ember:#ff7a3c;          /* brazier fire */
  --blood:#ff5b45;          /* check / capture */
  --glass:rgba(16,11,7,.66);
  --glass-hi:rgba(44,30,15,.84);
  --rule:rgba(214,164,70,.42);
  --f-display:"IM Fell English SC","Cormorant SC",Georgia,"Times New Roman",serif;
  --f-ui:"Alegreya Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --s-1:12px; --s-2:13px; --s-3:15px; --s-4:22px; --s-5:34px;
  color-scheme:dark;
}
html,body{height:100%;margin:0;background:var(--night);color:var(--ink);overflow:hidden;font-family:var(--f-ui);-webkit-tap-highlight-color:transparent}
#app{position:relative;width:100%;height:100%;overflow:hidden;user-select:none;-webkit-user-select:none}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none;cursor:grab}
#c:active{cursor:grabbing}
#ui{position:absolute;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;gap:8px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px}
#ui.off .top,#ui.off .hint{opacity:0;pointer-events:none;transform:translateY(-6px)}
.top{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:8px;transition:opacity .25s,transform .25s}
.left{display:flex;flex-wrap:wrap;align-items:center;gap:8px;min-width:0;pointer-events:auto}
.brand{font-family:var(--f-display);font-size:var(--s-3);letter-spacing:.2em;color:var(--gold-hi);background:var(--glass);border:1px solid var(--rule);border-radius:999px;padding:7px 15px 6px;text-shadow:0 0 14px rgba(255,186,90,.55);white-space:nowrap}
.status{display:flex;align-items:center;gap:8px;background:var(--glass);border:1px solid var(--rule);border-radius:999px;padding:5px 6px 5px 11px;font-size:var(--s-2);white-space:nowrap}
.dot{width:12px;height:12px;border-radius:50%;background:#f3ecdc;box-shadow:0 0 0 1.5px var(--gold),0 0 10px rgba(255,210,140,.6);flex:none}
.dot.black{background:#141215}
.status.thinking .dot{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 1.5px var(--gold),0 0 18px rgba(255,170,70,.95)}}
.chip{background:rgba(214,164,70,.2);color:var(--gold-hi);border-radius:999px;padding:4px 10px;font-weight:700;font-size:var(--s-1);letter-spacing:.02em}
.actions{display:flex;gap:6px;align-items:center;overflow-x:auto;scrollbar-width:none;max-width:100%;min-width:0;pointer-events:auto;padding:1px}
.actions::-webkit-scrollbar{display:none}
.btn{flex:none;font:500 var(--s-2)/1 var(--f-ui);color:var(--ink);background:var(--glass);border:1px solid var(--rule);border-radius:999px;padding:8px 12px;cursor:pointer;white-space:nowrap;transition:background .15s,border-color .15s,color .15s}
.btn:hover{background:var(--glass-hi);border-color:var(--gold)}
.btn:focus-visible{outline:2px solid var(--gold-hi);outline-offset:2px}
.btn.on{background:linear-gradient(180deg,#f0c766,#b88326);color:#1d1305;border-color:#ffe0a0;font-weight:700}
.btn small{color:var(--gold-hi);font-weight:700;margin-left:4px}
.btn.on small{color:#3a2508}
.sep{flex:none;width:1px;height:22px;background:var(--rule)}
.hint{align-self:flex-start;max-width:100%;font-size:var(--s-1);line-height:1.45;color:var(--ink-dim);background:var(--glass);border:1px solid var(--rule);border-radius:10px;padding:6px 10px;pointer-events:auto;transition:opacity .25s,transform .25s}
.hint b{color:var(--gold-hi);font-weight:700}
#bShow{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));pointer-events:auto}
.banner{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);font-family:var(--f-display);font-size:clamp(46px,11vw,132px);letter-spacing:.06em;color:var(--gold-hi);white-space:nowrap;pointer-events:none;opacity:0;
  text-shadow:0 0 16px rgba(255,180,80,.85),0 0 60px rgba(255,110,30,.6),0 3px 0 #3b2408}
.banner.red{color:#ffd0bf;text-shadow:0 0 16px rgba(255,80,50,.95),0 0 70px rgba(220,30,10,.75),0 3px 0 #3d0a05}
.banner.show{animation:bannerIn 1.7s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes bannerIn{0%{opacity:0;transform:translate(-50%,-50%) scale(1.9)}14%{opacity:1;transform:translate(-50%,-50%) scale(.94)}24%{transform:translate(-50%,-50%) scale(1.02)}72%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(1.05)}}
.modal{position:absolute;inset:0;display:grid;place-items:center;background:rgba(5,3,2,.42);pointer-events:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.card{width:min(380px,100%);background:linear-gradient(180deg,rgba(34,23,12,.96),rgba(14,10,7,.96));border:1px solid var(--gold);border-radius:14px;padding:18px 18px 16px;text-align:center;box-shadow:0 24px 70px rgba(0,0,0,.65),0 0 40px rgba(214,164,70,.18)}
.card h2{margin:0 0 4px;font-family:var(--f-display);font-weight:400;font-size:var(--s-5);letter-spacing:.06em;color:var(--gold-hi);text-wrap:balance;text-shadow:0 0 18px rgba(255,170,70,.45)}
.card p{margin:0 0 14px;color:var(--ink-dim);font-size:var(--s-3);line-height:1.4;text-wrap:balance}
.row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.promo-row button{font-size:42px;line-height:1;width:66px;height:72px;border-radius:12px;padding:0;display:grid;place-items:center;font-family:"Segoe UI Symbol","Noto Sans Symbols 2","DejaVu Sans",serif}
.loading{position:absolute;inset:0;display:grid;place-items:center;align-content:center;gap:10px;background:radial-gradient(ellipse at 50% 60%,#2a1a0c 0%,var(--night) 70%);transition:opacity .9s ease;z-index:5}
.loading.gone{opacity:0;pointer-events:none}
.loading .brand{font-size:var(--s-4);padding:10px 22px 9px}
.loading p{margin:0;color:var(--ink-dim);font-size:var(--s-2);letter-spacing:.04em}
@media (max-width:720px){.actions{flex-basis:100%}.brand{font-size:var(--s-2);padding:6px 12px 5px}}
@media (max-height:520px){.top{flex-wrap:nowrap}.actions{flex:1 1 auto}.hint{display:none}.brand{font-size:var(--s-2);padding:6px 12px 5px}#ui{padding-block:8px}}
@media (prefers-reduced-motion:reduce){.banner.show{animation-duration:2.2s}.status.thinking .dot{animation:none}}
</style>

</head>
<body>
<div id="app">
  <canvas id="c" tabindex="0" aria-label="Wizard Chess 3D board"></canvas>
  <div id="ui">
    <header class="top">
      <div class="left">
        <div class="brand">WIZARD CHESS</div>
        <div class="status" id="status" role="status" aria-live="polite"><span class="dot" id="dot"></span><span id="turn"></span><span class="chip" id="sideChip"></span></div>
      </div>
      <nav class="actions" id="actions" aria-label="Game controls">
        <button class="btn" id="bSide" type="button"></button>
        <button class="btn" id="bAI" type="button"></button>
        <button class="btn" id="bUndo" type="button"></button>
        <button class="btn" id="bNew" type="button"></button>
        <span class="sep" aria-hidden="true"></span>
        <button class="btn" data-cam="player" type="button"></button>
        <button class="btn" data-cam="overhead" type="button"></button>
        <button class="btn" data-cam="side" type="button"></button>
        <button class="btn" data-cam="cathedral" type="button"></button>
        <span class="sep" aria-hidden="true"></span>
        <button class="btn" id="bLevel" type="button"></button>
        <button class="btn" id="bMode" type="button"></button>
        <button class="btn" id="bSound" type="button"></button>
        <button class="btn" id="bLang" type="button"></button>
        <button class="btn" id="bFull" type="button" hidden></button>
        <button class="btn" id="bHide" type="button"></button>
      </nav>
    </header>
    <footer class="hint" id="hint"></footer>
  </div>
  <button class="btn" id="bShow" type="button" hidden></button>
  <div class="banner" id="banner" aria-hidden="true"></div>
  <div class="modal" id="promo" hidden>
    <div class="card" role="dialog" aria-modal="true" aria-labelledby="promoTitle">
      <h2 id="promoTitle"></h2>
      <div class="row promo-row" id="promoRow"></div>
    </div>
  </div>
  <div class="modal" id="result" hidden>
    <div class="card" role="dialog" aria-modal="true" aria-labelledby="resTitle">
      <h2 id="resTitle"></h2>
      <p id="resText"></p>
      <div class="row">
        <button class="btn on" id="bAgain" type="button"></button>
        <button class="btn" id="bClose" type="button"></button>
      </div>
    </div>
  </div>
  <div class="loading" id="loading"><div class="brand">WIZARD CHESS</div><p id="loadText">Sehrli zal tayyorlanmoqda…</p></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.159.0/build/three.min.js"></script>
<script>
// Chess rules + alpha-beta engine. 0x88 board: square = rank*16 + file, rank 0 = White's back rank.
// Pieces: +1..+6 white P N B R Q K, negative for black. Moves are packed ints: from | to<<7 | promo<<14 | flags<<17.
function engineFactory(){
  'use strict';
  const P=1,N=2,B=3,R=4,Q=5,K=6;
  const F_EP=1,F_CASTLE=2,F_DOUBLE=4;
  const KN=[33,31,18,14,-14,-18,-31,-33], KG=[1,-1,16,-16,15,17,-15,-17], BD=[15,17,-15,-17], RD=[1,-1,16,-16];
  const VAL=[0,100,320,330,500,900,20000];
  const START='rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1';
  const CM=new Uint8Array(128).fill(15); CM[0]=13; CM[7]=14; CM[4]=12; CM[112]=7; CM[119]=11; CM[116]=3;

  let seed=1070372;
  const rnd=()=>{ seed^=seed<<13; seed^=seed>>>17; seed^=seed<<5; return seed|0; };
  const ZP1=new Int32Array(13*128), ZP2=new Int32Array(13*128);
  for(let i=0;i<13*128;i++){ ZP1[i]=rnd(); ZP2[i]=rnd(); }
  const ZS1=rnd(), ZS2=rnd();
  const ZC1=new Int32Array(16), ZC2=new Int32Array(16); for(let i=0;i<16;i++){ ZC1[i]=rnd(); ZC2[i]=rnd(); }
  const ZE1=new Int32Array(8), ZE2=new Int32Array(8); for(let i=0;i<8;i++){ ZE1[i]=rnd(); ZE2[i]=rnd(); }
  const zi=(p,sq)=>(p+6)*128+sq;

  const enc=(f,t,pr,fl)=>f|(t<<7)|(pr<<14)|(fl<<17);
  const decode=m=>({from:m&127, to:(m>>7)&127, promo:(m>>14)&7, flags:(m>>17)&7});
  const sqName=sq=>'abcdefgh'[sq&7]+((sq>>4)+1);
  const sqFrom=name=>(name.charCodeAt(1)-49)*16+(name.charCodeAt(0)-97);

  function computeHash(s){
    let h1=0,h2=0;
    for(let sq=0;sq<128;sq++){ if(sq&0x88){ sq+=7; continue; } const p=s.b[sq]; if(p){ h1^=ZP1[zi(p,sq)]; h2^=ZP2[zi(p,sq)]; } }
    if(s.side<0){ h1^=ZS1; h2^=ZS2; }
    h1^=ZC1[s.castle]; h2^=ZC2[s.castle];
    if(s.ep>=0){ h1^=ZE1[s.ep&7]; h2^=ZE2[s.ep&7]; }
    s.h1=h1; s.h2=h2;
  }

  function fromFEN(fen){
    const s={b:new Int8Array(128), side:1, castle:0, ep:-1, half:0, full:1, kings:[4,116], h1:0, h2:0};
    const parts=fen.trim().split(/\s+/), rows=parts[0].split('/');
    for(let r=0;r<8;r++){
      let f=0;
      for(const ch of rows[r]){
        if(ch>='1'&&ch<='8'){ f+=+ch; continue; }
        const t='pnbrqk'.indexOf(ch.toLowerCase())+1;
        const p=ch===ch.toUpperCase()?t:-t, sq=(7-r)*16+f;
        s.b[sq]=p; if(t===K) s.kings[p>0?0:1]=sq; f++;
      }
    }
    s.side=parts[1]==='b'?-1:1;
    const c=parts[2]||'-';
    if(c.includes('K')) s.castle|=1; if(c.includes('Q')) s.castle|=2; if(c.includes('k')) s.castle|=4; if(c.includes('q')) s.castle|=8;
    s.ep=parts[3]&&parts[3]!=='-'?sqFrom(parts[3]):-1;
    s.half=+(parts[4]||0); s.full=+(parts[5]||1);
    computeHash(s);
    return s;
  }

  function toFEN(s){
    let out='';
    for(let r=7;r>=0;r--){
      let empty=0;
      for(let f=0;f<8;f++){
        const p=s.b[r*16+f];
        if(!p){ empty++; continue; }
        if(empty){ out+=empty; empty=0; }
        const ch='pnbrqk'[Math.abs(p)-1]; out+=p>0?ch.toUpperCase():ch;
      }
      if(empty) out+=empty;
      if(r) out+='/';
    }
    let c=''; if(s.castle&1)c+='K'; if(s.castle&2)c+='Q'; if(s.castle&4)c+='k'; if(s.castle&8)c+='q';
    return `${out} ${s.side>0?'w':'b'} ${c||'-'} ${s.ep>=0?sqName(s.ep):'-'} ${s.half} ${s.full}`;
  }

  function attacked(s,sq,by){
    const b=s.b;
    if(by>0){ let f=sq-15; if(!(f&0x88)&&b[f]===P) return true; f=sq-17; if(!(f&0x88)&&b[f]===P) return true; }
    else { let f=sq+15; if(!(f&0x88)&&b[f]===-P) return true; f=sq+17; if(!(f&0x88)&&b[f]===-P) return true; }
    const kn=N*by, kg=K*by, bi=B*by, ro=R*by, qu=Q*by;
    for(let i=0;i<8;i++){ const f=sq+KN[i]; if(!(f&0x88)&&b[f]===kn) return true; }
    for(let i=0;i<8;i++){ const f=sq+KG[i]; if(!(f&0x88)&&b[f]===kg) return true; }
    for(let i=0;i<4;i++){ const d=BD[i]; let f=sq+d; while(!(f&0x88)){ const q=b[f]; if(q){ if(q===bi||q===qu) return true; break; } f+=d; } }
    for(let i=0;i<4;i++){ const d=RD[i]; let f=sq+d; while(!(f&0x88)){ const q=b[f]; if(q){ if(q===ro||q===qu) return true; break; } f+=d; } }
    return false;
  }
  const inCheck=s=>attacked(s,s.kings[s.side>0?0:1],-s.side);

  function genMoves(s,capsOnly){
    const moves=[], side=s.side, b=s.b;
    for(let sq=0;sq<128;sq++){
      if(sq&0x88){ sq+=7; continue; }
      const p=b[sq]; if(!p||(p>0)!==(side>0)) continue;
      const t=p>0?p:-p;
      if(t===P){
        const dir=side>0?16:-16, startRank=side>0?1:6, promoRank=side>0?7:0, one=sq+dir;
        if(!(one&0x88)&&!b[one]){
          if((one>>4)===promoRank){ moves.push(enc(sq,one,Q,0)); if(!capsOnly){ moves.push(enc(sq,one,R,0),enc(sq,one,B,0),enc(sq,one,N,0)); } }
          else if(!capsOnly){ moves.push(enc(sq,one,0,0)); const two=one+dir; if((sq>>4)===startRank&&!b[two]) moves.push(enc(sq,two,0,F_DOUBLE)); }
        }
        for(const to of [one-1,one+1]){
          if(to&0x88) continue;
          const q=b[to];
          if(q&&(q>0)!==(side>0)){
            if((to>>4)===promoRank){ moves.push(enc(sq,to,Q,0)); if(!capsOnly) moves.push(enc(sq,to,R,0),enc(sq,to,B,0),enc(sq,to,N,0)); }
            else moves.push(enc(sq,to,0,0));
          } else if(to===s.ep) moves.push(enc(sq,to,0,F_EP));
        }
      } else if(t===N||t===K){
        const offs=t===N?KN:KG;
        for(let i=0;i<8;i++){
          const to=sq+offs[i]; if(to&0x88) continue;
          const q=b[to]; if(q&&(q>0)===(side>0)) continue; if(capsOnly&&!q) continue;
          moves.push(enc(sq,to,0,0));
        }
        if(t===K&&!capsOnly){
          if(side>0&&sq===4){
            if((s.castle&1)&&!b[5]&&!b[6]&&b[7]===R&&!attacked(s,4,-1)&&!attacked(s,5,-1)&&!attacked(s,6,-1)) moves.push(enc(4,6,0,F_CASTLE));
            if((s.castle&2)&&!b[3]&&!b[2]&&!b[1]&&b[0]===R&&!attacked(s,4,-1)&&!attacked(s,3,-1)&&!attacked(s,2,-1)) moves.push(enc(4,2,0,F_CASTLE));
          } else if(side<0&&sq===116){
            if((s.castle&4)&&!b[117]&&!b[118]&&b[119]===-R&&!attacked(s,116,1)&&!attacked(s,117,1)&&!attacked(s,118,1)) moves.push(enc(116,118,0,F_CASTLE));
            if((s.castle&8)&&!b[115]&&!b[114]&&!b[113]&&b[112]===-R&&!attacked(s,116,1)&&!attacked(s,115,1)&&!attacked(s,114,1)) moves.push(enc(116,114,0,F_CASTLE));
          }
        }
      } else {
        const dirs=t===B?BD:t===R?RD:KG, nd=dirs.length;
        for(let i=0;i<nd;i++){
          const d=dirs[i]; let to=sq+d;
          while(!(to&0x88)){
            const q=b[to];
            if(q){ if((q>0)!==(side>0)) moves.push(enc(sq,to,0,0)); break; }
            if(!capsOnly) moves.push(enc(sq,to,0,0));
            to+=d;
          }
        }
      }
    }
    return moves;
  }

  function make(s,m){
    const from=m&127, to=(m>>7)&127, promo=(m>>14)&7, flags=(m>>17)&7;
    const b=s.b, p=b[from], side=s.side;
    const u={m, cap:0, capSq:to, castle:s.castle, ep:s.ep, half:s.half, h1:s.h1, h2:s.h2};
    let h1=s.h1, h2=s.h2;
    if(s.ep>=0){ h1^=ZE1[s.ep&7]; h2^=ZE2[s.ep&7]; }
    h1^=ZC1[s.castle]; h2^=ZC2[s.castle];
    let cap=b[to];
    if(flags&F_EP){ u.capSq=to-16*side; cap=b[u.capSq]; b[u.capSq]=0; h1^=ZP1[zi(cap,u.capSq)]; h2^=ZP2[zi(cap,u.capSq)]; }
    else if(cap){ h1^=ZP1[zi(cap,to)]; h2^=ZP2[zi(cap,to)]; }
    u.cap=cap;
    const np=promo?promo*side:p;
    h1^=ZP1[zi(p,from)]; h2^=ZP2[zi(p,from)];
    b[to]=np; b[from]=0;
    h1^=ZP1[zi(np,to)]; h2^=ZP2[zi(np,to)];
    if(flags&F_CASTLE){
      const rf=to>from?from+3:from-4, rt=to>from?from+1:from-1, r=b[rf];
      b[rt]=r; b[rf]=0;
      h1^=ZP1[zi(r,rf)]^ZP1[zi(r,rt)]; h2^=ZP2[zi(r,rf)]^ZP2[zi(r,rt)];
    }
    if(p===K*side) s.kings[side>0?0:1]=to;
    s.castle&=CM[from]&CM[to];
    s.ep=(flags&F_DOUBLE)?from+16*side:-1;
    s.half=(p===P*side||cap)?0:s.half+1;
    if(side<0) s.full++;
    s.side=-side;
    h1^=ZS1; h2^=ZS2;
    if(s.ep>=0){ h1^=ZE1[s.ep&7]; h2^=ZE2[s.ep&7]; }
    h1^=ZC1[s.castle]; h2^=ZC2[s.castle];
    s.h1=h1; s.h2=h2;
    return u;
  }

  function unmake(s,u){
    const m=u.m, from=m&127, to=(m>>7)&127, promo=(m>>14)&7, flags=(m>>17)&7;
    s.side=-s.side;
    const side=s.side, b=s.b, p=promo?P*side:b[to];
    b[from]=p; b[to]=0;
    if(flags&F_EP) b[u.capSq]=u.cap; else b[to]=u.cap;
    if(flags&F_CASTLE){ const rf=to>from?from+3:from-4, rt=to>from?from+1:from-1; b[rf]=b[rt]; b[rt]=0; }
    if(p===K*side) s.kings[side>0?0:1]=from;
    s.castle=u.castle; s.ep=u.ep; s.half=u.half; if(side<0) s.full--; s.h1=u.h1; s.h2=u.h2;
  }

  function legalMoves(s){
    const out=[];
    for(const m of genMoves(s,false)){
      const u=make(s,m);
      if(!attacked(s,s.kings[s.side>0?1:0],s.side)) out.push(m);
      unmake(s,u);
    }
    return out;

    [0,0,0,0,0,0,0,0, 50,50,50,50,50,50,50,50, 10,10,20,30,30,20,10,10, 5,5,10,25,25,10,5,5, 0,0,0,20,20,0,0,0, 5,-5,-10,0,0,-10,-5,5, 5,10,10,-20,-20,10,10,5, 0,0,0,0,0,0,0,0],

    [-20,-10,-10,-10,-10,-10,-10,-20, -10,0,0,0,0,0,0,-10, -10,0,5,10,10,5,0,-10, -10,5,5,10,10,5,5,-10, -10,0,10,10,10,10,0,-10, -10,10,10,10,10,10,10,-10, -10,5,0,0,0,0,5,-10, -20,-10,-10,-10,-10,-10,-10,-20],

    [-20,-10,-10,-5,-5,-10,-10,-20, -10,0,0,0,0,0,0,-10, -10,0,5,5,5,5,0,-10, -5,0,5,5,5,5,0,-5, 0,0,5,5,5,5,0,-5, -10,5,5,5,5,5,0,-10, -10,0,5,0,0,0,0,-10, -20,-10,-10,-5,-5,-10,-10,-20],
    [-30,-40,-40,-50,-50,-40,-40,-30, -30,-40,-40,-50,-50,-40,-40,-30, -30,-40,-40,-50,-50,-40,-40,-30, -30,-40,-40,-50,-50,-40,-40,-30, -20,-30,-30,-40,-40,-30,-30,-20, -10,-20,-20,-20,-20,-20,-20,-10, 20,20,0,0,0,0,20,20, 20,30,10,0,0,10,30,20]];

      if(p>0){

        sc+=VAL[p]+PST[p][(7-r)*8+f]; matW+=VAL[p];
        if(p!==P) phase+=VAL[p];
        if(p===B) wb++;

        sc-=VAL[t]+PST[t][r*8+f]; matB+=VAL[t];
        if(t!==P) phase+=VAL[t];

  }
  function isRep(s){

  }
  function hasPieces(s,side){

}

const _t1=new THREE.Vector3(), _t2=new THREE.Vector3(), _t3=new THREE.Vector3(), _tc=new THREE.Vector3(), _tn=new THREE.Vector3(), _nm=new THREE.Matrix3();

    if(!o.isMesh||o.userData.weapon||!o.visible) return;
    const P=o.geometry.attributes.position.array, NN=o.geometry.attributes.normal.array, M=o.matrixWorld;

      _t1.set(P[i],P[i+1],P[i+2]).applyMatrix4(M); _t2.set(P[i+3],P[i+4],P[i+5]).applyMatrix4(M); _t3.set(P[i+6],P[i+7],P[i+8]).applyMatrix4(M);

      t.p.push(_t1.x,_t1.y,_t1.z,_t2.x,_t2.y,_t2.z,_t3.x,_t3.y,_t3.z);
      for(let k=0;k<3;k++){ _tn.set(NN[i+k*3],NN[i+k*3+1],NN[i+k*3+2]).applyMatrix3(_nm).normalize(); t.n.push(_tn.x,_tn.y,_tn.z); }

  });

    if(!parts.length) return null;
    let cx=0,cy=0,cz=0,cnt=0;
    for(const pt of parts) for(let i=0;i<pt.p.length;i+=3){ cx+=pt.p[i]; cy+=pt.p[i+1]; cz+=pt.p[i+2]; cnt++; }
    cx/=cnt; cy/=cnt; cz/=cnt;

const tweens=[];
function tween(dur,fn){ return new Promise(res=>tweens.push({t:0,dur:Math.max(.001,dur),fn,res})); }
const wait=d=>tween(d,()=>{});
function updateTweens(dt){
  for(let i=tweens.length-1;i>=0;i--){ const tw=tweens[i]; tw.t+=dt; const k=Math.min(1,tw.t/tw.dur); tw.fn(k); if(k>=1){ tweens.splice(i,1); tw.res(); } }
}

// ---------------------------------------------------------------- camera control
const cam={target:new THREE.Vector3(0,0,0),r:13,theta:0,phi:1.0,vt:0,vp:0,auto:false,anim:null,mode:'player'};
const PHI_MIN=.02, PHI_MAX=1.42;
let shakeAmt=0;
function shake(a){ shakeAmt=Math.max(shakeAmt,a); }
function fitScale(){ const asp=camera.aspect, short=canvas.clientHeight<520; return asp>=1.25?(short?1.1:1):asp>=.85?1.2:asp>=.6?1.45:1.6; }
function preset(name){
  const side=settings.human>0||settings.mode==='2p'?0:Math.PI, f=fitScale();
  if(name==='overhead') return {r:13.5*f,theta:side,phi:.03,target:new THREE.Vector3(0,0,0),auto:false};
  if(name==='side') return {r:13*f,theta:side+Math.PI/2,phi:1.12,target:new THREE.Vector3(0,.2,0),auto:false};
  if(name==='cathedral') return {r:23*Math.max(1,f*.9),theta:side+.7,phi:1.3,target:new THREE.Vector3(0,3.4,0),auto:true};
  return {r:14.8*f,theta:side,phi:.8,target:new THREE.Vector3(0,0,side?-.4:.4),auto:false};
}
function setCam(name,dur=1.3){
  cam.mode=name; cam.manual=false;
  const p=preset(name);
  let dTheta=((p.theta-cam.theta)%(Math.PI*2)+Math.PI*3)%(Math.PI*2)-Math.PI;
  cam.anim={t:0,dur,r0:cam.r,r1:p.r,th0:cam.theta,th1:cam.theta+dTheta,ph0:cam.phi,ph1:p.phi,t0:cam.target.clone(),t1:p.target,auto:p.auto};
  cam.auto=false; cam.vt=cam.vp=0;
  for(const b of document.querySelectorAll('[data-cam]')) b.classList.toggle('on',b.dataset.cam===name);
}
const keys=new Set();
const _fw=new THREE.Vector3(), _rt=new THREE.Vector3(), _tg=new THREE.Vector3();
function updateCamera(dt){
  if(cam.anim){
    const a=cam.anim; a.t+=dt; const k=easeInOut(Math.min(1,a.t/a.dur));
    cam.r=lerp(a.r0,a.r1,k); cam.theta=lerp(a.th0,a.th1,k); cam.phi=lerp(a.ph0,a.ph1,k); cam.target.lerpVectors(a.t0,a.t1,k);
    if(a.t>=a.dur){ cam.auto=a.auto; cam.anim=null; }
  } else {
    cam.theta+=cam.vt; cam.phi=clamp(cam.phi+cam.vp,PHI_MIN,PHI_MAX);
    const damp=Math.pow(.0009,dt); cam.vt*=damp; cam.vp*=damp;
    if(cam.auto&&!reduceMotion) cam.theta+=dt*.07;
  }
  if(keys.size){
    const sp=(keys.has('shift')?14:6)*dt;
    _fw.set(-Math.sin(cam.theta),0,-Math.cos(cam.theta)); _rt.set(Math.cos(cam.theta),0,-Math.sin(cam.theta));
    if(keys.has('w')) cam.target.addScaledVector(_fw,sp); if(keys.has('s')) cam.target.addScaledVector(_fw,-sp);
    if(keys.has('d')) cam.target.addScaledVector(_rt,sp); if(keys.has('a')) cam.target.addScaledVector(_rt,-sp);
    if(keys.has('r')) cam.target.y+=sp; if(keys.has('f')) cam.target.y-=sp;
    clampTarget(); cam.anim=null; cam.auto=false;
  }
  let pk=0;
  if(cam.punch){ const u=cam.punch.t+=dt; pk=u<.35?easeInOut(u/.35):u<.75?1:Math.max(0,1-easeInOut((u-.75)/1));
    if(u>1.75) cam.punch=null; }
  _tg.copy(cam.target); if(pk) _tg.lerp(cam.punch?cam.punch.p:_tg,.38*pk);
  const rr=cam.r*(1-.24*pk), sp=Math.sin(cam.phi);
  camera.position.set(_tg.x+rr*sp*Math.sin(cam.theta),_tg.y+rr*Math.cos(cam.phi),_tg.z+rr*sp*Math.cos(cam.theta));
  camera.position.y=Math.max(camera.position.y,FLOOR_Y+.6);
  camera.lookAt(_tg);
  if(shakeAmt>.001){ camera.position.x+=(R0()-.5)*shakeAmt; camera.position.y+=(R0()-.5)*shakeAmt; camera.position.z+=(R0()-.5)*shakeAmt; shakeAmt*=Math.pow(.004,dt); }
}
function clampTarget(){ cam.target.x=clamp(cam.target.x,-12,12); cam.target.z=clamp(cam.target.z,-12,12); cam.target.y=clamp(cam.target.y,-1.5,7); }

// pointer input: one finger orbit, two fingers pinch + pan, right / shift drag pans, a short still press is a tap
const pointers=new Map();
let tap=null, pinch=null;
function stopCamMotion(){ cam.anim=null; cam.auto=false; cam.manual=true; }
function rotateBy(dx,dy){ cam.vt=-dx*.0055; cam.vp=-dy*.0045; stopCamMotion(); }
function panBy(dx,dy){
  const s=cam.r*.0016;
  _rt.set(Math.cos(cam.theta),0,-Math.sin(cam.theta)); _fw.set(-Math.sin(cam.theta),0,-Math.cos(cam.theta));
  cam.target.addScaledVector(_rt,-dx*s).addScaledVector(_fw,dy*s); clampTarget(); stopCamMotion();
}
function zoomBy(f){ cam.r=clamp(cam.r*f,4.5,34); stopCamMotion(); }
canvas.addEventListener('pointerdown',e=>{
  sfx.init();
  try{ canvas.setPointerCapture(e.pointerId); }catch(err){}
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY,btn:e.button});
  if(pointers.size===1) tap={id:e.pointerId,x:e.clientX,y:e.clientY,t:e.timeStamp}; else { tap=null; pinch=null; }
});
canvas.addEventListener('pointermove',e=>{
  const p=pointers.get(e.pointerId); if(!p) return;
  const dx=e.clientX-p.x, dy=e.clientY-p.y; p.x=e.clientX; p.y=e.clientY;
  if(tap&&Math.hypot(e.clientX-tap.x,e.clientY-tap.y)>9) tap=null;
  if(tap) return;
  if(pointers.size===1){ if(p.btn===2||e.shiftKey) panBy(dx,dy); else rotateBy(dx,dy); }
  else if(pointers.size===2){
    const [a,b]=[...pointers.values()], d=Math.hypot(a.x-b.x,a.y-b.y), mx=(a.x+b.x)/2, my=(a.y+b.y)/2;
    if(pinch){ zoomBy(pinch.d/Math.max(1,d)); panBy(mx-pinch.mx,my-pinch.my); }
    pinch={d,mx,my};
  }
});
function endPointer(e){
  if(!pointers.has(e.pointerId)) return;
  pointers.delete(e.pointerId);
  if(pointers.size<2) pinch=null;
  if(tap&&tap.id===e.pointerId&&e.type==='pointerup'&&e.timeStamp-tap.t<700) onTap(e.clientX,e.clientY);
  tap=null;
}
canvas.addEventListener('pointerup',endPointer);
canvas.addEventListener('pointercancel',endPointer);
canvas.addEventListener('wheel',e=>{ e.preventDefault(); zoomBy(Math.exp(e.deltaY*.0011)); },{passive:false});
canvas.addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('keydown',e=>{
  if(e.target&&e.target.tagName==='BUTTON'&&(e.key===' '||e.key==='Enter')) return;
  sfx.init();
  const k=e.key.toLowerCase();
  if(k==='h'){ toggleUI(); return; }
  if(k==='escape'){ clearSelection(); return; }
  if('wasdrf'.includes(k)&&k.length===1){ keys.add(k); e.preventDefault(); }
  if(k==='shift') keys.add('shift');
});
addEventListener('keyup',e=>{ keys.delete(e.key.toLowerCase()); });
addEventListener('blur',()=>keys.clear());

// ---------------------------------------------------------------- picking
const ray=new THREE.Raycaster(), ndc=new THREE.Vector2(), _hit=new THREE.Vector3(), boardPlane=new THREE.Plane(YUP,0);
function rayHits(cx,cy){
  const rc=canvas.getBoundingClientRect();
  ndc.set((cx-rc.left)/rc.width*2-1,-(cy-rc.top)/rc.height*2+1);
  ray.setFromCamera(ndc,camera);
  const roots=pieces.filter(pc=>pc.alive).map(pc=>pc.root), list=[];
  for(const h of ray.intersectObjects(roots,true)){ const pc=h.object.userData.piece; if(pc&&pc.alive&&!list.includes(pc)) list.push(pc); }
  return list;
}
function pickAt(cx,cy){
  let list=rayHits(cx,cy);
  let sq=null;
  if(ray.ray.intersectPlane(boardPlane,_hit)){ const f=Math.floor(_hit.x+4), r=Math.floor(4-_hit.z); if(f>=0&&f<8&&r>=0&&r<8) sq=r*16+f; }
  if(!list.length&&isTouch){
    for(let k=0;k<8&&!list.length;k++){ const a=k/8*Math.PI*2; list=rayHits(cx+Math.cos(a)*13,cy+Math.sin(a)*13); }
  }
  return {piece:list[0]||null,list,sq};
}

// ---------------------------------------------------------------- game state
const game={s:null,hist:[],uci:[],keys:[]};
const posKey=s=>s.h1+':'+s.h2;
let gameOver=null, busy=0, aiPending=false, searchId=0, aiStart=0, introRunning=false;
let selected=null, targets=[];
function resetGame(){ game.s=E.fromFEN(E.START); game.hist=[]; game.uci=[]; game.keys=[posKey(game.s)]; gameOver=null; }
function replay(list){ for(const u of list){ const m=E.parseMove(game.s,u); if(!m) break; game.hist.push(E.make(game.s,m)); game.uci.push(u); game.keys.push(posKey(game.s)); } }
function insufficient(s){
  const minors=[];
  for(let sq=0;sq<128;sq++){ if(sq&0x88){ sq+=7; continue; } const t=Math.abs(s.b[sq]); if(!t||t===K) continue; if(t===P||t===R||t===Q) return false; minors.push({t,c:((sq>>4)+(sq&7))&1}); }
  if(minors.length<=1) return true;
  return minors.every(m=>m.t===B&&m.c===minors[0].c);
}
function status(){
  const s=game.s, legal=E.legalMoves(s), chk=E.inCheck(s);
  if(!legal.length) return chk?{over:true,type:'mate',winner:-s.side}:{over:true,type:'stalemate'};
  if(s.half>=100) return {over:true,type:'fifty'};
  const k=posKey(s); let c=0; for(const x of game.keys) if(x===k) c++;
  if(c>=3) return {over:true,type:'repetition'};
  if(insufficient(s)) return {over:true,type:'material'};
  return {over:false,check:chk};
}
const humanTurn=()=>settings.mode==='2p'||game.s.side===settings.human;
const canAct=()=>!busy&&!gameOver&&!aiPending&&!introRunning;

// ---------------------------------------------------------------- selection
function showTargets(){
  for(const d of dots) d.visible=false; for(const r of capRings) r.visible=false;
  if(!selected){ selRing.visible=false; return; }
  const p=sqPos(selected.sq); selRing.position.set(p.x,.014,p.z); selRing.visible=true;
  const seen=new Set(); let di=0, ci=0;
  for(const m of targets){
    const d=E.decode(m); if(seen.has(d.to)) continue; seen.add(d.to);
    const q=sqPos(d.to), isCap=game.s.b[d.to]!==0||(d.flags&F_EP);
    if(isCap&&ci<capRings.length){ const r=capRings[ci++]; r.position.set(q.x,.016,q.z); r.visible=true; }
    else if(di<dots.length){ const o=dots[di++]; o.position.set(q.x,.016,q.z); o.visible=true; }
  }
}
function selectPiece(pc){
  if(selected&&selected!==pc) lowerPiece(selected);
  selected=pc;
  targets=E.legalMoves(game.s).filter(m=>(m&127)===pc.sq);
  showTargets(); sfx.select();
  magicBurst(pc.root.position,[1,.85,.45],14,.6);
}
function lowerPiece(pc){ const y0=pc.root.position.y; if(y0>.001) tween(.18,k=>{ pc.root.position.y=y0*(1-easeOut(k)); }); }
function clearSelection(){ if(selected) lowerPiece(selected); selected=null; targets=[]; showTargets(); }
function onTap(cx,cy){
  if(!canAct()||!humanTurn()){ return; }
  const {piece,list,sq}=pickAt(cx,cy), side=game.s.side;
  if(selected){
    if(piece&&piece.color===side){
      if(piece!==selected){ selectPiece(piece); return; }
      const behind=list.slice(1).find(pc=>pc.color===side);
      if(behind) selectPiece(behind); else clearSelection();
      return;
    }
    let tsq=piece?piece.sq:sq, mv=targets.filter(m=>((m>>7)&127)===tsq);
    if(!mv.length&&sq!==null&&sq!==tsq){ tsq=sq; mv=targets.filter(m=>((m>>7)&127)===tsq); }
    if(mv.length>1) askPromotion(mv); else if(mv.length===1) humanMove(mv[0]); else clearSelection();
    return;
  }
  if(piece&&piece.color===side) selectPiece(piece);
  else if(sq!==null){ const pc=pieceAt.get(sq); if(pc&&pc.color===side) selectPiece(pc); }
}
function askPromotion(moves){
  const box=$('promoRow'); box.innerHTML='';
  const white=game.s.side>0;
  for(const [pr,wg,bg] of [[Q,'♕','♛'],[R,'♖','♜'],[B,'♗','♝'],[N,'♘','♞']]){
    const m=moves.find(x=>((x>>14)&7)===pr); if(!m) continue;
    const b=document.createElement('button'); b.className='btn'; b.type='button'; b.textContent=white?wg:bg;
    b.setAttribute('aria-label',['','','Knight','Bishop','Rook','Queen'][pr]);
    b.onclick=()=>{ $('promo').hidden=true; humanMove(m); };
    box.appendChild(b);
  }
  $('promo').hidden=false;
  const first=box.querySelector('button'); if(first) first.focus();
}
function humanMove(m){ clearSelectionInstant(); playMove(m); }
function clearSelectionInstant(){ selected=null; targets=[]; showTargets(); }

// ---------------------------------------------------------------- move animation
function setLast(from,to){ const a=sqPos(from), b=sqPos(to); lastA.position.set(a.x,.012,a.z); lastB.position.set(b.x,.012,b.z); lastA.visible=lastB.visible=true; }
function hideLast(){ lastA.visible=lastB.visible=false; }
const _ax=new THREE.Vector3();
function leanAxis(dir){ return new THREE.Vector3(dir.z,0,-dir.x).normalize(); }
const yawFor=d=>Math.atan2(-d.x,-d.z);
function turnTo(pc,yaw,dur=.2){
  const y0=pc.face.rotation.y, d=((yaw-y0)%(Math.PI*2)+Math.PI*3)%(Math.PI*2)-Math.PI;
  if(Math.abs(d)<.01) return Promise.resolve();
  return tween(dur,k=>{ pc.face.rotation.y=y0+d*easeInOut(k); });
}
const GLIDE={[B]:1,[Q]:1};   // robed pieces glide, soldiers and towers march, knights leap
async function moveTo(pc,b,o={}){
  const a=pc.root.position.clone(), flat=new THREE.Vector3(b.x-a.x,0,b.z-a.z), dist=flat.length();
  if(dist<.001){ pc.root.position.set(b.x,0,b.z); return; }
  const dir=flat.normalize(), axis=leanAxis(dir), jump=o.jump;
  const dur=o.dur||(jump?.78:clamp(.36+dist*.075,.45,1.05)), steps=Math.max(1,Math.round(dist*1.3));
  if(!o.silent) sfx.slide(dur,jump);
  await tween(dur,k=>{
    const e=easeInOut(k);
    pc.root.position.x=lerp(a.x,b.x,e); pc.root.position.z=lerp(a.z,b.z,e);
    if(jump){ pc.root.position.y=lerp(a.y,0,e)+Math.sin(k*Math.PI)*(o.high||1.15); pc.pose.quaternion.setFromAxisAngle(axis,-.38*Math.sin(k*Math.PI*2)); if(pc.upper) pc.upper.rotation.x=.4*Math.sin(k*Math.PI); }
    else if(o.glide){ pc.root.position.y=lerp(a.y,0,e)+Math.sin(k*Math.PI)*.05; pc.pose.quaternion.setFromAxisAngle(axis,Math.sin(k*Math.PI)*.08); }
    else { pc.root.position.y=lerp(a.y,0,e)+Math.abs(Math.sin(k*Math.PI*steps))*.07; pc.pose.quaternion.setFromAxisAngle(axis,Math.sin(k*Math.PI)*.13+Math.sin(k*Math.PI*steps*2)*.025); }
  });
  pc.root.position.set(b.x,0,b.z); pc.pose.quaternion.identity(); if(pc.upper) pc.upper.rotation.x=0;
}
async function animSlide(pc,to,o={}){
  pc.acting=true;
  const b=sqPos(to), a=pc.root.position, d=new THREE.Vector3(b.x-a.x,0,b.z-a.z);
  if(d.lengthSq()>1e-6) turnTo(pc,yawFor(d.normalize()),.18);
  const jump=o.jump||pc.type===N;
  await moveTo(pc,b,{jump,high:o.high,glide:!jump&&GLIDE[pc.type]});
  sfx.thud(jump?1:.7);
  if(jump) for(let i=0;i<8;i++){ const an=R0()*Math.PI*2; smoke.emit(b.x+Math.cos(an)*.3,.08,b.z+Math.sin(an)*.3,Math.cos(an)*.8,.2,Math.sin(an)*.8,.9,.35,.9,[.6,.53,.45],[.4,.35,.3],.35,2,0); }
  await turnTo(pc,pc.baseYaw(),.22);
  pc.acting=false;
}

// each piece has its own way of taking: (attacker, victim, direction, lean axis, victim tremble, target square)
const _tip=new THREE.Vector3(), _bolt=new THREE.Vector3();
const STRIKES={
  // pawn: sword raised over the shoulder, a diagonal slash
  async pawn(att,vic,dir,axis,tremble){
    const arm=att.arm, r0=arm.rotation.clone(), base=att.root.position.clone();
    sfx.whoosh(.32,false);
    await tween(.3,k=>{ const e=easeOut(k); arm.rotation.set(lerp(r0.x,2.9,e),0,lerp(r0.z,-.55,e)); att.pose.quaternion.setFromAxisAngle(axis,-.16*e); tremble(k); });
    await tween(.1,k=>{ const e=easeIn(k); arm.rotation.set(lerp(2.9,.35,e),0,lerp(-.55,.9,e)); att.pose.quaternion.setFromAxisAngle(axis,-.16+.38*e); att.root.position.copy(base).addScaledVector(dir,.22*e); });
    sfx.shing(); deathCut(vic,dir,'d');
    await tween(.3,k=>{ const e=easeOut(k); arm.rotation.set(lerp(.35,r0.x,e),0,lerp(.9,r0.z,e)); att.pose.quaternion.setFromAxisAngle(axis,.22*(1-e)); });
  },
  // knight: the horse rears up and crushes the victim with its front hooves
  async knight(att,vic,dir,axis,tremble){
    const u=att.upper, arm=att.arm, r0=arm.rotation.x, base=att.root.position.clone();
    sfx.neigh();
    await tween(.42,k=>{ const e=easeOut(k); u.rotation.x=.72*e; arm.rotation.x=lerp(r0,2.7,e); tremble(k); });
    await wait(.06);
    await tween(.13,k=>{ const e=easeIn(k); u.rotation.x=lerp(.72,-.14,e); arm.rotation.x=lerp(2.7,.5,e); att.root.position.copy(base).addScaledVector(dir,.32*e); });
    sfx.stomp(); deathCrush(vic,dir);
    await tween(.32,k=>{ const e=easeOut(k); u.rotation.x=lerp(-.14,0,e); arm.rotation.x=lerp(.5,r0,e); });
  },
  // bishop: the staff glows, a bolt of light flies and blasts the victim into the air
  async bishop(att,vic,dir,axis){
    const arm=att.arm, r0=arm.rotation.clone(), orb=att.orbMat, col=att.color>0?[1,.88,.55]:[.74,.5,1], oy=PIECE_DEF[B].arm.orbY;
    sfx.charge2();
    await tween(.5,k=>{ const e=easeOut(k); arm.rotation.x=lerp(r0.x,1.45,e); arm.rotation.z=lerp(r0.z,.05,e); if(orb) orb.emissiveIntensity=1.3+7*e;
      att.weapon.localToWorld(_tip.set(0,oy,0)); const a=R0()*Math.PI*2, r=.35+R0()*.2; fx.emit(_tip.x+Math.cos(a)*r,_tip.y+(R0()-.5)*.3,_tip.z+Math.sin(a)*r,-Math.cos(a)*r*3,0,-Math.sin(a)*r*3,.3,.16,.05,col,[1,1,1],1,0,0); });

      for(let i=0;i<4;i++) fx.emit(_bolt.x+(R0()-.5)*.06,_bolt.y+(R0()-.5)*.06,_bolt.z+(R0()-.5)*.06,(R0()-.5)*.6,(R0()-.5)*.6,(R0()-.5)*.6,.35,.34,.04,[1,1,1],col,1,1,0);
      flash.position.copy(_bolt); flashLevel=Math.max(flashLevel,.45); });

    await tween(.35,k=>{ const e=easeOut(k); arm.rotation.x=lerp(1.45,r0.x,e); arm.rotation.z=lerp(.05,r0.z,e); if(orb) orb.emissiveIntensity=lerp(8.3,1.3,e); });
  },
  // rook: backs up, then charges like a battering ram and launches the victim
  async rook(att,vic,dir,axis,tremble,to){
    const a=att.root.position.clone(), b=sqPos(to), vp=vic.root.position.clone();
    sfx.rumble();

  // queen: sword out, two whirling turns, the victim is cut clean in half

    const arm=att.arm, w=att.weapon, r0=arm.rotation.clone(), w0=w.rotation.clone(), y0=att.face.rotation.y, tipY=PIECE_DEF[Q].arm.tipY;
    sfx.swirl();

async function animCapture(att,vic,to){

  if(!reduceMotion) cam.punch={p:vp.clone().setY(.4),t:0};

async function animTopple(pc){

// checkmate, as in the film: the beaten king lets his sword fall, throws down his crown and falls

  }

async function playMove(m){
  busy++;
  try{
    const s=game.s, d=E.decode(m), mover=pieceAt.get(d.from);
    const capSq=(d.flags&F_EP)?d.to-16*s.side:d.to, victim=s.b[capSq]?pieceAt.get(capSq):null;
    let rook=null, rookTo=-1;
    if(d.flags&F_CASTLE){ const rf=d.to>d.from?d.from+3:d.from-4; rookTo=d.to>d.from?d.from+1:d.from-1; rook=pieceAt.get(rf); pieceAt.delete(rf); }
    game.hist.push(E.make(s,m)); game.uci.push(E.toUCI(m)); game.keys.push(posKey(s));
    pieceAt.delete(d.from); if(victim) pieceAt.delete(capSq);
    if(mover){ pieceAt.set(d.to,mover); mover.sq=d.to; }
    if(rook){ pieceAt.set(rookTo,rook); rook.sq=rookTo; }
    checkGlow.visible=false; setLast(d.from,d.to); saveLocal(); updateHUD();
    if(mover){
      if(victim) await animCapture(mover,victim,d.to);
      else if(rook) await Promise.all([animSlide(mover,d.to),(async()=>{ await wait(.12); await animSlide(rook,rookTo,{jump:true,high:1.5}); })()]);
      else await animSlide(mover,d.to);
      if(d.promo) await animPromote(mover,d.promo);
    }
  } finally { busy--; }
  afterMove();
}
function afterMove(){
  const st=status();
  updateHUD();
  if(st.over){ onGameOver(st); return; }
  if(st.check){
    const kp=pieceAt.get(game.s.kings[game.s.side>0?0:1]);
    if(kp){ const p=kp.root.position; checkGlow.position.set(p.x,.015,p.z); checkGlow.visible=true; }
    banner(t('check'),'red'); sfx.check();
  }
  maybeAI();
}
function onGameOver(st){
  gameOver=st; saveLocal(); updateHUD();
  if(st.type==='mate'){
    const kp=pieceAt.get(game.s.kings[game.s.side>0?0:1]);
    if(kp){ const p=kp.root.position; checkGlow.position.set(p.x,.015,p.z); checkGlow.visible=true; }
    banner(t('mate'),'red'); sfx.mate(); kingSurrenders(kp);
    setTimeout(()=>{ for(const b of braziers) for(let i=0;i<60;i++){ const a=R0()*Math.PI*2, sp=1+R0()*2.5; fx.emit(b.x,b.y+.6,b.z,Math.cos(a)*sp*.5,5+R0()*5,Math.sin(a)*sp*.5,1.6+R0(),.2,.04,[1,.9,.55],[1,.45,.12],1,.4,6,1); } sfx.magic(); },900);
  } else { banner(st.type==='stalemate'?t('stalemate'):t('draw')); sfx.magic(); }
  setTimeout(()=>{ if(gameOver===st) showResult(st); },st.type==='mate'?2600:1900);
}
function showResult(st){
  let title, text;
  if(st.type==='mate'){
    title=t('mate');
    const who=st.winner>0?t('whiteWins'):t('blackWins');
    text=settings.mode==='ai'?(st.winner===settings.human?t('youWin'):t('youLose'))+' '+who+'.':who+'.';
  } else {
    title=st.type==='stalemate'?t('stalemate'):t('draw');
    text={stalemate:t('reasonStalemate'),fifty:t('reasonFifty'),repetition:t('reasonRep'),material:t('reasonMaterial')}[st.type];

}

// ---------------------------------------------------------------- AI
const LEVELS=[{depth:2,time:350,margin:120},{depth:4,time:900,margin:18},{depth:6,time:1800,margin:0},{depth:10,time:3800,margin:0}];
let worker=null;
try{
  const src='const engineFactory='+engineFactory.toString()+';\n('+workerMain.toString()+')();';
  worker=new Worker(URL.createObjectURL(new Blob([src],{type:'text/javascript'})));
  worker.onmessage=e=>onAIResult(e.data);
  worker.onerror=()=>{ worker=null; if(aiPending){ const id=searchId; setTimeout(()=>runLocal(id),30); } };
}catch(err){ worker=null; }
function aiRequest(){ return {id:searchId,fen:E.START,moves:game.uci.slice(),opts:LEVELS[settings.level]}; }
function runLocal(id){
  if(id!==searchId) return;
  const E2=engineFactory(), s=E2.fromFEN(E.START);
  for(const u of game.uci){ const m=E2.parseMove(s,u); if(!m) break; E2.pushHistory(s); E2.make(s,m); }
  const r=E2.search(s,LEVELS[settings.level]);
  onAIResult({id,move:r?E2.toUCI(r.move):null});
}
function maybeAI(force){
  if(gameOver||busy||aiPending||introRunning) return;
  if(!force&&(settings.mode!=='ai'||game.s.side===settings.human)) return;
  aiPending=true; searchId++; aiStart=performance.now(); updateHUD();
  const req=aiRequest();
  if(worker) worker.postMessage(req); else setTimeout(()=>runLocal(req.id),60);
}
function onAIResult(d){
  if(d.id!==searchId||!aiPending) return;
  const delay=Math.max(0,520-(performance.now()-aiStart));
  setTimeout(()=>{
    if(d.id!==searchId) return;
    aiPending=false; updateHUD();
    const m=d.move?E.parseMove(game.s,d.move):0;
    if(m) playMove(m);
  },delay);
}
function cancelAI(){ if(aiPending){ searchId++; aiPending=false; } }

// ---------------------------------------------------------------- syncing pieces after undo / new game
async function syncPieces(){
  busy++;
  try{
    const b=game.s.b, want=[];
    for(let sq=0;sq<128;sq++){ if(sq&0x88){ sq+=7; continue; } if(b[sq]) want.push({sq,type:Math.abs(b[sq]),color:Math.sign(b[sq])}); }
    const used=new Set(), next=new Map(), moves=[];
    for(const w of want){ const pc=pieceAt.get(w.sq); if(pc&&pc.alive&&pc.type===w.type&&pc.color===w.color){ used.add(pc); next.set(w.sq,pc); } }
    const free=pieces.filter(pc=>pc.alive&&!used.has(pc));
    const born=[];
    for(const w of want){
      if(next.has(w.sq)) continue;
      let best=null, bd=1e9;
      for(const pc of free){ if(used.has(pc)||pc.type!==w.type||pc.color!==w.color) continue; const d=Math.hypot((pc.sq&7)-(w.sq&7),(pc.sq>>4)-(w.sq>>4)); if(d<bd){ bd=d; best=pc; } }
      if(best){ used.add(best); next.set(w.sq,best); moves.push([best,w.sq]); best.sq=w.sq; }
      else { const pc=new Piece(w.type,w.color,w.sq); pc.pose.scale.setScalar(.01); pieces.push(pc); next.set(w.sq,pc); born.push(pc); }
    }
    const gone=pieces.filter(pc=>pc.alive&&!used.has(pc)&&!born.includes(pc));
    pieceAt.clear(); for(const [sq,pc] of next) pieceAt.set(sq,pc);
    const jobs=[];
    for(const pc of gone){ magicBurst(pc.root.position,[.8,.85,1],18); jobs.push(tween(.4,k=>pc.pose.scale.setScalar(1-easeIn(k))).then(()=>pc.dispose())); }
    for(const [pc,sq] of moves) jobs.push(animSlide(pc,sq,{jump:true,high:.9}));
    for(const pc of born){ jobs.push((async()=>{ await wait(.15+R0()*.25); magicBurst(pc.root.position,[1,.85,.45],22); await tween(.5,k=>pc.pose.scale.setScalar(Math.max(.01,easeOutBack(k)))); pc.pose.scale.setScalar(1); })()); }
    if(jobs.length) sfx.magic();
    await Promise.all(jobs);
    pieces=pieces.filter(pc=>pc.alive);
    for(const pc of pieces){ pc.resetPose(); pc.acting=false; pc.root.rotation.set(0,0,0); pc.root.position.copy(sqPos(pc.sq)); }
  } finally { busy--; }
}
function undo(){
  if(busy||introRunning||!game.hist.length) return;
  cancelAI(); $('result').hidden=true; clearSelectionInstant(); clearDebris();
  let n=1;
  if(settings.mode==='ai'){ n=game.s.side===settings.human?2:1; if(gameOver&&gameOver.type==='mate'&&game.s.side!==settings.human) n=1; }
  n=Math.min(n,game.hist.length);
  for(let i=0;i<n;i++){ E.unmake(game.s,game.hist.pop()); game.uci.pop(); game.keys.pop(); }
  gameOver=null; checkGlow.visible=false;
  if(game.uci.length){ const last=game.uci[game.uci.length-1]; setLast((last.charCodeAt(1)-49)*16+(last.charCodeAt(0)-97),(last.charCodeAt(3)-49)*16+(last.charCodeAt(2)-97)); } else hideLast();
  saveLocal(); updateHUD();
  syncPieces().then(()=>{ const st=status(); if(st.check){ const kp=pieceAt.get(game.s.kings[game.s.side>0?0:1]); if(kp){ checkGlow.position.set(kp.root.position.x,.015,kp.root.position.z); checkGlow.visible=true; } } maybeAI(); });
}
function newGame(){
  if(busy||introRunning) return;
  cancelAI(); $('result').hidden=true; clearSelectionInstant(); clearDebris();
  resetGame(); hideLast(); checkGlow.visible=false; saveLocal(); updateHUD();
  syncPieces().then(()=>maybeAI());
}

// ---------------------------------------------------------------- sound (synthesised, starts on first touch)
const sfx=(()=>{
  let ctx=null, master=null, verb=null, noise=null, roar=null;
  const out=(node,wet)=>{ node.connect(master); if(wet>0){ const g=ctx.createGain(); g.gain.value=wet; node.connect(g); g.connect(verb); } };
  const noiseSrc=t0=>{ const s=ctx.createBufferSource(); s.buffer=noise; s.loop=true; s.start(t0,Math.random()*1.5); return s; };
  const env=(g,t0,a,peak,d)=>{ g.gain.setValueAtTime(.0001,t0); g.gain.exponentialRampToValueAtTime(peak,t0+a); g.gain.exponentialRampToValueAtTime(.0001,t0+a+d); };
  function init(){
    if(ctx){ if(ctx.state==='suspended') ctx.resume(); return; }
    const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
    try{ ctx=new AC(); }catch(e){ ctx=null; return; }
    master=ctx.createGain(); master.gain.value=settings.sound?.85:0;
    const comp=ctx.createDynamicsCompressor(); master.connect(comp); comp.connect(ctx.destination);
    verb=ctx.createConvolver();
    const len=ctx.sampleRate*2.8|0, ir=ctx.createBuffer(2,len,ctx.sampleRate);
    for(let c=0;c<2;c++){ const d=ir.getChannelData(c); for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3.4); }
    verb.buffer=ir; const wet=ctx.createGain(); wet.gain.value=.3; verb.connect(wet); wet.connect(master);
    const nl=ctx.sampleRate*2|0; noise=ctx.createBuffer(1,nl,ctx.sampleRate); const nd=noise.getChannelData(0); for(let i=0;i<nl;i++) nd[i]=Math.random()*2-1;
    // fire roar + low hum of the hall
    const r=noiseSrc(ctx.currentTime), lp=ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=420; roar=ctx.createGain(); roar.gain.value=.05; r.connect(lp); lp.connect(roar); out(roar,.2);
    for(const f of [55,82.4]){ const o=ctx.createOscillator(); o.frequency.value=f; const g=ctx.createGain(); g.gain.value=.012; const lfo=ctx.createOscillator(); lfo.frequency.value=.07+Math.random()*.05; const lg=ctx.createGain(); lg.gain.value=.008; lfo.connect(lg); lg.connect(g.gain); o.connect(g); out(g,.6); o.start(); lfo.start(); }
  }
  function crackle(){
    if(!ctx||!settings.sound) return;
    const t0=ctx.currentTime, s=noiseSrc(t0), bp=ctx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=1400+Math.random()*3000; bp.Q.value=2;
    const g=ctx.createGain(); env(g,t0,.002,.02+Math.random()*.05,.02+Math.random()*.05); s.connect(bp); bp.connect(g); out(g,.15); s.stop(t0+.15);
  }
  function chime(freqs,dur,vol,type='sine',gap=.06){
    if(!ctx) return; const t0=ctx.currentTime;
    freqs.forEach((f,i)=>{ const o=ctx.createOscillator(); o.type=type; o.frequency.value=f; const g=ctx.createGain(); const ts=t0+i*gap; env(g,ts,.01,vol,dur); o.connect(g); out(g,.9); o.start(ts); o.stop(ts+dur+.05); });
  }
  return {
    init, crackle,
    setOn(on){ if(master) master.gain.setTargetAtTime(on?.85:0,ctx.currentTime,.05); },
    slide(dur,jump){
      if(!ctx) return; const t0=ctx.currentTime;
      if(jump){ chime([392,523.25],.35,.05,'triangle',.04); return; }
      const s=noiseSrc(t0), bp=ctx.createBiquadFilter(); bp.type='bandpass'; bp.Q.value=1.3;
      bp.frequency.setValueAtTime(320,t0); bp.frequency.linearRampToValueAtTime(640,t0+dur);
      const g=ctx.createGain(); g.gain.setValueAtTime(.0001,t0); g.gain.exponentialRampToValueAtTime(.14,t0+.07); g.gain.setValueAtTime(.14,t0+dur*.8); g.gain.exponentialRampToValueAtTime(.0001,t0+dur+.08);
      s.connect(bp); bp.connect(g); out(g,.25); s.stop(t0+dur+.12);
    },
    thud(v=1){
      if(!ctx) return; const t0=ctx.currentTime, o=ctx.createOscillator(); o.frequency.setValueAtTime(115,t0); o.frequency.exponentialRampToValueAtTime(46,t0+.18);
      const g=ctx.createGain(); env(g,t0,.004,.42*v,.26); o.connect(g); out(g,.35); o.start(t0); o.stop(t0+.32);
      const s=noiseSrc(t0), lp=ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=1700; const ng=ctx.createGain(); env(ng,t0,.002,.16*v,.07); s.connect(lp); lp.connect(ng); out(ng,.3); s.stop(t0+.12);
    },
    charge(){
      if(!ctx) return; const t0=ctx.currentTime, o=ctx.createOscillator(); o.type='sawtooth'; o.frequency.setValueAtTime(70,t0); o.frequency.exponentialRampToValueAtTime(190,t0+.36);
      const lp=ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=900; const g=ctx.createGain(); env(g,t0,.18,.07,.22); o.connect(lp); lp.connect(g); out(g,.5); o.start(t0); o.stop(t0+.45);
    },
    smash(){
      if(!ctx) return; const t0=ctx.currentTime;
      const o=ctx.createOscillator(); o.frequency.setValueAtTime(155,t0); o.frequency.exponentialRampToValueAtTime(30,t0+.65); const og=ctx.createGain(); env(og,t0,.004,.95,.75); o.connect(og); out(og,.55); o.start(t0); o.stop(t0+.85);
      const s=noiseSrc(t0), lp=ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.setValueAtTime(6000,t0); lp.frequency.exponentialRampToValueAtTime(500,t0+.55);
      const ng=ctx.createGain(); env(ng,t0,.002,.85,.6); s.connect(lp); lp.connect(ng); out(ng,.7); s.stop(t0+.75);
      for(let i=0;i<22;i++){ const ts=t0+.04+Math.pow(Math.random(),1.5)*1.2, d=ctx.createBufferSource(); d.buffer=noise; d.start(ts,Math.random()*1.5);
        const bp=ctx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=1500+Math.random()*4500; bp.Q.value=3;
        const g=ctx.createGain(); env(g,ts,.003,Math.max(.004,.28*(1-(ts-t0)/1.4)),.04+Math.random()*.06); d.connect(bp); bp.connect(g); out(g,.4); d.stop(ts+.14); }
    },
    whoosh(dur=.26,heavy=false){
      if(!ctx) return; const t0=ctx.currentTime, s=noiseSrc(t0), bp=ctx.createBiquadFilter(); bp.type='bandpass'; bp.Q.value=heavy?.9:1.6;
      bp.frequency.setValueAtTime(heavy?220:500,t0); bp.frequency.exponentialRampToValueAtTime(heavy?1200:2800,t0+dur*.6); bp.frequency.exponentialRampToValueAtTime(heavy?320:800,t0+dur);
      const g=ctx.createGain(); g.gain.setValueAtTime(.0001,t0); g.gain.exponentialRampToValueAtTime(heavy?.55:.32,t0+dur*.55); g.gain.exponentialRampToValueAtTime(.0001,t0+dur+.02);
      s.connect(bp); bp.connect(g); out(g,.3); s.stop(t0+dur+.08);
    },
    shing(){
      chime([1760,2637,3520,4699,5274],.55,.04,'sine',.003); if(!ctx) return;
      const t0=ctx.currentTime, s=noiseSrc(t0), hp=ctx.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=3500; const g=ctx.createGain(); env(g,t0,.002,.18,.12); s.connect(hp); hp.connect(g); out(g,.4); s.stop(t0+.2);
    },
    neigh(){
      if(!ctx) return; const t0=ctx.currentTime, o=ctx.createOscillator(); o.type='sawtooth'; const f=o.frequency;
      f.setValueAtTime(300,t0); f.exponentialRampToValueAtTime(820,t0+.16); f.exponentialRampToValueAtTime(600,t0+.5); f.exponentialRampToValueAtTime(320,t0+.85);
      const vib=ctx.createOscillator(); vib.frequency.value=12; const vg=ctx.createGain(); vg.gain.value=40; vib.connect(vg); vg.connect(f);
      const bp=ctx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=1150; bp.Q.value=1.3;
      const pk=ctx.createBiquadFilter(); pk.type='peaking'; pk.frequency.value=2600; pk.gain.value=9; pk.Q.value=2;
      const g=ctx.createGain(); g.gain.setValueAtTime(.0001,t0); g.gain.exponentialRampToValueAtTime(.15,t0+.05); g.gain.setValueAtTime(.15,t0+.55); g.gain.exponentialRampToValueAtTime(.0001,t0+.9);
      o.connect(bp); bp.connect(pk); pk.connect(g); out(g,.45); o.start(t0); vib.start(t0); o.stop(t0+.95); vib.stop(t0+.95);
    },
    stomp(){ this.thud(1.5); setTimeout(()=>this.thud(1.2),75); this.smash(); },
    charge2(){
      if(!ctx) return; const t0=ctx.currentTime;
      for(const [a,b,v] of [[180,1300,.07],[270,1950,.04]]){ const o=ctx.createOscillator(); o.frequency.setValueAtTime(a,t0); o.frequency.exponentialRampToValueAtTime(b,t0+.5); const g=ctx.createGain(); g.gain.setValueAtTime(.0001,t0); g.gain.exponentialRampToValueAtTime(v,t0+.4); g.gain.exponentialRampToValueAtTime(.0001,t0+.58); o.connect(g); out(g,.8); o.start(t0); o.stop(t0+.6); }
      chime([1046.5,1318.5,1568],.6,.03,'sine',.12);
    },
    zap(){
      if(!ctx) return; const t0=ctx.currentTime, o=ctx.createOscillator(); o.type='square'; o.frequency.setValueAtTime(2200,t0); o.frequency.exponentialRampToValueAtTime(140,t0+.25);
      const lp=ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=3000; const g=ctx.createGain(); env(g,t0,.004,.09,.26); o.connect(lp); lp.connect(g); out(g,.6); o.start(t0); o.stop(t0+.3);
      const s=noiseSrc(t0), bp=ctx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=3200; bp.Q.value=.8; const ng=ctx.createGain(); env(ng,t0,.003,.2,.18); s.connect(bp); bp.connect(ng); out(ng,.5); s.stop(t0+.25);
    },
    rumble(){
      if(!ctx) return; const t0=ctx.currentTime, s=noiseSrc(t0), lp=ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=170;
      const g=ctx.createGain(); g.gain.setValueAtTime(.0001,t0); g.gain.exponentialRampToValueAtTime(.7,t0+.42); g.gain.exponentialRampToValueAtTime(.0001,t0+.75); s.connect(lp); lp.connect(g); out(g,.3); s.stop(t0+.8);
    },
    swirl(){ this.whoosh(.28,false); setTimeout(()=>this.whoosh(.26,false),240); setTimeout(()=>this.whoosh(.24,false),470); },
    heave(){
      if(!ctx) return; const t0=ctx.currentTime, o=ctx.createOscillator(); o.type='sawtooth'; o.frequency.setValueAtTime(70,t0); o.frequency.exponentialRampToValueAtTime(105,t0+.4);
      const lp=ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=380; const g=ctx.createGain(); env(g,t0,.2,.1,.25); o.connect(lp); lp.connect(g); out(g,.4); o.start(t0); o.stop(t0+.5);
    },
    clang(v=1){
      chime([523,1443,2824,4670],1.4,.06*v,'sine',.002); if(!ctx) return;
      const t0=ctx.currentTime, s=noiseSrc(t0), hp=ctx.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=2500; const g=ctx.createGain(); env(g,t0,.001,.2*v,.06); s.connect(hp); hp.connect(g); out(g,.5); s.stop(t0+.1);
    },
    crumble(){
      if(!ctx) return; const t0=ctx.currentTime;
      for(let i=0;i<10;i++){ const ts=t0+Math.random()*.45, d=ctx.createBufferSource(); d.buffer=noise; d.start(ts,Math.random()*1.5); const bp=ctx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=900+Math.random()*3000; bp.Q.value=2.5; const g=ctx.createGain(); env(g,ts,.003,.1+Math.random()*.08,.05+Math.random()*.06); d.connect(bp); bp.connect(g); out(g,.3); d.stop(ts+.15); }
    },
    select(){ chime([1318.5,1975.5],.45,.05); },
    magic(){ chime([523.25,659.25,783.99,1046.5,1318.5],1.5,.07); },
    check(){
      if(!ctx) return; const t0=ctx.currentTime;
      for(const f of [98,103.8]){ const o=ctx.createOscillator(); o.type='sawtooth'; o.frequency.value=f; const lp=ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=650; const g=ctx.createGain(); env(g,t0,.03,.09,1.1); o.connect(lp); lp.connect(g); out(g,.6); o.start(t0); o.stop(t0+1.2); }
      chime([587.3,830.6],1.3,.08,'sine',.12);
    },
    mate(){
      if(!ctx) return; const t0=ctx.currentTime;
      for(const [f,v] of [[55,.4],[110*1.47,.12],[167,.12],[241,.09],[333,.06],[452,.04]]){ const o=ctx.createOscillator(); o.frequency.value=f; const g=ctx.createGain(); env(g,t0,.01,v,4.2); o.connect(g); out(g,.8); o.start(t0); o.stop(t0+4.4); }
      this.smash();
    }
  };
})();

// ---------------------------------------------------------------- HUD
const ui=$('ui');
function banner(text,cls=''){ const el=$('banner'); el.textContent=text; el.className='banner '+cls; void el.offsetWidth; el.classList.add('show'); }
function updateHUD(){
  const s=game.s, white=s.side>0;
  $('turn').textContent=aiPending?(white?t('whiteThinks'):t('blackThinks')):(white?t('whiteToMove'):t('blackToMove'));
  $('dot').classList.toggle('black',!white);
  $('status').classList.toggle('thinking',aiPending);
  $('sideChip').textContent=settings.mode==='2p'?t('twoPlayers'):settings.human>0?t('playingWhite'):t('playingBlack');
  $('bSide').textContent=settings.human>0?t('playAsBlack'):t('playAsWhite');
  $('bSide').disabled=settings.mode==='2p'; $('bSide').style.opacity=settings.mode==='2p'?.45:1;
  $('bAI').textContent=t('aiMove'); $('bUndo').textContent=t('undo'); $('bNew').textContent=t('newGame');
  for(const b of document.querySelectorAll('[data-cam]')) b.textContent=t(b.dataset.cam);
  $('bLevel').innerHTML=`${t('level')}<small>${t('levels')[settings.level]}</small>`;
  $('bMode').innerHTML=`${t('opponent')}<small>${settings.mode==='ai'?t('vsAI'):t('vsFriend')}</small>`;
  $('bSound').innerHTML=`${t('sound')}<small>${settings.sound?t('on'):t('off')}</small>`;
  $('bLang').innerHTML=`${t('lang')}<small>${settings.lang.toUpperCase()}</small>`;
  $('bFull').textContent=t('fullscreen');
  $('bHide').textContent=t('hide'); $('bShow').textContent=t('show');
  $('hint').innerHTML=isTouch?t('hintTouch'):t('hintMouse');
  $('promoTitle').textContent=t('promo'); $('bAgain').textContent=t('again'); $('bClose').textContent=t('close');
  $('loadText').textContent=t('loading');
  document.documentElement.lang=settings.lang;
}
function toggleUI(force){ const off=force!==undefined?force:!ui.classList.contains('off'); ui.classList.toggle('off',off); $('bShow').hidden=!off; }
$('bSide').onclick=()=>{
  if(settings.mode!=='ai'||introRunning) return;
  settings.human=-settings.human; clearSelectionInstant(); saveLocal(); updateHUD(); setCam('player',1.6);
  if(!busy) maybeAI();
};
$('bAI').onclick=()=>{ if(!canAct()) return; clearSelectionInstant(); maybeAI(true); };
$('bUndo').onclick=undo;
$('bNew').onclick=newGame;
for(const b of document.querySelectorAll('[data-cam]')) b.onclick=()=>setCam(b.dataset.cam);
$('bLevel').onclick=()=>{ settings.level=(settings.level+1)%LEVELS.length; saveLocal(); updateHUD(); };
$('bMode').onclick=()=>{ settings.mode=settings.mode==='ai'?'2p':'ai'; cancelAI(); saveLocal(); updateHUD(); if(settings.mode==='ai') maybeAI(); };
$('bSound').onclick=()=>{ settings.sound=!settings.sound; sfx.init(); sfx.setOn(settings.sound); saveLocal(); updateHUD(); };
$('bLang').onclick=()=>{ settings.lang=LANGS[(LANGS.indexOf(settings.lang)+1)%LANGS.length]; saveLocal(); updateHUD(); };
$('bHide').onclick=()=>toggleUI(true);
$('bShow').onclick=()=>toggleUI(false);
$('bAgain').onclick=()=>{ $('result').hidden=true; newGame(); };
$('bClose').onclick=()=>{ $('result').hidden=true; };
if(document.fullscreenEnabled){ $('bFull').hidden=false; $('bFull').onclick=()=>{ (document.fullscreenElement?document.exitFullscreen():$('app').requestFullscreen()).catch(()=>{}); }; }
document.addEventListener('pointerdown',()=>sfx.init(),{capture:true});

// ---------------------------------------------------------------- persistence (per-viewer convenience)
const STORE='wizard-chess.v1';
function snapshot(){ return {moves:game.uci.slice(),lang:settings.lang,level:settings.level,mode:settings.mode,human:settings.human,sound:settings.sound}; }
function saveLocal(){ try{ localStorage.setItem(STORE,JSON.stringify(snapshot())); }catch(e){} }
function loadLocal(){ try{ return JSON.parse(localStorage.getItem(STORE)||'null')||{}; }catch(e){ return {}; } }

// ---------------------------------------------------------------- resize + render loop
const _sz=new THREE.Vector2();
function resize(){
  const w=Math.max(1,canvas.clientWidth), h=Math.max(1,canvas.clientHeight);
  renderer.setSize(w,h,false);
  camera.aspect=w/h; camera.fov=camera.aspect<.85?58:camera.aspect<1.25?50:45; camera.updateProjectionMatrix();
  renderer.getDrawingBufferSize(_sz);
  const sc=_sz.y/(2*Math.tan(camera.fov*Math.PI/360));
  for(const m of pointMats) m.uniforms.uScale.value=sc;
}
let lastAspect=0;
addEventListener('resize',()=>{ resize(); const a=camera.aspect; if(lastAspect&&Math.abs(a-lastAspect)>.25&&!cam.manual&&!introRunning) setCam(cam.mode,.6); lastAspect=a; });
if(window.ResizeObserver) new ResizeObserver(resize).observe(canvas);

let last=performance.now(), time=0, perfT=0, perfN=0, perfChecks=0;
function frame(now){
  requestAnimationFrame(frame);
  let dt=Math.min(window.__wcMaxDt||.05,Math.max(0,(now-last)/1000)); last=now;
  if(window.__wcFreeze){ dt=window.__wcStep||0; window.__wcStep=0; }
  time+=dt;
  updateTweens(dt);
  updateCamera(dt);
  // fire
  for(const b of braziers){
    const fl=.82+.18*Math.sin(time*11+b.phase)*Math.sin(time*7.3+b.phase*2)+.06*Math.sin(time*23+b.phase);
    if(b.light) b.light.intensity=(lowPower?46:40)*fl;
    b.acc+=dt*(lowPower?40:62);
    while(b.acc>=1){ b.acc-=1; const a=R0()*Math.PI*2, r=Math.sqrt(R0())*.38;
      fx.emit(b.x+Math.cos(a)*r,b.y,b.z+Math.sin(a)*r,(R0()-.5)*.25,1.3+R0()*1.1,(R0()-.5)*.25,.55+R0()*.55,.62+R0()*.25,.12,[1,.86,.5],[.85,.2,.04],.85,.6,0,1.6); }
    if(R0()<dt*5) fx.emit(b.x+(R0()-.5)*.5,b.y+.4,b.z+(R0()-.5)*.5,(R0()-.5)*.6,2.2+R0()*1.6,(R0()-.5)*.6,1.6+R0()*1.4,.07,.02,[1,.8,.4],[1,.35,.08],1,.3,-.1,1.5);
    if(R0()<dt*3) smoke.emit(b.x,b.y+1.4,b.z,(R0()-.5)*.2,.9+R0()*.5,(R0()-.5)*.2,2.6,.5,1.8,[.16,.13,.11],[.1,.09,.08],.22,.3,0,.5);
  }
  if(R0()<dt*6) sfx.crackle();
  if(!lowPower) candleLight.intensity=26+3*Math.sin(time*5.1)*Math.sin(time*3.7);
  if(flashLevel>0){ flash.intensity=90*flashLevel*flashLevel; flashLevel=Math.max(0,flashLevel-dt*2.6); } else flash.intensity=0;
  // selection idle
  if(selected&&!busy){ const ty=.24+Math.sin(time*3.2)*.05; selected.root.position.y+=(ty-selected.root.position.y)*Math.min(1,dt*12); if(R0()<dt*14){ const p=selected.root.position, a=R0()*Math.PI*2; fx.emit(p.x+Math.cos(a)*.42,.05,p.z+Math.sin(a)*.42,0,.6+R0()*.6,0,.9,.12,.02,[1,.85,.45],[1,.55,.2],1,.2,0); } }
  selRing.rotation.z+=dt*.6; const pulse=.75+.25*Math.sin(time*4);
  selRing.material.opacity=pulse;
  for(const d of dots) if(d.visible) d.scale.setScalar(.9+.12*Math.sin(time*4.5));
  for(const r of capRings) if(r.visible){ r.rotation.z-=dt*.9; r.material.opacity=.7+.3*Math.sin(time*6); }
  if(checkGlow.visible) checkGlow.material.opacity=.55+.45*Math.sin(time*6);
  for(const pc of pieces) if(pc.alive) pc.live(time,dt,pc===selected);
  updateAmbient(dt,time);
  updateDebris(dt);
  fx.update(dt,time); smoke.update(dt,time);
  renderer.render(scene,camera);
  // adaptive resolution for slower phones during the first seconds
  if(perfChecks<6){ perfT+=dt; perfN++; if(perfT>2){ const avg=perfT/perfN; perfChecks++; if(avg>.034&&renderer.getPixelRatio()>.9){ renderer.setPixelRatio(Math.max(.85,renderer.getPixelRatio()*.78)); resize(); } perfT=0; perfN=0; } }
}

// ---------------------------------------------------------------- intro + boot
async function intro(){
  introRunning=true; updateHUD();
  const p=preset('player');
  cam.r=27; cam.theta=p.theta+2.3; cam.phi=1.22; cam.target.set(0,2.5,0);
  for(const pc of pieces){ pc.pose.scale.setScalar(.01); pc.root.position.y=-1.2; }
  setTimeout(()=>$('loading').classList.add('gone'),150);
  setCam('player',reduceMotion?.6:3.4);
  const jobs=pieces.map(pc=>(async()=>{
    const rank=pc.sq>>4, d=(pc.color>0?rank:7-rank)*.18+(pc.sq&7)*.05+.5;
    await wait(reduceMotion?0:d);
    magicBurst(sqPos(pc.sq),pc.color>0?[1,.88,.55]:[.75,.6,1],10);
    await tween(.55,k=>{ pc.pose.scale.setScalar(Math.max(.01,easeOutBack(k))); pc.root.position.y=-1.2*(1-easeOut(k)); });
    pc.pose.scale.setScalar(1); pc.root.position.y=0;
  })());
  await Promise.all(jobs);
  introRunning=false; updateHUD();
  const st=status();
  if(st.over) onGameOver(st);
  else { if(st.check){ const kp=pieceAt.get(game.s.kings[game.s.side>0?0:1]); if(kp){ checkGlow.position.set(kp.root.position.x,.015,kp.root.position.z); checkGlow.visible=true; } } maybeAI(); }
}
function start(data){
  const saved=data&&Array.isArray(data.moves)?data:loadLocal();
  if(saved&&typeof saved==='object'){
    if(LANGS.includes(saved.lang)) settings.lang=saved.lang;
    if(saved.level>=0&&saved.level<LEVELS.length) settings.level=saved.level|0;
    if(saved.mode==='ai'||saved.mode==='2p') settings.mode=saved.mode;
    if(saved.human===1||saved.human===-1) settings.human=saved.human;
    if(typeof saved.sound==='boolean') settings.sound=saved.sound;
  }
  resetGame();
  if(saved&&Array.isArray(saved.moves)) replay(saved.moves);
  if(game.uci.length){ const l=game.uci[game.uci.length-1]; setLast((l.charCodeAt(1)-49)*16+(l.charCodeAt(0)-97),(l.charCodeAt(3)-49)*16+(l.charCodeAt(2)-97)); }
  spawnAllPieces();
  resize(); updateHUD();
  requestAnimationFrame(t0=>{ last=t0; frame(t0); });
  intro();
}
if(window.__wcTest) window.__wc={game,E,camera,cam,setCam,playMove,onTap,look(x,y,z,r,th,ph){ cam.anim=null; cam.auto=false; cam.target.set(x,y,z); cam.r=r; cam.theta=th; cam.phi=ph; },pick:(x,y)=>{ const r=pickAt(x,y); return {piece:r.piece?[r.piece.type,r.piece.color,r.piece.sq]:null,n:r.list.length,sq:r.sq}; },sqScreen(sq,y=0){ const v=sqPos(sq).setY(y).project(camera), rc=canvas.getBoundingClientRect(); return [rc.left+(v.x+1)/2*rc.width,rc.top+(1-v.y)/2*rc.height]; },state:()=>({busy,aiPending,introRunning,gameOver,uci:game.uci.slice(),pieces:pieces.length,shards:debris.length})};
const hot=window.claude&&window.claude.hot;
try{ if(hot&&typeof hot.snapshot==='function') hot.snapshot(snapshot); }catch(e){}
if(hot&&typeof hot.ready==='function') hot.ready(start); else start((hot&&hot.data)||{});
})();
