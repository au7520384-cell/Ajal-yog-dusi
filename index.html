<!doctype html>
<html lang="uz" translate="no" class="notranslate">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="screen-orientation" content="landscape">
<meta name="x5-orientation" content="landscape">
<meta name="full-screen" content="yes">
<meta name="x5-fullscreen" content="true">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<title>Bilyard 8 — Masters League</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b1220; --text:#f3f5fa; --muted:#a7b2cc; --gold:#ffcf3d;
    --fh:"Lilita One","Arial Black",Impact,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
    font-family:Nunito,"Trebuchet MS","Segoe UI",system-ui,sans-serif;font-weight:800;overflow:hidden;
    user-select:none;-webkit-user-select:none;touch-action:none}
  button{font:inherit;color:inherit}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block}
  .h{font-family:var(--fh);font-weight:400;letter-spacing:.5px}

  /* ---------- Menu backdrop over the live demo game ---------- */
  #shade{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity .4s;overflow:hidden;
    background:
      radial-gradient(ellipse at 50% 25%,rgba(255,200,110,.22),transparent 55%),
      linear-gradient(180deg,rgba(20,14,6,.78),rgba(8,6,3,.9));
    -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
  #shade.on{opacity:1}
  #shade::before{content:"";position:absolute;inset:-50%;opacity:.35;
    background:repeating-conic-gradient(from 0deg at 50% 50%,rgba(255,220,150,.22) 0deg 5deg,transparent 5deg 13deg);
    -webkit-mask:radial-gradient(circle at 50% 50%,#000 0%,transparent 45%);mask:radial-gradient(circle at 50% 50%,#000 0%,transparent 45%);
    animation:spinRays 60s linear infinite}
  @keyframes spinRays{to{transform:rotate(360deg)}}
  .spark{position:absolute;width:4px;height:4px;border-radius:50%;background:#ffe7a8;box-shadow:0 0 8px #ffcf3d;
    opacity:0;animation:floatUp linear infinite}
  @keyframes floatUp{0%{transform:translateY(0);opacity:0}15%{opacity:.9}100%{transform:translateY(-70vh);opacity:0}}

  /* ---------- Top navigation ---------- */
  #nav{position:fixed;top:0;left:0;right:0;height:56px;z-index:20;display:none;align-items:center;gap:8px;
    padding:6px max(10px,env(safe-area-inset-right)) 6px max(10px,env(safe-area-inset-left));
    background:linear-gradient(#1b2438f2,#10172af2);border-bottom:2px solid #2b3a5e;box-shadow:0 6px 20px #0008}
  #nav.on{display:flex}
  .pchip{display:flex;align-items:center;gap:8px;cursor:pointer;background:#0c1222;border:1px solid #2c3a60;
    border-radius:12px;padding:4px 10px 4px 4px;min-width:0}
  .pav{width:38px;height:38px;border-radius:9px;display:grid;place-items:center;font-size:24px;position:relative;flex:none;
    box-shadow:inset 0 2px 0 #fff5,inset 0 -3px 0 #0004}
  .star{position:absolute;top:-8px;left:-8px;width:24px;height:24px;display:grid;place-items:center;font-size:11px;color:#3a2600;
    font-family:var(--fh);background:radial-gradient(circle at 40% 35%,#fff2b3,#ffcf3d 55%,#c98a00);
    clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
  .pinfo{min-width:0}
  .pinfo b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:110px}
  .xpbar{width:100px;height:7px;border-radius:4px;background:#26314f;overflow:hidden;margin-top:3px}
  .xpbar i{display:block;height:100%;background:linear-gradient(90deg,#7ff7ff,#3b8cff);border-radius:4px}
  .navbtns{display:flex;gap:6px;flex:1 1 0;min-width:0;justify-content:safe center;overflow-x:auto;scrollbar-width:none;padding-top:6px}
  .navbtns::-webkit-scrollbar{display:none}
  .nb{position:relative;flex:none;white-space:nowrap;border:0;background:linear-gradient(#2a3656,#1a233b);border:1px solid #34436a;border-radius:10px;
    padding:4px 10px;min-width:64px;cursor:pointer;display:flex;flex-direction:column;align-items:center;font-size:11px;color:#cfd8ee}
  .nb span{font-size:20px;line-height:1.1}
  .dot{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;border-radius:9px;background:#ff3b30;color:#fff;font-style:normal;
    font-size:11px;display:grid;place-items:center;border:2px solid #fff;padding:0 4px;animation:pulse 1.1s infinite}
  @keyframes pulse{50%{transform:scale(1.15)}}
  .money{display:flex;gap:6px;flex:none}
  .mchip{display:flex;align-items:center;gap:6px;background:#0c1222;border:1px solid #2c3a60;border-radius:10px;padding:4px 8px 4px 6px;
    font-size:15px;min-width:92px;justify-content:space-between;cursor:pointer}
  .mchip .plus{width:20px;height:20px;border-radius:6px;background:linear-gradient(#4be35a,#10a524);display:grid;place-items:center;font-size:15px;color:#fff}
  .coin,.cash,.gem{width:22px;height:22px;flex:none;display:inline-block;vertical-align:middle;background:var(--i-coin) center/contain no-repeat;filter:drop-shadow(0 1px 1px #0008)}
  .cash{width:30px;height:22px;background-image:var(--i-cash)}
  .gem{background-image:var(--i-gem)}
  .mchip .coin,.mchip .gem{width:28px;height:28px}.mchip .cash{width:36px;height:26px}
  .iconbtn{width:40px;height:40px;border-radius:10px;border:1px solid #34436a;background:linear-gradient(#2a3656,#1a233b);cursor:pointer;font-size:18px;flex:none}

  /* ---------- Screens ---------- */
  .screen{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;z-index:10;
    padding:66px 14px 14px;overflow:auto;touch-action:pan-x pan-y}
  .screen.on{display:flex}
  .screen.full{padding-top:14px}
  .head{display:flex;align-items:center;gap:12px;width:100%;max-width:1100px;margin-bottom:10px}
  .head h2{margin:0;font-family:var(--fh);font-weight:400;font-size:30px;color:#fff;text-shadow:0 3px 0 #0008,0 0 20px #ffcf3d55}
  .back{width:46px;height:46px;border-radius:10px;border:0;cursor:pointer;font-size:28px;flex:none;
    background:linear-gradient(#ff6a5e,#c2261b);box-shadow:inset 0 2px 0 #fff6,0 3px 0 #0008;display:grid;place-items:center;font-family:var(--fh)}

  .logo{text-align:center;margin:clamp(4px,3vh,26px) 0 clamp(8px,3vh,24px);position:relative}
  .logo .l8{display:inline-grid;place-items:center;width:clamp(50px,9vh,78px);height:clamp(50px,9vh,78px);border-radius:50%;vertical-align:middle;
    background:radial-gradient(circle at 32% 28%,#666,#161616 50%,#000);margin-right:6px;position:relative;z-index:1;
    box-shadow:0 0 0 3px #0006,0 6px 18px #000a}
  .logo .l8 span{width:46%;height:46%;border-radius:50%;background:#fff;color:#111;display:grid;place-items:center;font-family:var(--fh);font-size:clamp(18px,3.5vh,30px)}
  .logo h1{display:inline-block;vertical-align:middle;margin:0;font-family:var(--fh);font-weight:400;font-style:italic;
    font-size:clamp(46px,11vh,96px);line-height:1;letter-spacing:2px;position:relative;
    background:linear-gradient(180deg,#e9f6ff 0%,#78c2ff 30%,#1f7cf0 60%,#0a3fa0 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 4px 0 #041a44) drop-shadow(0 0 3px #041a44)}
  .logo .flame{position:absolute;left:8%;right:-6%;top:-12%;bottom:-8%;z-index:-1;border-radius:50%;
    background:radial-gradient(ellipse at 30% 60%,#ffdb4d 0%,#ff8a1f 35%,#e0350088 55%,transparent 70%);filter:blur(10px);opacity:.85;
    animation:flame 1.8s ease-in-out infinite alternate}
  @keyframes flame{to{transform:scale(1.06,1.12) translateX(8px);opacity:.65}}
  .logo p{margin:2px 0 0;font-family:var(--fh);color:#fff;letter-spacing:6px;font-size:clamp(12px,2.2vh,16px);text-shadow:0 2px 0 #000}

  .tiles{display:grid;grid-template-columns:repeat(3,minmax(150px,230px));gap:clamp(8px,1.6vh,14px);width:100%;justify-content:center}
  .tile{position:relative;border:0;border-radius:16px;cursor:pointer;overflow:hidden;min-height:clamp(74px,17vh,130px);
    padding:10px 12px;text-align:left;display:flex;flex-direction:column;justify-content:flex-end;color:#fff;
    box-shadow:inset 0 3px 0 #ffffff66,inset 0 -5px 0 #0003,0 6px 0 #0009,0 10px 24px #000a;transition:transform .1s,filter .15s}
  .tile:hover{filter:brightness(1.1);transform:translateY(-2px)}
  .tile:active{transform:translateY(3px);box-shadow:inset 0 3px 0 #ffffff66,0 2px 0 #0009}
  .tile .ic{position:absolute;right:8px;top:6px;font-size:clamp(34px,7vh,56px);filter:drop-shadow(0 4px 4px #0007);transform:rotate(-8deg)}
  .tile b{font-family:var(--fh);font-weight:400;font-size:clamp(20px,3.6vh,28px);line-height:1.05;text-shadow:0 3px 0 #0007;position:relative}
  .tile small{font-size:12px;opacity:.9;position:relative;text-shadow:0 1px 0 #0007}
  .tile::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;pointer-events:none;
    background:linear-gradient(100deg,transparent,rgba(255,255,255,.35),transparent);transform:skewX(-20deg);animation:shine 4.5s infinite}
  @keyframes shine{0%,70%{left:-60%}100%{left:130%}}
  .t-green{background:linear-gradient(160deg,#6cf06f,#16b52a 55%,#0c7f1b)}
  .t-red{background:linear-gradient(160deg,#ff8a5e,#e0351b 50%,#8e160c)}
  .t-teal{background:linear-gradient(160deg,#6ff2e6,#14b3a6 55%,#0a6f67)}
  .t-blue{background:linear-gradient(160deg,#7fb8ff,#2a7cf0 55%,#11409a)}
  .t-purple{background:linear-gradient(160deg,#c89bff,#8a3cf0 55%,#4b169a)}
  .t-gray{background:linear-gradient(160deg,#8b97b5,#4e5a78 55%,#2b3450)}
  .live{position:absolute;left:10px;top:10px;background:#ff2d2d;border-radius:6px;padding:1px 7px;font-size:11px;animation:pulse 1.2s infinite}

  .btn{position:relative;border:0;border-radius:12px;padding:11px 18px;font-family:var(--fh);font-weight:400;font-size:19px;letter-spacing:.5px;
    color:#fff;cursor:pointer;text-shadow:0 2px 0 #0007;box-shadow:inset 0 2px 0 #ffffff66,inset 0 -3px 0 #0003,0 4px 0 #0009;transition:transform .08s,filter .15s}
  .btn:hover{filter:brightness(1.1)}
  .btn:active{transform:translateY(2px);box-shadow:inset 0 2px 0 #ffffff66,0 2px 0 #0009}
  .btn:disabled{filter:grayscale(1) brightness(.7);cursor:default}
  .green{background:linear-gradient(#5cf05f,#11a526)}
  .blue{background:linear-gradient(#5aa2ff,#1553b3)}
  .red{background:linear-gradient(#ff6a5e,#b01e14)}
  .orange{background:linear-gradient(#ffc04d,#e06a00)}
  .gray{background:linear-gradient(#5f6b8a,#2d3548)}
  .purple{background:linear-gradient(#b47bff,#5a1fb3)}

  /* cities carousel */
  .carousel{display:flex;gap:18px;overflow-x:auto;scroll-snap-type:x mandatory;width:100%;max-width:1200px;padding:12px 20px 20px;
    scrollbar-width:thin;touch-action:pan-x}
  .city{scroll-snap-align:center;flex:0 0 clamp(230px,26vw,290px);border-radius:18px;padding:12px;position:relative;
    border:3px solid #ffffff30;box-shadow:inset 0 3px 0 #ffffff40,0 10px 30px #000b;display:flex;flex-direction:column;gap:8px}
  .city .ttl{text-align:center;line-height:.9;margin-top:4px}
  .city .ttl b{display:block;font-family:var(--fh);font-weight:400;font-size:40px;letter-spacing:1px;filter:drop-shadow(0 3px 0 #0009)}
  .city .ttl i{font-style:italic;font-family:var(--fh);font-size:20px;color:#fff;text-shadow:0 2px 0 #0009}
  .city .felt{height:70px;border-radius:12px;border:7px solid;position:relative;box-shadow:inset 0 0 20px #0008}
  .city .felt::before,.city .felt::after{content:"";position:absolute;top:50%;width:12px;height:12px;border-radius:50%;transform:translateY(-50%)}
  .city .felt::before{left:18%;background:#fff}
  .city .felt::after{right:18%;background:#ffcf3d;box-shadow:-13px -7px 0 #d62828,-13px 7px 0 #1f4fd1,-26px 0 0 #111}
  .prize{background:#0009;border-radius:12px;padding:8px;text-align:center}
  .prize .pl{font-size:13px;color:#cfd8ee}
  .prize .pv{font-family:var(--fh);font-size:32px;color:#ffe27a;display:flex;align-items:center;justify-content:center;gap:8px;text-shadow:0 3px 0 #0008}
  .crow{display:flex;justify-content:space-between;font-size:13px;background:#0006;border-radius:8px;padding:5px 9px}
  .lock{position:absolute;inset:0;border-radius:15px;background:#000a;display:grid;place-items:center;text-align:center;font-size:15px;z-index:2}
  .lock div div{font-size:46px}

  /* panels / cards */
  .panel{background:linear-gradient(#26314f,#161e33);border:2px solid #3b4a74;border-radius:18px;padding:16px;
    box-shadow:inset 0 2px 0 #ffffff22,0 20px 60px #000c;width:100%;max-width:1000px}
  .grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
  .card{background:linear-gradient(#2d3a5e,#1b2440);border:2px solid #3e4f7c;border-radius:14px;padding:12px;position:relative}
  .card.sel{border-color:var(--gold);box-shadow:0 0 0 2px #ffcf3d55,0 0 22px #ffcf3d44}
  .cuebar{height:14px;border-radius:7px;margin:10px 0 12px;box-shadow:0 3px 6px #0008}
  .stat{display:grid;grid-template-columns:78px 1fr;align-items:center;gap:8px;font-size:12px;color:#cfd8ee;margin:4px 0}
  .stat .bars{display:flex;gap:2px}
  .stat .bars i{flex:1;height:9px;border-radius:2px;background:#0d1426}
  .stat .bars i.on{background:linear-gradient(#ffe27a,#ff9d00)}
  .tabs{display:flex;gap:8px;margin-bottom:12px}
  .tab{flex:1;padding:10px;border-radius:10px;border:0;background:#141c30;color:#a7b2cc;cursor:pointer;font-family:var(--fh);font-size:18px}
  .tab.on{background:linear-gradient(#3b8cff,#1553b3);color:#fff}

  .avx{display:inline-block;border-radius:10px;overflow:hidden;flex:none;vertical-align:middle;background:#0003}
  .avx img{width:100%;height:100%;display:block}
  .avgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px}
  .avcard{background:linear-gradient(#2d3a5e,#1b2440);border:2px solid #3e4f7c;border-radius:12px;padding:8px;text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center}
  .avcard.sel{border-color:var(--gold);box-shadow:0 0 16px #ffcf3d55}
  .avcard .btn{padding:5px 8px;font-size:14px;width:100%}
  .pack{overflow:hidden}
  .ptag{position:absolute;top:10px;right:-30px;transform:rotate(35deg);background:#ff3b30;color:#fff;font-size:10px;padding:2px 34px;font-weight:900;text-transform:uppercase}
  .frow{display:grid;grid-template-columns:48px 1fr auto;gap:10px;align-items:center;background:#1a2340;border:1px solid #2c3a60;border-radius:12px;padding:8px 10px;margin-bottom:6px}
  .frow .av{width:44px;height:44px;border-radius:10px;display:grid;place-items:center;font-size:26px;position:relative}
  .frow .on{position:absolute;right:-3px;bottom:-3px;width:12px;height:12px;border-radius:50%;background:#3fe052;border:2px solid #1a2340}
  .codebox{display:flex;gap:8px;align-items:center;background:#0d1426;border:2px dashed #ffcf3d;border-radius:12px;padding:10px 14px;font-family:var(--fh);font-size:28px;letter-spacing:3px;color:#ffe27a;justify-content:space-between}
  .cuelist{display:flex;flex-direction:column;gap:10px}
  .cuerow{display:grid;grid-template-columns:minmax(0,1fr) 200px 150px;gap:14px;align-items:center;background:linear-gradient(#2d3a5e,#1b2440);border:2px solid #3e4f7c;border-radius:14px;padding:10px 14px}
  .cuerow.sel{border-color:var(--gold);box-shadow:0 0 0 2px #ffcf3d55,0 0 22px #ffcf3d44}
  .cuecv{width:100%;height:auto;display:block;margin-top:6px}
  .cuecvw{min-height:34px}
  .cuettl{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;font-weight:700}
  .cuettl b{font-size:20px;display:flex;align-items:center;gap:6px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pcs{background:#000a;color:#fff;border-radius:8px;padding:2px 8px;margin-left:4px}
  .cpts{text-align:center;color:#ffcf3d;font-size:13px;margin-top:4px;font-weight:700}
  .cuehead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px}
  .cpow{background:linear-gradient(#5b2c9a,#3a1670);border:2px solid #8a5ad0;border-radius:12px;padding:4px 14px;display:flex;flex-direction:column;font-size:13px}
  .cpow span{font-family:var(--fh);font-size:18px;color:#ffe27a}
  .subtabs{margin-bottom:10px}
  .surbox{display:flex;align-items:center;gap:12px;margin-bottom:10px;background:linear-gradient(#4a2a86,#26124a)}
  @media (max-width:700px){ .cuerow{grid-template-columns:1fr} }
  /* reward route */
  .route{display:grid;grid-template-columns:repeat(4,minmax(120px,1fr));gap:18px 14px;max-width:860px;width:100%}
  .rw{position:relative;border-radius:14px;padding:12px 8px 10px;text-align:center;min-height:130px;display:flex;flex-direction:column;justify-content:space-between;
    background:linear-gradient(#31c24a,#12822a);border:3px solid #6ff08a;box-shadow:inset 0 2px 0 #fff5,0 6px 0 #0008}
  .rw .ri{font-size:40px;filter:drop-shadow(0 4px 3px #0007)}
  .rw .rl{font-size:13px;text-shadow:0 1px 0 #0008}
  .rw .rb{border-radius:8px;padding:4px;font-family:var(--fh);font-size:16px;background:#0005}
  .rw.done{filter:grayscale(.3) brightness(.75)}
  .rw.now{animation:glow 1.2s ease-in-out infinite alternate;cursor:pointer}
  .rw.now .rb{background:linear-gradient(#ffe27a,#ff9d00);color:#3a2000}
  .rw.lockd{background:linear-gradient(#3a4668,#232c47);border-color:#56648e}
  @keyframes glow{from{box-shadow:inset 0 2px 0 #fff5,0 6px 0 #0008,0 0 0 #ffcf3d}to{box-shadow:inset 0 2px 0 #fff5,0 6px 0 #0008,0 0 28px #ffcf3d}}
  .dayn{position:absolute;top:-11px;left:50%;transform:translateX(-50%);background:#0c1222;border:2px solid #6ff08a;border-radius:10px;font-size:11px;padding:1px 8px;white-space:nowrap}

  /* leaderboard */
  .flag{vertical-align:middle;border-radius:3px;box-shadow:0 0 0 1px #0006}
  .lbtabs{flex:1;margin:0}
  .lbtabs .tab{font-size:16px;padding:8px 6px;white-space:nowrap}
  .lbhead{width:100%;max-width:980px;display:flex;align-items:center;gap:14px;background:linear-gradient(#2d3a5e,#1b2440);border:2px solid #3e4f7c;border-radius:14px;padding:10px 16px;margin-bottom:6px;flex-wrap:wrap}
  .lbhead .ttl{font-family:var(--fh);font-size:30px;color:var(--gold);line-height:1}
  .lbhead .ends{font-size:13px;color:#cfd8ee}
  .lbhead .pz{margin-left:auto;font-size:12px;line-height:1.3;color:#cfd8ee}
  .lbcols{width:100%;max-width:980px;display:grid;grid-template-columns:70px 1fr auto;padding:0 18px;font-size:12px;color:#8a96b4;text-transform:uppercase;letter-spacing:1px}
  .lb{width:100%;max-width:980px}
  .lbr .nm{display:flex;align-items:center;gap:8px;min-width:0}
  .lbr .nm b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .lbr small.sub{display:block;color:#ffcf3d;font-size:12px}
  .lvstar{position:relative;display:inline-grid;place-items:center;width:30px;height:30px;font-family:var(--fh);font-size:12px;color:#fff;flex:none;
    clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
  .lbr.up{box-shadow:inset 4px 0 0 #3fe052}
  .lbr.down{box-shadow:inset 4px 0 0 #ff4b3e}
  .lbr{display:grid;grid-template-columns:64px 52px 1fr auto;gap:10px;align-items:center;padding:8px 10px;border-radius:12px;background:#1a2340;margin-bottom:6px;border:1px solid #2c3a60}
  .lbr.me{background:linear-gradient(90deg,#3b2f08,#1a2340);border-color:var(--gold)}
  .lbr .rk{font-family:var(--fh);font-size:22px;text-align:center}
  .lbr .av{width:40px;height:40px;border-radius:9px;display:grid;place-items:center;font-size:24px}

  .minis{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,320px));gap:16px;justify-content:center;width:100%}
  /* wheel */
  .wheelwrap{position:relative;width:min(62vh,82vw,440px);aspect-ratio:1;margin:18px auto 14px}
  #wheel{position:absolute;inset:0;border-radius:50%;border:10px solid #ffcf3d;box-shadow:0 0 0 6px #7a4b00,0 0 40px #ffcf3d88,inset 0 0 30px #0008;
    transition:transform 5s cubic-bezier(.12,.72,.1,1)}
  #wheel .lbl{position:absolute;left:50%;top:50%;width:46%;height:30px;margin-top:-15px;transform-origin:0 50%;text-align:right;padding-right:7%;
    font-family:var(--fh);font-size:clamp(14px,3.2vh,22px);line-height:30px;color:#fff;text-shadow:0 2px 0 #0008;white-space:nowrap}
  .wpin{position:absolute;left:50%;top:-20px;transform:translateX(-50%);width:0;height:0;border-left:18px solid transparent;border-right:18px solid transparent;border-top:38px solid #ff3b30;filter:drop-shadow(0 3px 2px #0009);z-index:2}
  .whub{position:absolute;left:50%;top:50%;width:22%;height:22%;transform:translate(-50%,-50%);border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#666,#111 60%);display:grid;place-items:center;box-shadow:0 0 0 5px #ffcf3d}

  /* bracket */
  .bracket{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;width:100%;max-width:900px;align-items:center}
  .bracket h4{margin:0 0 6px;text-align:center;color:var(--gold);font-family:var(--fh);font-weight:400;font-size:18px}
  .match{background:#0f1628;border:2px solid #34436a;border-radius:10px;margin:8px 0;overflow:hidden}
  .match div{padding:6px 10px;font-size:13px;display:flex;gap:6px;align-items:center;min-height:30px}
  .match div+div{border-top:1px solid #26314f}
  .match .w{color:#8dff9a}
  .match .l{color:#6b7694;text-decoration:line-through}
  .match .me{background:#3b2f0866}
  .match .bye{color:#6b7694;font-style:italic}
  .match.big{display:flex;align-items:stretch;max-width:560px;margin:0 auto}
  .match.big>div{flex:1;font-size:17px;justify-content:center;padding:12px}
  .match.big .vs{flex:0 0 50px;font-family:var(--fh);color:var(--gold);border:0}
  .tourhead{width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
  .rchips{display:flex;gap:6px;flex-wrap:wrap}

  .tprize{font-family:var(--fh);font-size:20px;color:#ffe27a}

  .tgrid{width:100%;display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:4px 10px}
  .tgrid .match{margin:2px 0}

  /* VS screen */
  #vs{justify-content:center;flex-direction:row;gap:clamp(14px,5vw,70px)}
  .vsp{display:flex;flex-direction:column;align-items:center;gap:10px}
  .vsp .big{width:clamp(110px,26vh,190px);aspect-ratio:1;border-radius:18px;display:grid;place-items:center;font-size:clamp(60px,14vh,110px);
    position:relative;border:6px solid #3a4668;box-shadow:inset 0 3px 0 #fff5,0 10px 30px #000c}
  .vsp .big .star{width:44px;height:44px;font-size:18px;top:-18px;left:-18px}
  .vsp .nm{font-family:var(--fh);font-size:clamp(22px,4vh,32px);text-shadow:0 3px 0 #000}
  .vsL{animation:inL .5s cubic-bezier(.2,1.4,.4,1) both}
  .vsR{animation:inR .5s cubic-bezier(.2,1.4,.4,1) both .15s}
  @keyframes inL{from{transform:translateX(-60vw)}}
  @keyframes inR{from{transform:translateX(60vw)}}
  .vsmid{display:flex;flex-direction:column;align-items:center;gap:14px}

    filter:drop-shadow(0 4px 0 #6a3a00);animation:pop .6s cubic-bezier(.2,1.8,.4,1) both .5s}
  @keyframes pop{from{transform:scale(0)}}
  .pot{background:#0b1020e6;border:2px solid #3b4a74;border-radius:14px;padding:10px 18px;text-align:center;font-family:var(--fh);font-size:24px;color:#ffe27a;min-width:120px}
  .pot .stack{font-size:40px;line-height:1}

  /* modal */
  #modal{justify-content:center;background:#000b;z-index:40;padding-top:14px}

  #mIcon{font-size:64px;line-height:1;filter:drop-shadow(0 6px 6px #0008)}

  /* in-game DOM controls */
  #gameUi{position:fixed;left:max(10px,env(safe-area-inset-left));top:10px;z-index:15;display:none;flex-direction:column;gap:8px}

  .gbtn{width:48px;height:48px;border-radius:12px;border:0;cursor:pointer;font-size:22px;box-shadow:inset 0 2px 0 #fff6,0 3px 0 #0009}
  #chatPanel{position:fixed;left:70px;top:10px;z-index:16;display:none;flex-direction:column;gap:8px;width:300px;
    background:#0d1426ee;border:2px solid #34436a;border-radius:14px;padding:8px}
  #chatPanel.on{display:flex}
  #chatPanel button{border:0;border-radius:10px;padding:8px 10px;background:#243052;color:#fff;cursor:pointer;font-size:14px}

  #chatPanel .citems{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
  #chatPanel .citems.p{grid-template-columns:1fr}
  #chatPanel .citems.e button{font-size:26px;padding:6px}
  #cheerBar{position:fixed;bottom:12px;right:12px;z-index:15;display:none;gap:6px;background:#0d1426dd;border:2px solid #34436a;border-radius:14px;padding:6px}

  .floater{position:fixed;z-index:30;font-size:38px;pointer-events:none;opacity:0;animation:rise 2.2s ease-out forwards}
  @keyframes rise{0%{transform:translate(0,0) scale(.5);opacity:0}15%{opacity:1;transform:translate(0,-30px) scale(1.2)}100%{transform:translate(var(--dx),-55vh) scale(1);opacity:0}}

  /* toasts */
  #toasts{position:fixed;top:64px;left:50%;transform:translateX(-50%);z-index:50;display:flex;flex-direction:column;gap:8px;pointer-events:none;align-items:center}
  .toast{display:flex;align-items:center;gap:10px;background:linear-gradient(#27345a,#141c33);border:2px solid var(--gold);border-radius:14px;
    padding:8px 16px 8px 10px;box-shadow:0 10px 30px #000b;animation:tin .4s cubic-bezier(.2,1.5,.4,1),tout .4s ease-in 3.2s forwards;min-width:240px}
  .toast .ti{font-size:32px}
  .toast small{display:block;color:#ffe27a;font-size:11px;text-transform:uppercase;letter-spacing:1px}
  @keyframes tin{from{transform:translateY(-40px);opacity:0}}
  @keyframes tout{to{transform:translateY(-40px);opacity:0}}

  input.name{width:100%;padding:10px 12px;border-radius:10px;border:2px solid #3b4a74;background:#0d1426;color:#fff;font:inherit;font-size:16px;user-select:text;-webkit-user-select:text}
  .avs{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:8px;margin:12px 0}
  .avs button{height:52px;border-radius:10px;border:3px solid transparent;font-size:28px;cursor:pointer}
  .avs button.on{border-color:var(--gold)}
  .achs{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
  .ach{display:flex;gap:10px;align-items:center;background:#0f1628;border:1px solid #2c3a60;border-radius:10px;padding:8px}

  .ach span{font-size:28px}
  .ach small{display:block;color:#a7b2cc;font-size:11px;font-weight:700}
  .muted{color:var(--muted);font-size:13px}

  /* Phone held upright and the browser can't lock orientation (e.g. iPhone Safari):
     turn the whole game 90° so it always plays in landscape, filling the screen. */
  html.rot body{position:fixed;top:0;left:0;transform-origin:0 0;transform:rotate(90deg) translateY(-100%)}
  @media (max-width:1000px){ .nb{min-width:50px;padding:3px 6px;font-size:10px} .nb span{font-size:17px} .money{gap:4px} .mchip{min-width:0} #nav{gap:5px} .iconbtn{width:36px;height:36px} }
  @media (max-width:900px){ .pinfo{display:none} .pchip{padding:4px} .mchip{font-size:13px;gap:4px;padding:4px 5px} }
  @media (max-width:700px){ .navbtns{gap:4px} .nb{min-width:34px!important;padding:4px 3px!important} .nb span{font-size:19px!important} #nav{gap:4px} .mchip .plus{display:none} .iconbtn{width:30px!important;height:30px!important} }
  @media (max-width:1100px){ .nb{min-width:40px;padding:4px 6px;font-size:0} .nb span{font-size:22px} .iconbtn{width:34px;height:34px;font-size:16px} #fsBtn,#langBtn{display:none} }
  @media (max-width:760px){ .mchip .plus{display:none} .money{gap:3px} .mchip{padding:3px 5px;font-size:12px} #langBtn{display:none} }
  /* shop (special offers, coins & cash, free rewards, minigames, cues) */
  #shop .panel{margin-bottom:64px}
  .shopnav{position:fixed;left:0;right:0;bottom:0;z-index:12;display:flex;justify-content:center;gap:4px;padding:6px max(10px,env(safe-area-inset-left)) calc(6px + env(safe-area-inset-bottom));
    background:linear-gradient(#10204a,#081330);border-top:2px solid #2b4a9a;box-shadow:0 -6px 18px #0008}
  .shopnav button{flex:1;max-width:230px;border:0;background:transparent;color:#dfe6f7;font-weight:800;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px;
    padding:8px 6px;border-radius:12px;cursor:pointer}
  .shopnav button span{font-size:24px}
  .shopnav button.on{background:linear-gradient(#1d3a86,#122a66);color:#ffe27a;box-shadow:inset 0 0 0 2px #ffcf3d,0 0 16px #ffcf3d55}
  .packs{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .packcol{background:linear-gradient(#0f2a6a,#0a1a44);border:2px solid #2b4a9a;border-radius:16px;padding:10px}
  .packhead{display:flex;align-items:center;gap:10px;margin:0 4px 8px}
  .packhead h3{margin:0;font-family:var(--fh);font-weight:400;font-size:26px;color:#fff;text-shadow:0 2px 0 #0008;flex:1}
  .vipb{display:flex;align-items:center;gap:6px}.vipb b{background:#d8283a;border-radius:10px;padding:2px 12px;font-size:18px}.vipb img{height:44px}
  .packgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .pk{position:relative;overflow:hidden;border-radius:14px;background:radial-gradient(ellipse at 50% 35%,#1b4aa8,#0b1f55 70%);border:2px solid #2d56b0;
    padding:8px 8px 10px;display:flex;flex-direction:column;align-items:center;text-align:center}
  .pk.hot{border-color:#ffcf3d;box-shadow:0 0 14px #ffcf3d55}
  .pkimg{height:92px;display:grid;place-items:center;width:100%}
  .pkimg img{max-height:100%;max-width:100%;-webkit-mask-image:radial-gradient(ellipse 50% 50% at 50% 55%,#000 62%,transparent 100%);mask-image:radial-gradient(ellipse 50% 50% at 50% 55%,#000 62%,transparent 100%)}
  .pk .amt{font-family:var(--fh);font-size:24px;color:#fff;text-shadow:0 2px 0 #000a;margin-top:2px}
  .pk .vp{font-size:11px;color:#fff;font-weight:700;white-space:nowrap}.pk .vp span{color:#ffcf3d}
  .pk .btn{width:100%;margin-top:6px;font-size:18px;padding:8px}
  .rib{position:absolute;left:-30px;top:12px;transform:rotate(-45deg);background:linear-gradient(#ff3b30,#b0120a);color:#fff;font-weight:900;font-size:14px;
    padding:3px 34px;box-shadow:0 2px 4px #0008;z-index:2}
  .ptag2{position:absolute;right:0;top:0;background:linear-gradient(#ff3b30,#b0120a);color:#fff;font-weight:900;font-size:11px;padding:3px 8px;border-radius:0 12px 0 10px;z-index:1;text-transform:uppercase}
  .offers{display:grid;grid-template-columns:minmax(220px,340px) 1fr;gap:12px}
  .ltbanner{border-radius:18px;border:3px solid #ffcf3d;background:radial-gradient(ellipse at 50% 70%,#ff8a1f,#c2360a 55%,#5a0e04);padding:12px;display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:0 0 22px #ff8a1f66}
  .ltbanner img{width:100%;border-radius:12px;-webkit-mask-image:radial-gradient(ellipse 50% 50% at 50% 50%,#000 70%,transparent 100%);mask-image:radial-gradient(ellipse 50% 50% at 50% 50%,#000 70%,transparent 100%)}
  .lttitle{display:flex;flex-direction:column;align-items:center;transform:rotate(-4deg);font-family:var(--fh);line-height:1}
  .lttitle span:first-child{font-size:32px;background:linear-gradient(#fff6a0,#ffb300);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 #5a1a00)}
  .lttitle span:last-child{font-size:40px;color:#fff;text-shadow:0 3px 0 #5a1a00,0 0 12px #ffcf3d}
  .offcol{display:flex;flex-direction:column;gap:8px}
  .packgrid.g3 .pkimg{height:80px}
  .starter{position:relative;overflow:hidden;border-radius:16px;border:2px solid #ffcf3d;background:linear-gradient(#5b2c9a,#2a0e5a);padding:12px 12px 12px 20px;display:grid;gap:8px;justify-items:center}
  .stitems{display:flex;gap:16px;align-items:center}.stitems>span{display:flex;align-items:center;gap:6px;font-family:var(--fh);font-size:22px}
  .xcard{text-align:center}
  .freegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}

<div id="shade"></div>

    <button class="nb" data-go="friendsScr"><span>👥</span>Do'stlar<i class="dot" id="dotFr" style="display:none">!</i></button>
  </div>

function evalShot(balls, cx, cy, t, pa) {

    else for (let i = 0; i < 120; i++) {
      const x = rnd(R, FW - R), y = rnd(R, FH - R);
      if (G.balls.some(b => !b.out && b.n !== 0 && (b.x - x) ** 2 + (b.y - y) ** 2 < (2 * R + 2) ** 2)) continue;
      const s = bestShotFrom(x, y);

function update() {

let cueCat = "standard";
// a cue piece (victory or surprise); 4 pieces complete the cue
function addCuePiece(c) {
  profile.pieces = profile.pieces || {};
  const n = profile.pieces[c.id] = (profile.pieces[c.id] | 0) + 1;
  if (n >= c.pieces && !profile.cues.includes(c.id)) {
    profile.cues.push(c.id); delete profile.pieces[c.id];
    toast("🎱", cueName(c), T("Yangi kiy!")); if (profile.cues.length >= 4) unlock("collector");
  } else toast("🧩", `${cueName(c)} ${n}/${c.pieces}`, T("Kiy bo'lagi"));
  save();
  return n;
}
// a win in a city gives a piece of a victory cue from that city or a lower one
function victoryPiece(city) {
  const ci = CITIES.indexOf(city);
  const pool = CUES.filter(c => c.cat === "victory" && c.city <= ci && !profile.cues.includes(c.id));
  if (!pool.length) return null;
  pool.sort((a, b) => b.city - a.city);
  const c = Math.random() < 0.6 ? pool[0] : pick(pool);
  addCuePiece(c);
  return c;
}
function openSurpriseBox() {
  if (profile.cash < SURPRISE_BOX) { toast("😕", T("Pul yetmaydi"), T("Syurpriz qutisi")); return; }
  const pool = CUES.filter(c => c.cat === "surprise" && !profile.cues.includes(c.id));
  profile.cash -= SURPRISE_BOX;
  if (!pool.length) { addCoins(500000); toast("🎁", "+500 000", T("Syurpriz qutisi")); updateNav(); return; }
  const c = pick(pool), n = addCuePiece(c); updateNav(); Snd.win(); burst();
  openModal({icon: "🎁", title: T("Syurpriz qutisi"), text: `${cueName(c)} — ${Math.min(n, c.pieces)}/${c.pieces}`, extra: `<div class="cuecvw" id="surCue"></div>`,
    buttons: [{label: T("Yana ochish"), cls: "purple", fn: () => { buildShop("cues"); setTimeout(openSurpriseBox, 50); }}, {label: T("Yopish"), cls: "gray", fn: () => buildShop("cues")}]});
  $("surCue").appendChild(cueCanvas(c));
}

// ---------------------------------------------------------------- rewards (daily streak)
function streakIndex() {
  if (!profile.lastClaim) return 0;
  const d = dayDiff(profile.lastClaim, today());
  if (d === 0) return (profile.streak - 1) % REWARDS.length;
  if (d === 1) return profile.streak % REWARDS.length;
  return 0;
}
function buildRewards() {
  const claimable = profile.lastClaim !== today();
  if (profile.lastClaim && dayDiff(profile.lastClaim, today()) > 1) { profile.streak = 0; save(); }
  const idx = streakIndex();
  $("streakTxt").textContent = profile.streak;
  const box = $("routeList"); box.innerHTML = "";
  REWARDS.forEach((r, i) => {
    let cls = "rw", btn;
    if (i < idx || (i === idx && !claimable)) { cls += " done"; btn = "✓ Olindi"; }
    else if (i === idx && claimable) { cls += " now"; btn = "OLISH!"; }
    else { cls += " lockd"; btn = "🔒"; }
    const el = document.createElement("div"); el.className = cls;
    el.innerHTML = `<span class="dayn">${i + 1}-kun</span><div class="ri">${r.icon}</div><div class="rl">${r.label}</div><div class="rb">${btn}</div>`;
    if (i === idx && claimable) el.onclick = () => claimReward(r);
    box.appendChild(el);
  });
  const mid = new Date(); mid.setHours(24, 0, 0, 0); const ms = mid - Date.now();
  $("rwTimer").textContent = claimable ? "Bugungi sovg'angiz tayyor — bosing!" : `Keyingi sovg'a: ${Math.floor(ms / 36e5)} soat ${Math.floor(ms % 36e5 / 6e4)} daqiqadan keyin`;
}
function claimReward(r) {
  const d = profile.lastClaim ? dayDiff(profile.lastClaim, today()) : 99;
  profile.streak = d === 1 ? profile.streak + 1 : 1;
  profile.lastClaim = today();
  if (r.t === "coins") profile.coins += r.v;
  if (r.t === "cash") profile.cash += r.v;
  if (r.t === "lucky") profile.luckyTries += r.v;
  if (r.t === "wheel") profile.wheelTries += r.v;
  if (profile.streak >= 7) unlock("streak7");
  save(); updateNav(); Snd.coin(8); burst();
  toast(r.icon, r.label, "Kunlik sovg'a");
  buildRewards();
}

}
let wheelRot = 0, wheelBusy = false;
function buildWheel() {
  const w = $("wheel"), seg = 360 / WHEEL.length;
  w.style.background = `conic-gradient(${WHEEL.map((s, i) => `${s.color} ${i * seg}deg ${(i + 1) * seg}deg`).join(",")})`;
  w.innerHTML = WHEEL.map((s, i) => `<div class="lbl" style="transform:rotate(${i * seg + seg / 2 - 90}deg)">${s.label}</div>`).join("") +
    WHEEL.map((s, i) => `<div style="position:absolute;left:50%;top:50%;width:50%;height:2px;background:#fff6;transform-origin:0 50%;transform:rotate(${i * seg - 90}deg)"></div>`).join("");
  const free = profile.lastWheel !== today();
  $("spinBtn").textContent = free || profile.wheelTries ? "AYLANTIRISH (BEPUL)" : "AYLANTIRISH · 300 🪙";
  $("wheelNote").textContent = free ? "Kunlik bepul aylantirish" : profile.wheelTries ? `Qo'shimcha bepul: ${profile.wheelTries}` : "";
}
$("spinBtn").onclick = () => {
  if (wheelBusy) return;
  if (profile.lastWheel !== today()) profile.lastWheel = today();
  else if (profile.wheelTries > 0) profile.wheelTries--;
  else if (profile.coins >= 300) profile.coins -= 300;
  else { toast("😕", "Tanga yetmaydi", "G'ildirak"); return; }
  save(); updateNav(); wheelBusy = true; $("spinBtn").disabled = true;
  const total = WHEEL_WEIGHTS.reduce((a, b) => a + b, 0);
  let r = Math.random() * total, idx = 0;
  while (r > WHEEL_WEIGHTS[idx]) { r -= WHEEL_WEIGHTS[idx]; idx++; }
  const seg = 360 / WHEEL.length;
  const targetMod = (360 - (idx * seg + seg / 2) + rnd(-seg * 0.35, seg * 0.35) + 360) % 360;
  wheelRot += 360 * 6 + ((targetMod - wheelRot % 360) + 360) % 360;
  const w = $("wheel"); w.style.transform = `rotate(${wheelRot}deg)`;
  let last = -1;
  const tick = () => {
    const m = getComputedStyle(w).transform;
    if (m && m !== "none") {
      const v = m.split("(")[1].split(",").map(Number), a = (Math.atan2(v[1], v[0]) * 180 / Math.PI + 360) % 360;
      const s = Math.floor(a / seg); if (s !== last) { last = s; Snd.wheelTick(); }
    }
    if (wheelBusy) requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
  setTimeout(() => {
    wheelBusy = false; $("spinBtn").disabled = false;
    const p = WHEEL[idx];
    if (p.t === "cash") profile.cash += p.v; else profile.coins += p.v;
    save(); updateNav(); Snd.win(); burst();
    openModal({icon: "🎡", title: "Tabriklaymiz!", text: "G'ildirakdan yutuq:",
      extra: `<div class="reward">${p.t === "cash" ? '<span class="cash"></span>' : '<span class="coin"></span>'} +${fmt(p.v)}</div>`,
      buttons: [{label: "Ajoyib!", cls: "green", fn: () => go("wheelScr")}]});
  }, 5100);
};

// ---------------------------------------------------------------- server connection
// Same origin when served by server/server.js (or on localhost); CONFIG.server when running anywhere else (Y8, a file…).
// ?server=https://… overrides it once.
const Net = (() => {
  const qs = new URLSearchParams(location.search);
  if (qs.get("server")) store.set("b8server", qs.get("server"));
  const sameOrigin = location.protocol.startsWith("http") && !ON_PORTAL;
  const BASE = (store.get("b8server", "") || (sameOrigin ? location.origin : CONFIG.server) || "").replace(/\/$/, "");
  let acct = store.get("b8acct", null), ws = null, online = false, registering = null;
  const handlers = {};
  async function api(path, body) {
    if (!BASE) throw new Error("offline");
    const r = await fetch(BASE + path, {method: body ? "POST" : "GET",
      headers: {"Content-Type": "application/json", ...(acct ? {Authorization: `Bearer ${acct.id}:${acct.token}`} : {})},
      body: body ? JSON.stringify(body) : undefined});
    const j = await r.json().catch(() => ({}));
    if (!r.ok) { const e = new Error(j.error || String(r.status)); e.status = r.status; throw e; }
    return j;
  }
  function ensure() {
    if (acct) return Promise.resolve(acct);
    if (!registering) registering = api("/api/register", {name: profile.name, avatar: profile.avatar, country: profile.country})
      .then(r => { acct = r; store.set("b8acct", acct); return acct; }).finally(() => { registering = null; });
    return registering;
  }
  function applyGrant(g) {
    profile.cash += g.cash || 0; profile.coins += g.coins || 0; profile.gems = (profile.gems || 0) + (g.gems || 0); profile.vip = (profile.vip || 0) + (g.vip || 0); save();
    const why = {purchase: T("Xarid uchun rahmat!"), referral: T("Taklif bonusi"), invited: T("Do'stingiz qo'shildi"), gift: T("Sovg'a"),
      weekly: T("Haftalik reyting sovrini"), club: T("Klub mukofoti")}[g.kind] || "";
    toast(g.kind === "gift" ? "🎁" : "💰", `${g.cash ? "+" + fmt(g.cash) + " 💵 " : ""}${g.coins ? "+" + fmt(g.coins) + " 🪙 " : ""}${g.gems ? "+" + fmt(g.gems) + " 💎" : ""}`, `${why}${g.from ? " · " + g.from : ""}`);
    Snd.coin(6);
  }
  async function sync() {
    try {
      await ensure();
      const r = await api("/api/sync", {name: profile.name, avatar: profile.avatar, frame: profile.frame | 0, country: profile.country,
        level: profile.level, xp: profile.xp, won: profile.won, wins: profile.wins, games: profile.games,
        prefs: {allowFriend: opt("allowFriend"), showOnline: opt("showOnline")}});
      if (r.me) profile.league = r.me.league;
      online = true;
      for (const g of r.grants || []) applyGrant(g);
      Net.inbox = r.inbox || []; Net.me = r.me; Net.bought = r.bought || {};
      const d = $("dotFr"); if (d) { d.style.display = Net.inbox.length ? "" : "none"; d.textContent = Net.inbox.length; }
      updateNav();
      return r;
    } catch (e) {
      online = false;
      if (e.status === 401) { acct = null; store.set("b8acct", null); }
      return null;
    }
  }
  async function checkout(sku, btn) {
    try {
      if (btn) btn.disabled = true;
      await ensure();
      const r = await api("/api/checkout", {sku});
      location.href = r.url;
    } catch (e) {
      toast("⚠️", e.status === 503 ? T("To'lov tizimi hali ulanmagan") : T("Server bilan aloqa yo'q. Internetni tekshiring."), T("Do'kon"));
    } finally { if (btn) btn.disabled = false; }
  }
  function connect() {
    return new Promise((resolve, reject) => {
      if (ws && ws.readyState === 1) return resolve(ws);
      if (!BASE || !acct) return reject(new Error("offline"));
      const sock = new WebSocket(BASE.replace(/^http/, "ws") + `/ws?id=${encodeURIComponent(acct.id)}&token=${encodeURIComponent(acct.token)}`);
      const t = setTimeout(() => { reject(new Error("timeout")); try { sock.close(); } catch (e) {} }, 6000);
      sock.onopen = () => { clearTimeout(t); ws = sock; resolve(sock); };
      sock.onerror = () => { clearTimeout(t); reject(new Error("ws")); };
      sock.onclose = () => { if (ws === sock) ws = null; if (handlers.close) handlers.close(); };
      sock.onmessage = ev => { let m; try { m = JSON.parse(ev.data); } catch (e) { return; } if (handlers[m.t]) handlers[m.t](m); };
    });
  }
  const send = m => { if (ws && ws.readyState === 1) ws.send(JSON.stringify(m)); };
  return {api, ensure, sync, checkout, connect, send, on: (t, f) => { handlers[t] = f; },
    get acct() { return acct; }, get online() { return online; }, get base() { return BASE; }, inbox: [], me: null, friends: []};
})();
// Messages from the online opponent during a match
Net.on("aim", m => {
  const G = game; if (!G || !G.net || G.cur !== 1 || G.moving) return;
  G.angle = +m.a || 0; G.aiPull = clamp(+m.p || 0, 0, 1);
  if (G.ballInHand) { G.balls[0].x = clamp(+m.x, R, FW - R); G.balls[0].y = clamp(+m.y, R, FH - R); }
});
Net.on("shot", m => {
  const G = game; if (!G || !G.net || G.cur !== 1 || G.moving || G.strike) return;
  G.angle = +m.a || G.angle;
  requestShot(clamp(+m.power || 0.05, 0.03, 1), {x: +m.x, y: +m.y, vx: +m.vx, vy: +m.vy, dir: m.dir, follow: +m.follow || 0, side: +m.side || 0});
});
Net.on("state", m => {
  const G = game; if (!G || !G.net) return;
  if (G.moving || G.strike) G.pendingState = m; else applyState(m);
});
Net.on("chat", m => { if (game && game.net) bubble(1, String(m.msg || "").slice(0, 40)); });
Net.on("end", m => {   // opponent resigned (normal endings are already handled on this device)
  const G = game; if (!G || !G.net || G.over || m.reason === "normal") return;
  const w = localOf(m.winner);
  endGame(w, w === 0 ? T("Raqib o'yinni tark etdi") : T("MAG'LUBIYAT"));
});
Net.on("oppLeft", () => {
  const G = game; if (!G || !G.net || G.over) return;

        <div class="muted">${(LEAGUE_UI[c.league] || LEAGUE_UI[0]).i} ${T(LEAGUE_UI[c.league] ? LEAGUE_UI[c.league].n : "Bronza")} · 👥 ${c.members}/50 · ${T("Haftalik yutuq")}: <b style="color:#ffe27a">${fmtS(c.score)}</b> 🪙</div>
        <div class="muted">🏆 ${T("Haftaning eng yaxshi 3 klubi a'zolari oladi")}: 💵 ${r.prizes.join(" / ")}${c.lastWeek ? ` · ${T("O'tgan hafta")}: #${c.lastWeek.rank}` : ""}</div></div>
      <button class="btn red" id="clubLeave" style="padding:6px 14px">${T("Klubdan chiqish")}</button></div>
    <div class="tabs subtabs"><button class="tab${clubTab === "members" ? " on" : ""}" data-ct="members">👥 ${T("A'zolar")}</button><button class="tab${clubTab === "chat" ? " on" : ""}" data-ct="chat">💬 Chat</button></div>
    ${clubTab === "members" ? r.members.map((u, i) => `<div class="lbr${u.id === me ? " me" : ""}"><div class="rk">${i < 3 ? ["🥇", "🥈", "🥉"][i] : i + 1}</div>${avHTML(u.avatar, u.frame, 44)}
        <div class="nm">${lbStar(u.level)}${flagHTML(u.country)}<div style="min-width:0"><b>${esc(u.name)}</b> ${u.role === "owner" ? "👑" : ""}${u.online ? ' <span style="color:#3fe052">●</span>' : ""}<small class="sub">${leagueName(u.league)}</small></div></div>
        <div class="h" style="color:#ffe27a;font-size:18px">${fmtS(u.weekWon)} <span class="coin"></span></div></div>`).join("")
      : `<div class="chatbox" id="clubChat">${chatHTML(r.chat)}</div><div style="display:flex;gap:8px;margin-top:8px"><input class="name" id="clubMsg" maxlength="140" placeholder="${T("Xabar yozing…")}"><button class="btn green" id="clubSend">➤</button></div>`}`;
  box.querySelectorAll("[data-ct]").forEach(b => b.onclick = () => { clubTab = b.dataset.ct; clubHome(r); });
  $("clubLeave").onclick = () => openModal({icon: "🚪", title: T("Klubdan chiqish"), text: T("Rostdan ham chiqasizmi?"), buttons: [
    {label: T("Chiqish"), cls: "red", fn: () => Net.api("/api/clubs/leave", {}).then(() => buildClubs())}, {label: T("Yopish"), cls: "gray", fn: () => {}}]});
  if (clubTab === "chat") {
    const ch = $("clubChat"); ch.scrollTop = ch.scrollHeight;
    const sendMsg = () => { const t = $("clubMsg").value.trim(); if (!t) return; $("clubMsg").value = "";
      Net.api("/api/clubs/chat", {text: t}).then(x => { ch.innerHTML = chatHTML(x.chat); ch.scrollTop = ch.scrollHeight; }).catch(e => toast("⚠️", errText(e), "Chat")); };
    $("clubSend").onclick = sendMsg; $("clubMsg").onkeydown = e => { if (e.key === "Enter") sendMsg(); };
    clubTimer = setInterval(() => {
      if (!$("clubChat") || !document.getElementById("clubsScr").classList.contains("on")) return clearInterval(clubTimer);
      Net.api("/api/clubs/mine").then(x => { if (x.club && $("clubChat")) { const atEnd = ch.scrollTop + ch.clientHeight > ch.scrollHeight - 30; ch.innerHTML = chatHTML(x.chat); if (atEnd) ch.scrollTop = ch.scrollHeight; } }).catch(() => {});
    }, 4000);
  }
}

// ---------------------------------------------------------------- season pass ("Shoh gambiti") + daily missions
const PASS_TIERS = 30, PASS_STEP = 100, PASS_PRICE = 300;   // points per tier, premium price in cash
const seasonId = () => new Date().toISOString().slice(0, 7);
const seasonEnds = () => { const d = new Date(); return Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + 1, 1); };
// rewards: [free, premium] per tier
const passRew = (t, prem) => {
  if (t === PASS_TIERS) return prem ? {k: "cue", id: "p_shoh"} : {k: "frame", i: FRAMES.findIndex(f => f.pass)};
  if (t === 15) return prem ? {k: "cue", id: "p_ot"} : {k: "box"};
  const cyc = t % 5;
  if (!prem) return [{k: "coins", v: 200 * t}, {k: "piece"}, {k: "spin", v: 1}, {k: "cash", v: 2 + (t / 6 | 0)}, {k: "lucky", v: 1}][cyc];
  return [{k: "coins", v: 1000 * t}, {k: "box"}, {k: "cash", v: 5 + (t / 3 | 0)}, {k: "piece"}, {k: "coins", v: 2500 * t}][cyc];
};
const rewIcon = r => ({coins: ["🪙", fmtS(r.v)], cash: ["💵", r.v], piece: ["🧩", "x1"], spin: ["🎡", "x" + r.v], lucky: ["🎯", "x" + r.v], box: ["🎁", "x1"],
  cue: ["🎱", cueName(cueDef(r.id))], frame: ["🖼", T("Ramka")]}[r.k]);
function passState() {
  const s = profile.pass;
  if (!s || s.season !== seasonId()) profile.pass = {season: seasonId(), pts: 0, prem: false, got: {}, day: "", ms: []};
  const p = profile.pass;
  if (p.day !== today()) { p.day = today(); p.ms = pickMissions(); }
  return p;
}
const MISSIONS = [
  {k: "win", n: 2, pts: 100, d: "2 ta o'yinda g'alaba qozoning"}, {k: "win", n: 4, pts: 160, d: "4 ta o'yinda g'alaba qozoning"},
  {k: "play", n: 3, pts: 60, d: "3 ta o'yin o'ynang"}, {k: "pot", n: 15, pts: 80, d: "15 ta shar tushiring"}, {k: "pot", n: 30, pts: 120, d: "30 ta shar tushiring"},
  {k: "tour", n: 1, pts: 150, d: "Turnirda g'olib bo'ling"}, {k: "round", n: 2, pts: 90, d: "Turnirda 2 raund yuting"}, {k: "bigwin", n: 1, pts: 120, d: "Tokio yoki undan yuqori shaharda yuting"},
  {k: "lucky", n: 1, pts: 40, d: "Omadli zarbani o'ynang"}, {k: "club", n: 1, pts: 50, d: "Klubga qo'shiling yoki yarating"},
];
function pickMissions() { return shuffle(MISSIONS.map((m, i) => i)).slice(0, 4).map(i => ({i, c: 0, done: false})); }
function mission(k, n = 1) {
  const p = passState(); let changed = false;
  for (const m of p.ms) {
    const d = MISSIONS[m.i]; if (d.k !== k || m.done) continue;
    m.c = Math.min(d.n, m.c + n); changed = true;
    if (m.c >= d.n) { m.done = true; passPoints(d.pts); toast("✅", T(d.d), `+${d.pts} ♞`); }
  }
  if (changed) save();
}
function passPoints(n) {
  const p = passState(), before = Math.floor(p.pts / PASS_STEP);
  p.pts = Math.min(PASS_TIERS * PASS_STEP, p.pts + n); save();
  if (Math.floor(p.pts / PASS_STEP) > before) toast("♞", `${T("Pass darajasi")} ${Math.floor(p.pts / PASS_STEP)}`, T("Mukofot tayyor!"));
  updatePassDot();
}
function updatePassDot() {
  const p = passState(), tier = Math.floor(p.pts / PASS_STEP);
  let n = 0; for (let t = 1; t <= tier; t++) { if (!p.got[t + "f"]) n++; if (p.prem && !p.got[t + "p"]) n++; }
  const d = $("dotPass"); if (d) { d.style.display = n ? "" : "none"; d.textContent = n; }
}
function giveReward(r) {
  if (r.k === "coins") addCoins(r.v);
  else if (r.k === "cash") profile.cash += r.v;
  else if (r.k === "spin") profile.wheelTries += r.v;
  else if (r.k === "lucky") profile.luckyTries += r.v;
  else if (r.k === "piece") { const pool = CUES.filter(c => (c.cat === "victory" || c.cat === "surprise") && !profile.cues.includes(c.id)); if (pool.length) addCuePiece(pick(pool)); else addCoins(20000); }
  else if (r.k === "box") { const pool = CUES.filter(c => c.cat === "surprise" && !profile.cues.includes(c.id)); if (pool.length) addCuePiece(pick(pool)); else addCoins(100000); }
  else if (r.k === "cue") { if (!profile.cues.includes(r.id)) profile.cues.push(r.id); toast("🎱", cueName(cueDef(r.id)), T("Yangi kiy!")); }
  else if (r.k === "frame") { if (!profile.frames.includes(r.i)) profile.frames.push(r.i); toast("🖼", T(FRAMES[r.i].name), T("Sotib olindi!")); }
  save(); updateNav();
}
let passTimer = null;
function buildPass() {
  const p = passState(), tier = Math.floor(p.pts / PASS_STEP), box = $("passBody");
  $("passTitle").textContent = `♞ ${T("Shoh gambiti")}`;
  const cell = (t, prem) => {
    const r = passRew(t, prem), [ico, qty] = rewIcon(r), key = t + (prem ? "p" : "f"), got = p.got[key], open = tier >= t && (!prem || p.prem);
    return `<div class="ptier ${prem ? "prem" : "free"}${got ? " got" : ""}${prem && !p.prem ? " lock" : ""}"><div class="ico">${ico}</div><div class="qty">${esc(String(qty))}</div>
      ${got ? "✅" : open ? `<button class="btn green" data-claim="${key}">${T("Olish")}</button>` : ""}</div>`;
  };
  const bars = Array.from({length: PASS_TIERS}, (_, i) => { const t = i + 1, f = clamp((p.pts - i * PASS_STEP) / PASS_STEP, 0, 1);
    return `<div class="pbar${f >= 1 ? " done" : f > 0 ? " half" : ""}">${f > 0 && f < 1 ? `<i style="width:${f * 100}%"></i>` : ""}<span>${t}</span></div>`; });
  box.innerHTML = `<div class="passtop"><div><b>${T("O'ynang, missiyalarni bajaring va mukofotlar oling!")}</b><div class="muted">⏱ ${T("Mavsum tugashiga")}: <span id="passEnds"></span> · ♞ ${p.pts % PASS_STEP}/${PASS_STEP} (${T("daraja")} ${tier})</div></div>
      ${p.prem ? `<div class="h" style="color:#ffcf3d">👑 Premium</div>` : `<span style="display:flex;gap:6px"><button class="btn orange" id="passBuy">👑 ${T("Premium pass")} · <span class="cash"></span> ${PASS_PRICE}</button><button class="btn purple" id="passGem"><span class="gem"></span> 100</button></span>`}</div>
    <div class="passwrap"><div class="passgrid">${Array.from({length: PASS_TIERS}, (_, i) => cell(i + 1, false) + bars[i] + cell(i + 1, true)).join("")}</div></div>
    <div class="setsec">🎯 ${T("Bugungi missiyalar")}</div>
    ${p.ms.map(m => { const d = MISSIONS[m.i]; return `<div class="mission"><div style="font-size:28px">${m.done ? "✅" : "🎯"}</div>
      <div><b>${T(d.d)}</b><div class="mbar"><i style="width:${m.c / d.n * 100}%"></i></div></div><div class="h" style="text-align:right;color:#ffcf3d">${m.c}/${d.n} · +${d.pts} ♞</div></div>`; }).join("")}
    <p class="muted" style="text-align:center">${T("G'alaba: +30 ♞ · Mag'lubiyat: +10 ♞ · Turnir raundi: +25 ♞")}</p>`;
  const wrap = box.querySelector(".passwrap"); wrap.scrollLeft = Math.max(0, (tier - 2) * 126);
  box.querySelectorAll("[data-claim]").forEach(b => b.onclick = () => {
    const key = b.dataset.claim, t = parseInt(key), prem = key.endsWith("p");
    if (p.got[key]) return; p.got[key] = 1; giveReward(passRew(t, prem)); Snd.coin(6); updatePassDot();
    const left = wrap.scrollLeft; buildPass(); box.querySelector(".passwrap").scrollLeft = left;
  });
  if ($("passGem")) $("passGem").onclick = () => {
    if ((profile.gems || 0) < 100) return toast("😕", T("Olmos yetmaydi"), T("Premium pass"));
    profile.gems -= 100; p.prem = true; save(); updateNav(); Snd.win(); burst(); updatePassDot(); buildPass();
  };
  if ($("passBuy")) $("passBuy").onclick = () => {
    if (profile.cash < PASS_PRICE) return toast("😕", T("Pul yetmaydi"), T("Premium pass"));
    profile.cash -= PASS_PRICE; p.prem = true; save(); updateNav(); Snd.win(); burst(); updatePassDot(); buildPass();
  };
  clearInterval(passTimer);
  const tick = () => { const el = $("passEnds"); if (!el) return clearInterval(passTimer); const s = Math.max(0, (seasonEnds() - Date.now()) / 1000); el.textContent = `${Math.floor(s / 86400)}${T("k")} ${Math.floor(s % 86400 / 3600)}${T("s")} ${Math.floor(s % 3600 / 60)}${T("d")}`; };
  tick(); passTimer = setInterval(tick, 30000);
}

// ---------------------------------------------------------------- cue shop inside a match
function cuePicker() {
  const G = game; if (!G || G.moving) return;
  let cat = "owned";
  const render = () => {
    const list = CUES.filter(c => cat === "owned" ? profile.cues.includes(c.id) : c.cat === cat);
    $("mExtra").innerHTML = `<div class="tabs subtabs">${[["owned", "Meniki"], ["standard", "Standart"], ["country", "Davlat"], ["surprise", "Syurpriz"], ["victory", "G'alaba"]]
        .map(([k, n]) => `<button class="tab${k === cat ? " on" : ""}" data-pc="${k}" style="font-size:14px;padding:6px">${T(n)}</button>`).join("")}</div>
      <div id="pickList" style="max-height:48vh;overflow:auto;text-align:left">${list.map(c => {
        const own = profile.cues.includes(c.id);
        const btn = c.id === profile.cue ? `<span style="color:#ffcf3d;font-size:22px">✓</span>`
          : own ? `<button class="btn blue" style="padding:6px 12px">${T("TANLASH")}</button>`
          : c.pieces ? `<span class="pcs">${(profile.pieces || {})[c.id] | 0}/${c.pieces} 🔒</span>`
          : `<button class="btn ${c.cur === "cash" ? "purple" : "green"}" style="padding:6px 12px">${c.cur === "cash" ? '<span class="cash"></span>' : '<span class="coin"></span>'} ${fmtS(c.price)}</button>`;
        return `<div class="card" data-pick="${c.id}" style="display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;margin-bottom:8px;${c.id === profile.cue ? "border-color:#ffcf3d" : ""}">
          <div><b>${c.cc ? flagHTML(c.cc, 14) + " " : ""}${esc(cueName(c))}</b> <small class="muted">⚡${c.st[0]} 🎯${c.st[1]} 🌀${c.st[2]} ⏱${c.st[3]}</small><div class="cvslot"></div></div>${btn}</div>`; }).join("")
        || `<div class="muted" style="text-align:center;padding:14px">—</div>`}</div>`;
    $("mExtra").querySelectorAll("[data-pc]").forEach(b => b.onclick = () => { cat = b.dataset.pc; render(); });
    const io = "IntersectionObserver" in window ? new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { io.unobserve(e.target); e.target.appendChild(cueCanvas(cueDef(e.target.closest("[data-pick]").dataset.pick))); } }), {root: $("pickList")}) : null;
    $("mExtra").querySelectorAll("[data-pick]").forEach(el => {
      const c = cueDef(el.dataset.pick), slot = el.querySelector(".cvslot");
      if (io) io.observe(slot); else slot.appendChild(cueCanvas(c));
      const b = el.querySelector("button"); if (!b) return;
      b.onclick = () => {
        if (!profile.cues.includes(c.id)) {
          const bal = c.cur === "cash" ? profile.cash : profile.coins;
          if (bal < c.price) { toast("😕", T(c.cur === "cash" ? "Pul yetmaydi" : "Tanga yetmaydi"), cueName(c)); return; }
          if (c.cur === "cash") profile.cash -= c.price; else profile.coins -= c.price;
          profile.cues.push(c.id); Snd.coin(6); toast("🎱", cueName(c), T("Yangi kiy!"));
        }
        profile.cue = c.id; const me = G.players.find(pl => !pl.isAI && !pl.remote); if (me) me.cue = c.id;
        save(); updateNav(); Snd.click(); render();
      };
    });
  };
  openModal({icon: "🎱", title: T("Kiylar"), text: "", extra: "", buttons: [{label: T("Yopish"), cls: "gray", fn: () => {}}]});
  render();
}

// ---------------------------------------------------------------- language
// language: saved choice → device language (if we have it) → the language of the player's country → English
const CC_LANG = {UZ: "uz", RU: "ru", BY: "ru", KZ: "ru", KG: "ru", TJ: "ru", TM: "ru", UA: "ru", TR: "tr", AZ: "tr", CY: "tr",
  ES: "es", MX: "es", AR: "es", CO: "es", CL: "es", PE: "es", VE: "es", EC: "es", GT: "es", CU: "es", BO: "es", DO: "es", HN: "es", PY: "es", SV: "es", NI: "es", CR: "es", PA: "es", UY: "es",
  BR: "pt", PT: "pt", AO: "pt", MZ: "pt", FR: "fr", BE: "fr", SN: "fr", CI: "fr", CM: "fr", ML: "fr", DE: "de", AT: "de", CH: "de", LI: "de", ID: "id", IN: "hi", KR: "ko", JP: "ja", CN: "zh", TW: "zh", HK: "zh", MO: "zh", SG: "zh",
  SA: "ar", AE: "ar", EG: "ar", IQ: "ar", JO: "ar", KW: "ar", QA: "ar", BH: "ar", OM: "ar", YE: "ar", SY: "ar", LB: "ar", LY: "ar", DZ: "ar", MA: "ar", TN: "ar", SD: "ar", PS: "ar"};
function detectLang() {
  const saved = profile.lang;
  if (saved && LANGS[saved]) return saved;
  const dev = (navigator.languages || [navigator.language || ""]).map(l => l.slice(0, 2).toLowerCase());
  const cl = CC_LANG[profile.country || detectCountry()];
  if (dev[0] && LANGS[dev[0]] && !(dev[0] === "en" && cl)) return dev[0];   // browsers often default to English; the country is a better hint then
  if (cl) return cl;
  for (const l of dev) { if (LANGS[l]) return l; if (["kk", "ky", "tg", "be", "uk"].includes(l)) return "ru"; }
  return "en";
}
const staticText = [];   // [textNode, original Uzbek text]
(function collectStatic() {
  const walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT);
  for (let n; (n = walker.nextNode());) {
    const s = n.nodeValue.trim();
    if (s && !n.parentElement.closest("script,style,#chatPanel,#cheerBar")) staticText.push([n, s, n.nodeValue]);
  }
})();
function applyLang(l) {
  LANG = l; document.documentElement.lang = l;
  for (const [n, s, raw] of staticText) n.nodeValue = raw.replace(s, T(s));
  buildChat();
}
$("langBtn").onclick = () => openModal({icon: "🌐", title: T("Til"), text: "", buttons: Object.entries(LANGS).map(([k, name]) => ({
  label: name, cls: k === LANG ? "green" : "gray", fn: () => { profile.lang = k; save(); applyLang(k); go(document.querySelector(".screen.on") ? document.querySelector(".screen.on").id : "home"); }}))});
// the player's country (flag on the leaderboards) is detected automatically unless they picked one in the profile
if (!profile.countryManual) { const cc = detectCountry(); if (cc && cc !== profile.country) { profile.country = cc; save(); } }
applyLang(detectLang());

toMenu();
if (profile.lastClaim !== today()) setTimeout(() => toast("🎁", T("Kunlik sovg'a tayyor!"), T("Sovg'alar yo'li")), 1200);
// online: register / sync in the background, accept invite links (?ref=CODE) and return from checkout (?paid=1)
(async () => {
  const qs = new URLSearchParams(location.search);
  const r = await Net.sync();
  if (!r) return;
  const ref = (qs.get("ref") || "").toUpperCase();
  if (ref && !r.referredBy && ref !== Net.acct.code) Net.api("/api/referral", {code: ref}).then(() => Net.sync()).catch(() => {});
  if (qs.get("paid") === "1") { toast("💳", T("Xarid uchun rahmat!"), T("Do'kon")); setTimeout(() => Net.sync(), 3000); }
  if (qs.has("ref") || qs.has("paid")) history.replaceState(null, "", location.pathname);
})();
setInterval(() => { if (mode === "menu") { Net.sync(); checkFriendsOnline(); } }, 60000);
applySettings(); updatePassDot(); setTimeout(checkFriendsOnline, 5000);
requestAnimationFrame(frame);
</script>
