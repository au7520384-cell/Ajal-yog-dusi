<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Bilyard 8 — Ustalar Ligasi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b1220; --text:#f3f5fa; --muted:#a7b2cc; --gold:#ffcf3d;
    --fh:"Lilita One","Arial Black",Impact,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
    font-family:Nunito,"Trebuchet MS","Segoe UI",system-ui,sans-serif;font-weight:800;overflow:hidden;
    user-select:none;-webkit-user-select:none;touch-action:none}
  button{font:inherit;color:inherit}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
  .h{font-family:var(--fh);font-weight:400;letter-spacing:.5px}

  /* ---------- Menu backdrop over the live demo game ---------- */
  #shade{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity .4s;overflow:hidden;
    background:
      radial-gradient(ellipse at 50% 25%,rgba(255,200,110,.22),transparent 55%),
      linear-gradient(180deg,rgba(20,14,6,.78),rgba(8,6,3,.9));
    -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
  #shade.on{opacity:1}
  #shade::before{content:"";position:absolute;inset:-50%;opacity:.35;
    background:repeating-conic-gradient(from 0deg at 50% 50%,rgba(255,220,150,.22) 0deg 5deg,transparent 5deg 13deg);
    -webkit-mask:radial-gradient(circle at 50% 50%,#000 0%,transparent 45%);mask:radial-gradient(circle at 50% 50%,#000 0%,transparent 45%);
    animation:spinRays 60s linear infinite}
  @keyframes spinRays{to{transform:rotate(360deg)}}
  .spark{position:absolute;width:4px;height:4px;border-radius:50%;background:#ffe7a8;box-shadow:0 0 8px #ffcf3d;
    opacity:0;animation:floatUp linear infinite}
  @keyframes floatUp{0%{transform:translateY(0);opacity:0}15%{opacity:.9}100%{transform:translateY(-70vh);opacity:0}}

  /* ---------- Top navigation ---------- */
  #nav{position:fixed;top:0;left:0;right:0;height:56px;z-index:20;display:none;align-items:center;gap:8px;
    padding:6px max(10px,env(safe-area-inset-right)) 6px max(10px,env(safe-area-inset-left));
    background:linear-gradient(#1b2438f2,#10172af2);border-bottom:2px solid #2b3a5e;box-shadow:0 6px 20px #0008}
  #nav.on{display:flex}
  .pchip{display:flex;align-items:center;gap:8px;cursor:pointer;background:#0c1222;border:1px solid #2c3a60;
    border-radius:12px;padding:4px 10px 4px 4px;min-width:0}
  .pav{width:38px;height:38px;border-radius:9px;display:grid;place-items:center;font-size:24px;position:relative;flex:none;
    box-shadow:inset 0 2px 0 #fff5,inset 0 -3px 0 #0004}
  .star{position:absolute;top:-8px;left:-8px;width:24px;height:24px;display:grid;place-items:center;font-size:11px;color:#3a2600;
    font-family:var(--fh);background:radial-gradient(circle at 40% 35%,#fff2b3,#ffcf3d 55%,#c98a00);
    clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
  .pinfo{min-width:0}
  .pinfo b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:110px}
  .xpbar{width:100px;height:7px;border-radius:4px;background:#26314f;overflow:hidden;margin-top:3px}
  .xpbar i{display:block;height:100%;background:linear-gradient(90deg,#7ff7ff,#3b8cff);border-radius:4px}
  .navbtns{display:flex;gap:6px;margin:0 auto;overflow-x:auto;scrollbar-width:none;padding-top:6px}
  .navbtns::-webkit-scrollbar{display:none}
  .nb{position:relative;border:0;background:linear-gradient(#2a3656,#1a233b);border:1px solid #34436a;border-radius:10px;
    padding:4px 10px;min-width:64px;cursor:pointer;display:flex;flex-direction:column;align-items:center;font-size:11px;color:#cfd8ee}
  .nb span{font-size:20px;line-height:1.1}
  .dot{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;border-radius:9px;background:#ff3b30;color:#fff;font-style:normal;
    font-size:11px;display:grid;place-items:center;border:2px solid #fff;padding:0 4px;animation:pulse 1.1s infinite}
  @keyframes pulse{50%{transform:scale(1.15)}}
  .money{display:flex;gap:6px;flex:none}
  .mchip{display:flex;align-items:center;gap:6px;background:#0c1222;border:1px solid #2c3a60;border-radius:10px;padding:4px 8px 4px 6px;
    font-size:15px;min-width:92px;justify-content:space-between;cursor:pointer}
  .mchip .plus{width:20px;height:20px;border-radius:6px;background:linear-gradient(#4be35a,#10a524);display:grid;place-items:center;font-size:15px;color:#fff}
  .coin{width:20px;height:20px;border-radius:50%;flex:none;display:inline-block;vertical-align:middle;
    background:radial-gradient(circle at 35% 30%,#fff7c2,#ffcf3d 40%,#d08a00 75%,#8a5a00);box-shadow:inset 0 0 0 2px #b77900,0 1px 0 #0006;position:relative}
  .coin::after{content:"";position:absolute;inset:22%;border-radius:50%;border:2px solid #fff3}
  .cash{width:24px;height:15px;border-radius:3px;flex:none;display:inline-block;vertical-align:middle;
    background:linear-gradient(135deg,#9ef08a,#3fae3a);box-shadow:inset 0 0 0 2px #2a7a26,0 1px 0 #0006;position:relative}
  .cash::after{content:"";position:absolute;left:8px;top:3px;width:8px;height:8px;border-radius:50%;background:#2a7a26}
  .iconbtn{width:40px;height:40px;border-radius:10px;border:1px solid #34436a;background:linear-gradient(#2a3656,#1a233b);cursor:pointer;font-size:18px;flex:none}

  /* ---------- Screens ---------- */
  .screen{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;z-index:10;
    padding:66px 14px 14px;overflow:auto;touch-action:pan-x pan-y}
  .screen.on{display:flex}
  .screen.full{padding-top:14px}
  .head{display:flex;align-items:center;gap:12px;width:100%;max-width:1100px;margin-bottom:10px}
  .head h2{margin:0;font-family:var(--fh);font-weight:400;font-size:30px;color:#fff;text-shadow:0 3px 0 #0008,0 0 20px #ffcf3d55}
  .back{width:46px;height:46px;border-radius:10px;border:0;cursor:pointer;font-size:28px;flex:none;
    background:linear-gradient(#ff6a5e,#c2261b);box-shadow:inset 0 2px 0 #fff6,0 3px 0 #0008;display:grid;place-items:center;font-family:var(--fh)}

  .logo{text-align:center;margin:clamp(4px,3vh,26px) 0 clamp(8px,3vh,24px);position:relative}
  .logo .l8{display:inline-grid;place-items:center;width:clamp(50px,9vh,78px);height:clamp(50px,9vh,78px);border-radius:50%;vertical-align:middle;
    background:radial-gradient(circle at 32% 28%,#666,#161616 50%,#000);margin-right:6px;position:relative;z-index:1;
    box-shadow:0 0 0 3px #0006,0 6px 18px #000a}
  .logo .l8 span{width:46%;height:46%;border-radius:50%;background:#fff;color:#111;display:grid;place-items:center;font-family:var(--fh);font-size:clamp(18px,3.5vh,30px)}
  .logo h1{display:inline-block;vertical-align:middle;margin:0;font-family:var(--fh);font-weight:400;font-style:italic;
    font-size:clamp(46px,11vh,96px);line-height:1;letter-spacing:2px;position:relative;
    background:linear-gradient(180deg,#e9f6ff 0%,#78c2ff 30%,#1f7cf0 60%,#0a3fa0 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 4px 0 #041a44) drop-shadow(0 0 3px #041a44)}
  .logo .flame{position:absolute;left:8%;right:-6%;top:-12%;bottom:-8%;z-index:-1;border-radius:50%;
    background:radial-gradient(ellipse at 30% 60%,#ffdb4d 0%,#ff8a1f 35%,#e0350088 55%,transparent 70%);filter:blur(10px);opacity:.85;
    animation:flame 1.8s ease-in-out infinite alternate}
  @keyframes flame{to{transform:scale(1.06,1.12) translateX(8px);opacity:.65}}
  .logo p{margin:2px 0 0;font-family:var(--fh);color:#fff;letter-spacing:6px;font-size:clamp(12px,2.2vh,16px);text-shadow:0 2px 0 #000}

  .tiles{display:grid;grid-template-columns:repeat(3,minmax(150px,230px));gap:clamp(8px,1.6vh,14px);width:100%;justify-content:center}
  .tile{position:relative;border:0;border-radius:16px;cursor:pointer;overflow:hidden;min-height:clamp(74px,17vh,130px);
    padding:10px 12px;text-align:left;display:flex;flex-direction:column;justify-content:flex-end;color:#fff;
    box-shadow:inset 0 3px 0 #ffffff66,inset 0 -5px 0 #0003,0 6px 0 #0009,0 10px 24px #000a;transition:transform .1s,filter .15s}
  .tile:hover{filter:brightness(1.1);transform:translateY(-2px)}
  .tile:active{transform:translateY(3px);box-shadow:inset 0 3px 0 #ffffff66,0 2px 0 #0009}
  .tile .ic{position:absolute;right:8px;top:6px;font-size:clamp(34px,7vh,56px);filter:drop-shadow(0 4px 4px #0007);transform:rotate(-8deg)}
  .tile b{font-family:var(--fh);font-weight:400;font-size:clamp(20px,3.6vh,28px);line-height:1.05;text-shadow:0 3px 0 #0007;position:relative}
  .tile small{font-size:12px;opacity:.9;position:relative;text-shadow:0 1px 0 #0007}
  .tile::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;pointer-events:none;
    background:linear-gradient(100deg,transparent,rgba(255,255,255,.35),transparent);transform:skewX(-20deg);animation:shine 4.5s infinite}
  @keyframes shine{0%,70%{left:-60%}100%{left:130%}}
  .t-green{background:linear-gradient(160deg,#6cf06f,#16b52a 55%,#0c7f1b)}
  .t-red{background:linear-gradient(160deg,#ff8a5e,#e0351b 50%,#8e160c)}
  .t-teal{background:linear-gradient(160deg,#6ff2e6,#14b3a6 55%,#0a6f67)}
  .t-blue{background:linear-gradient(160deg,#7fb8ff,#2a7cf0 55%,#11409a)}
  .t-purple{background:linear-gradient(160deg,#c89bff,#8a3cf0 55%,#4b169a)}
  .t-gray{background:linear-gradient(160deg,#8b97b5,#4e5a78 55%,#2b3450)}
  .live{position:absolute;left:10px;top:10px;background:#ff2d2d;border-radius:6px;padding:1px 7px;font-size:11px;animation:pulse 1.2s infinite}

  .btn{position:relative;border:0;border-radius:12px;padding:11px 18px;font-family:var(--fh);font-weight:400;font-size:19px;letter-spacing:.5px;
    color:#fff;cursor:pointer;text-shadow:0 2px 0 #0007;box-shadow:inset 0 2px 0 #ffffff66,inset 0 -3px 0 #0003,0 4px 0 #0009;transition:transform .08s,filter .15s}
  .btn:hover{filter:brightness(1.1)}
  .btn:active{transform:translateY(2px);box-shadow:inset 0 2px 0 #ffffff66,0 2px 0 #0009}
  .btn:disabled{filter:grayscale(1) brightness(.7);cursor:default}
  .green{background:linear-gradient(#5cf05f,#11a526)}
  .blue{background:linear-gradient(#5aa2ff,#1553b3)}
  .red{background:linear-gradient(#ff6a5e,#b01e14)}
  .orange{background:linear-gradient(#ffc04d,#e06a00)}
  .gray{background:linear-gradient(#5f6b8a,#2d3548)}
  .purple{background:linear-gradient(#b47bff,#5a1fb3)}

  /* cities carousel */
  .carousel{display:flex;gap:18px;overflow-x:auto;scroll-snap-type:x mandatory;width:100%;max-width:1200px;padding:12px 20px 20px;
    scrollbar-width:thin;touch-action:pan-x}
  .city{scroll-snap-align:center;flex:0 0 clamp(230px,26vw,290px);border-radius:18px;padding:12px;position:relative;
    border:3px solid #ffffff30;box-shadow:inset 0 3px 0 #ffffff40,0 10px 30px #000b;display:flex;flex-direction:column;gap:8px}
  .city .ttl{text-align:center;line-height:.9;margin-top:4px}
  .city .ttl b{display:block;font-family:var(--fh);font-weight:400;font-size:40px;letter-spacing:1px;filter:drop-shadow(0 3px 0 #0009)}
  .city .ttl i{font-style:italic;font-family:var(--fh);font-size:20px;color:#fff;text-shadow:0 2px 0 #0009}
  .city .felt{height:70px;border-radius:12px;border:7px solid;position:relative;box-shadow:inset 0 0 20px #0008}
  .city .felt::before,.city .felt::after{content:"";position:absolute;top:50%;width:12px;height:12px;border-radius:50%;transform:translateY(-50%)}
  .city .felt::before{left:18%;background:#fff}
  .city .felt::after{right:18%;background:#ffcf3d;box-shadow:-13px -7px 0 #d62828,-13px 7px 0 #1f4fd1,-26px 0 0 #111}
  .prize{background:#0009;border-radius:12px;padding:8px;text-align:center}
  .prize .pl{font-size:13px;color:#cfd8ee}
  .prize .pv{font-family:var(--fh);font-size:32px;color:#ffe27a;display:flex;align-items:center;justify-content:center;gap:8px;text-shadow:0 3px 0 #0008}
  .crow{display:flex;justify-content:space-between;font-size:13px;background:#0006;border-radius:8px;padding:5px 9px}
  .lock{position:absolute;inset:0;border-radius:15px;background:#000a;display:grid;place-items:center;text-align:center;font-size:15px;z-index:2}
  .lock div div{font-size:46px}

  /* panels / cards */
  .panel{background:linear-gradient(#26314f,#161e33);border:2px solid #3b4a74;border-radius:18px;padding:16px;
    box-shadow:inset 0 2px 0 #ffffff22,0 20px 60px #000c;width:100%;max-width:1000px}
  .grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
  .card{background:linear-gradient(#2d3a5e,#1b2440);border:2px solid #3e4f7c;border-radius:14px;padding:12px;position:relative}
  .card.sel{border-color:var(--gold);box-shadow:0 0 0 2px #ffcf3d55,0 0 22px #ffcf3d44}
  .cuebar{height:14px;border-radius:7px;margin:10px 0 12px;box-shadow:0 3px 6px #0008}
  .stat{display:grid;grid-template-columns:78px 1fr;align-items:center;gap:8px;font-size:12px;color:#cfd8ee;margin:4px 0}
  .stat .bars{display:flex;gap:2px}
  .stat .bars i{flex:1;height:9px;border-radius:2px;background:#0d1426}
  .stat .bars i.on{background:linear-gradient(#ffe27a,#ff9d00)}
  .tabs{display:flex;gap:8px;margin-bottom:12px}
  .tab{flex:1;padding:10px;border-radius:10px;border:0;background:#141c30;color:#a7b2cc;cursor:pointer;font-family:var(--fh);font-size:18px}
  .tab.on{background:linear-gradient(#3b8cff,#1553b3);color:#fff}

  /* reward route */
  .route{display:grid;grid-template-columns:repeat(4,minmax(120px,1fr));gap:18px 14px;max-width:860px;width:100%}
  .rw{position:relative;border-radius:14px;padding:12px 8px 10px;text-align:center;min-height:130px;display:flex;flex-direction:column;justify-content:space-between;
    background:linear-gradient(#31c24a,#12822a);border:3px solid #6ff08a;box-shadow:inset 0 2px 0 #fff5,0 6px 0 #0008}
  .rw .ri{font-size:40px;filter:drop-shadow(0 4px 3px #0007)}
  .rw .rl{font-size:13px;text-shadow:0 1px 0 #0008}
  .rw .rb{border-radius:8px;padding:4px;font-family:var(--fh);font-size:16px;background:#0005}
  .rw.done{filter:grayscale(.3) brightness(.75)}
  .rw.now{animation:glow 1.2s ease-in-out infinite alternate;cursor:pointer}
  .rw.now .rb{background:linear-gradient(#ffe27a,#ff9d00);color:#3a2000}
  .rw.lockd{background:linear-gradient(#3a4668,#232c47);border-color:#56648e}
  @keyframes glow{from{box-shadow:inset 0 2px 0 #fff5,0 6px 0 #0008,0 0 0 #ffcf3d}to{box-shadow:inset 0 2px 0 #fff5,0 6px 0 #0008,0 0 28px #ffcf3d}}
  .dayn{position:absolute;top:-11px;left:50%;transform:translateX(-50%);background:#0c1222;border:2px solid #6ff08a;border-radius:10px;font-size:11px;padding:1px 8px;white-space:nowrap}

  /* leaderboard */
  .lb{width:100%;max-width:720px}
  .lbr{display:grid;grid-template-columns:44px 44px 1fr auto;gap:10px;align-items:center;padding:8px 10px;border-radius:12px;background:#1a2340;margin-bottom:6px;border:1px solid #2c3a60}
  .lbr.me{background:linear-gradient(90deg,#3b2f08,#1a2340);border-color:var(--gold)}
  .lbr .rk{font-family:var(--fh);font-size:22px;text-align:center}
  .lbr .av{width:40px;height:40px;border-radius:9px;display:grid;place-items:center;font-size:24px}

  .minis{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,320px));gap:16px;justify-content:center;width:100%}
  /* wheel */
  .wheelwrap{position:relative;width:min(62vh,82vw,440px);aspect-ratio:1;margin:18px auto 14px}
  #wheel{position:absolute;inset:0;border-radius:50%;border:10px solid #ffcf3d;box-shadow:0 0 0 6px #7a4b00,0 0 40px #ffcf3d88,inset 0 0 30px #0008;
    transition:transform 5s cubic-bezier(.12,.72,.1,1)}
  #wheel .lbl{position:absolute;left:50%;top:50%;width:46%;height:30px;margin-top:-15px;transform-origin:0 50%;text-align:right;padding-right:7%;
    font-family:var(--fh);font-size:clamp(14px,3.2vh,22px);line-height:30px;color:#fff;text-shadow:0 2px 0 #0008;white-space:nowrap}
  .wpin{position:absolute;left:50%;top:-20px;transform:translateX(-50%);width:0;height:0;border-left:18px solid transparent;border-right:18px solid transparent;border-top:38px solid #ff3b30;filter:drop-shadow(0 3px 2px #0009);z-index:2}
  .whub{position:absolute;left:50%;top:50%;width:22%;height:22%;transform:translate(-50%,-50%);border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#666,#111 60%);display:grid;place-items:center;box-shadow:0 0 0 5px #ffcf3d}
  .whub span{width:48%;height:48%;border-radius:50%;background:#fff;color:#111;display:grid;place-items:center;font-family:var(--fh);font-size:clamp(14px,3vh,22px)}

  /* bracket */
  .bracket{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;width:100%;max-width:900px;align-items:center}
  .bracket h4{margin:0 0 6px;text-align:center;color:var(--gold);font-family:var(--fh);font-weight:400;font-size:18px}
  .match{background:#0f1628;border:2px solid #34436a;border-radius:10px;margin:8px 0;overflow:hidden}
  .match div{padding:6px 10px;font-size:13px;display:flex;gap:6px;align-items:center;min-height:30px}
  .match div+div{border-top:1px solid #26314f}
  .match .w{color:#8dff9a}
  .match .l{color:#6b7694;text-decoration:line-through}
  .match .me{background:#3b2f0866}

  /* VS screen */
  #vs{justify-content:center;flex-direction:row;gap:clamp(14px,5vw,70px)}
  .vsp{display:flex;flex-direction:column;align-items:center;gap:10px}
  .vsp .big{width:clamp(110px,26vh,190px);aspect-ratio:1;border-radius:18px;display:grid;place-items:center;font-size:clamp(60px,14vh,110px);
    position:relative;border:6px solid #3a4668;box-shadow:inset 0 3px 0 #fff5,0 10px 30px #000c}
  .vsp .big .star{width:44px;height:44px;font-size:18px;top:-18px;left:-18px}
  .vsp .nm{font-family:var(--fh);font-size:clamp(22px,4vh,32px);text-shadow:0 3px 0 #000}
  .vsL{animation:inL .5s cubic-bezier(.2,1.4,.4,1) both}
  .vsR{animation:inR .5s cubic-bezier(.2,1.4,.4,1) both .15s}
  @keyframes inL{from{transform:translateX(-60vw)}}
  @keyframes inR{from{transform:translateX(60vw)}}
  .vsmid{display:flex;flex-direction:column;align-items:center;gap:14px}
  .vstxt{font-family:var(--fh);font-size:clamp(50px,12vh,96px);background:linear-gradient(#fff6b0,#ffcf3d 45%,#ff8a00);-webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 4px 0 #6a3a00);animation:pop .6s cubic-bezier(.2,1.8,.4,1) both .5s}
  @keyframes pop{from{transform:scale(0)}}
  .pot{background:#0b1020e6;border:2px solid #3b4a74;border-radius:14px;padding:10px 18px;text-align:center;font-family:var(--fh);font-size:24px;color:#ffe27a;min-width:120px}
  .pot .stack{font-size:40px;line-height:1}

  /* modal */
  #modal{justify-content:center;background:#000b;z-index:40;padding-top:14px}
  #modal .panel{max-width:460px;text-align:center;animation:pop .35s cubic-bezier(.2,1.5,.4,1)}
  #mIcon{font-size:64px;line-height:1;filter:drop-shadow(0 6px 6px #0008)}
  #mTitle{font-family:var(--fh);font-size:40px;margin:6px 0;text-shadow:0 3px 0 #0008}
  #mText{color:#cfd8ee;margin:6px 0 14px;font-size:15px}
  .rowb{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:12px}
  .reward{display:inline-flex;align-items:center;gap:10px;background:#0b1020;border:2px solid #3b4a74;border-radius:14px;padding:8px 18px;font-family:var(--fh);font-size:30px;color:#ffe27a}

  /* in-game DOM controls */
  #gameUi{position:fixed;left:max(10px,env(safe-area-inset-left));top:10px;z-index:15;display:none;flex-direction:column;gap:8px}
  #gameUi.on{display:flex}
  .gbtn{width:48px;height:48px;border-radius:12px;border:0;cursor:pointer;font-size:22px;box-shadow:inset 0 2px 0 #fff6,0 3px 0 #0009}

// ---------------------------------------------------------------- 3D ball orientation
// p = where the number sits, q = axis of the stripe caps. Rolling rotates both.
function norm3(v) { const l = Math.hypot(v[0], v[1], v[2]) || 1; v[0] /= l; v[1] /= l; v[2] /= l; return v; }

}
function rollBall(b, vx, vy) {

  rotV(b.p, kx, ky, c, s); if (b.q) rotV(b.q, kx, ky, c, s);

function mkBall(n, x, y) {
  const p = norm3([rnd(-0.35, 0.35), rnd(-0.35, 0.35), 1]);
  const q0 = [rnd(-1, 1), rnd(-1, 1), 0], d = q0[0] * p[0] + q0[1] * p[1];
  const q = norm3([q0[0] - p[0] * d, q0[1] - p[1] * d, -p[2] * d]);

}
const iconBall = n => ({n, p: [0, 0, 1], q: [0, 1, 0]});

// ---------------------------------------------------------------- physics
function anyMoving(balls) { return balls.some(b => !b.out && (b.vx || b.vy)); }
function physicsFrame(G) {
  const balls = G.balls, pockets = G.pockets, SUB = 8, E = 0.95, RE = 0.78;
  for (let s = 0; s < SUB; s++) {
    for (const b of balls) if (!b.out) { b.x += b.vx / SUB; b.y += b.vy / SUB; }
    if (pockets) for (const b of balls) {
      if (b.out) continue;
      for (const p of pockets) {
        if ((b.x - p.x) ** 2 + (b.y - p.y) ** 2 < p.r * p.r) { b.out = true; onPot(G, b, p); b.vx = b.vy = 0; break; }
      }
    }
    for (const b of balls) {
      if (b.out) continue;
      if (b.x < R || b.x > FW - R) {
        const sp = Math.hypot(b.vx, b.vy), hit = Math.abs(b.vx); let kick = 0;
        if (b.side && sp) { kick = (b.vx / sp) * b.side * hit * 0.45; b.side *= 0.6; }
        const left = b.x < R; b.x = left ? R : FW - R; b.vx = (left ? 1 : -1) * hit * RE; b.vy += kick;
        onRail(G, b, hit);
      }
      if (b.y < R || b.y > FH - R) {
        const sp = Math.hypot(b.vx, b.vy), hit = Math.abs(b.vy); let kick = 0;
        if (b.side && sp) { kick = (-b.vy / sp) * b.side * hit * 0.45; b.side *= 0.6; }
        const top = b.y < R; b.y = top ? R : FH - R; b.vy = (top ? 1 : -1) * hit * RE; b.vx += kick;
        onRail(G, b, hit);
      }
    }
    for (let i = 0; i < balls.length; i++) {
      const a = balls[i]; if (a.out) continue;
      for (let j = i + 1; j < balls.length; j++) {
        const b = balls[j]; if (b.out) continue;
        const dx = b.x - a.x, dy = b.y - a.y, d2 = dx * dx + dy * dy;
        if (d2 >= 4 * R * R || d2 === 0) continue;
        const d = Math.sqrt(d2), nx = dx / d, ny = dy / d, ov = (2 * R - d) / 2;
        a.x -= nx * ov; a.y -= ny * ov; b.x += nx * ov; b.y += ny * ov;
        const rel = (a.vx - b.vx) * nx + (a.vy - b.vy) * ny;
        if (rel > 0) {

  }
}

// ---------------------------------------------------------------- geometry helpers
function segDist2(px, py, ax, ay, bx, by) {
  const dx = bx - ax, dy = by - ay, L = dx * dx + dy * dy;
  let t = L ? ((px - ax) * dx + (py - ay) * dy) / L : 0; t = clamp(t, 0, 1);
  const qx = ax + dx * t - px, qy = ay + dy * t - py; return qx * qx + qy * qy;
}
function segClear(balls, ax, ay, bx, by, exclude) {
  for (const b of balls) {
    if (b.out || exclude.includes(b.n)) continue;
    if (segDist2(b.x, b.y, ax, ay, bx, by) < (2 * R - 0.5) ** 2) return false;
  }

}
function castAim(balls, cx, cy, ang) {
  const dx = Math.cos(ang), dy = Math.sin(ang); let best = null;
  for (const b of balls) {
    if (b.out || b.n === 0) continue;
    const ox = b.x - cx, oy = b.y - cy, t = ox * dx + oy * dy; if (t <= 0) continue;
    const perp2 = ox * ox + oy * oy - t * t; if (perp2 >= 4 * R * R) continue;
    const th = t - Math.sqrt(4 * R * R - perp2);
    if (!best || th < best.t) best = {t: th, ball: b};
  }
  if (best) {
    const gx = cx + dx * best.t, gy = cy + dy * best.t;
    let nx = best.ball.x - gx, ny = best.ball.y - gy; const nl = Math.hypot(nx, ny); nx /= nl; ny /= nl;
    const dot = dx * nx + dy * ny;
    return {gx, gy, ball: best.ball, nx, ny, dot, tx: dx - dot * nx, ty: dy - dot * ny};
  }

  if (dx > 0) t = Math.min(t, (FW - R - cx) / dx); if (dx < 0) t = Math.min(t, (R - cx) / dx);
  if (dy > 0) t = Math.min(t, (FH - R - cy) / dy); if (dy < 0) t = Math.min(t, (R - cy) / dy);
  return {gx: cx + dx * t, gy: cy + dy * t, ball: null};
}

function rack() {
  const balls = [mkBall(0, FW * 0.25, FH / 2)];
  const foot = FW * 0.72, gap = 2 * R + 0.6;
  const solids = shuffle([2, 3, 4, 5, 6, 7]), stripes = shuffle([9, 10, 11, 12, 13, 14, 15]);
  const layout = []; for (let row = 0; row < 5; row++) for (let i = 0; i <= row; i++) layout.push([row, i]);
  const order = new Array(15).fill(null);
  order[0] = 1; order[4] = 8; order[10] = solids.pop(); order[14] = stripes.pop();
  const rest = shuffle(solids.concat(stripes));
  for (let k = 0; k < 15; k++) if (order[k] === null) order[k] = rest.pop();
  layout.forEach(([row, i], k) => balls.push(mkBall(order[k], foot + row * gap * 0.866 + rnd(-0.15, 0.15), FH / 2 + (i - row / 2) * gap + rnd(-0.15, 0.15))));

}

function evalShot(balls, cx, cy, t, pa) {

  if (!segClear(balls, t.x, t.y, pa.x, pa.y, [0, t.n])) return null;
  const score = cos ** 3 * 1e5 / (d1 + d2 * 1.6 + 150);
  const speed = 0.0135 * (d1 + d2 / cos) * 1.35 + 2.5;
  return {angle: Math.atan2(vy, vx), power: clamp(speed / 30.5, 0.18, 1), score, t};
}

    const s = evalShot(game.balls, cx, cy, t, pa);

  }

}
function aiThink() {
  const G = game, cue = G.balls[0];

    let best = null, pos = null;
    if (G.isBreak) pos = {x: FW * 0.25, y: FH / 2 + rnd(-60, 60)};
    else for (let i = 0; i < 120; i++) {
      const x = rnd(R, FW - R), y = rnd(R, FH - R);
      if (G.balls.some(b => !b.out && b.n !== 0 && (b.x - x) ** 2 + (b.y - y) ** 2 < (2 * R + 2) ** 2)) continue;
      const s = bestShotFrom(x, y);

    plan = {angle: Math.atan2(apex.y - cue.y, apex.x - cue.x) + gauss() * 0.004, power: rnd(0.93, 1)};
  } else {
    plan = bestShotFrom(cue.x, cue.y);
    if (!plan) {
      const tg = legalTargets(G.cur);
      const clear = tg.filter(t => segClear(G.balls, cue.x, cue.y, t.x, t.y, [0, t.n]));
      const t = pick(clear.length ? clear : tg);
      plan = {angle: Math.atan2(t.y - cue.y, t.x - cue.x), power: rnd(0.45, 0.65)};
    }
    plan.angle += gauss() * G.skill;
  }

  while (to - from < -Math.PI) to += 2 * Math.PI;
  G.aiTask = {from, to, power: plan.power, t: 0, dur: 40 + Math.abs(to - from) * 25};
}

// ---------------------------------------------------------------- confetti
function burst() {
  for (let i = 0; i < 160; i++) confetti.push({
    x: W / 2 + rnd(-200, 200), y: H * 0.4, vx: rnd(-9, 9), vy: rnd(-16, -4),
    c: ["#ffcf3d", "#ff4b3e", "#3fe052", "#3b8cff", "#fff", "#ff8a1f", "#a45cff"][i % 7], life: rnd(120, 190), r: rnd(0, 6), w: rnd(6, 12),
  });
}
function drawConfetti() {
  confetti = confetti.filter(p => p.life-- > 0);
  for (const p of confetti) {
    p.vy += 0.32; p.vx *= 0.99; p.x += p.vx; p.y += p.vy; p.r += 0.15;
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.scale(1, Math.cos(p.r * 2));
    ctx.fillStyle = p.c; ctx.globalAlpha = Math.min(1, p.life / 40); ctx.fillRect(-p.w / 2, -3, p.w, 6); ctx.restore();
  }

// ---------------------------------------------------------------- main loop
function update() {
  const G = game; if (!G) return;
  if (input.charging) { if (canControl()) input.power = Math.min(1, input.power + 0.012); else { input.charging = false; input.power = 0; } }
  if (G.strike) {
    G.strike.t++;
    if (G.strike.t >= 5) { const p = G.strike.power; G.strike = null; doShoot(p); }
  } else if (G.moving) {
    physicsFrame(G);
    if (!G.demo) Snd.roll(G.balls.reduce((s, b) => s + (b.out ? 0 : Math.hypot(b.vx, b.vy)), 0));
    if (!anyMoving(G.balls)) {
      G.moving = false; if (!G.demo) Snd.roll(0);
      if (G.type === "lucky") luckyFinish(); else resolveShot();
    }
  } else if (!G.over) {
    if (curP().isAI) {
      if (!G.aiTask && !G.aiWait) {
        G.aiWait = setTimeout(() => { G.aiWait = null; if (game === G && !G.over && !G.moving) aiThink(); }, G.demo ? 500 : rnd(700, 1300));
      }
      if (G.aiTask) aiUpdate();
    } else if (timed() && G.turnLimit && !G.spinOpen && mode === "game" && !$("modal").classList.contains("on")) {
      const left = G.turnLimit - (performance.now() - G.turnStart) / 1000;
      if (left <= 5 && left > 0) { const s = Math.ceil(left); if (s !== G.lastTick) { G.lastTick = s; Snd.tick(); } }
      if (left <= 0 && !input.drag) timeoutFoul();
    } else if (G.spinOpen || $("modal").classList.contains("on")) {
      G.turnStart += 1000 / 60;   // pause the shot clock while a menu is open
    }
  }
  updateTray(G);
  G.shake *= 0.85;
}
function render() {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, cv.width, cv.height);
  ctx.setTransform(scale * dpr, 0, 0, scale * dpr, offX * dpr, offY * dpr);
  const G = game;
  drawBackground();
  if (!G) { drawConfetti(); return; }
  ctx.save();
  if (G.shake > 0.3) ctx.translate(rnd(-G.shake, G.shake), rnd(-G.shake, G.shake));
  drawTable(G.city);
  if (G.type === "lucky") drawLuckyTarget(G);
  ctx.save(); ctx.translate(FX, FY);
  G.flashes = G.flashes.filter(f => f.t < 24);
  for (const f of G.flashes) {
    f.t++; ctx.strokeStyle = `rgba(255,230,140,${1 - f.t / 24})`; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(f.x, f.y, 20 + f.t * 1.6, 0, 7); ctx.stroke();
  }
  G.sinking = G.sinking.filter(s => s.t < 14);
  for (const s of G.sinking) { s.t++; const k = s.t / 14; drawBall(s.b, s.x + (s.px - s.x) * k, s.y + (s.py - s.y) * k, 1 - k * 0.55, 1 - k * 0.9); }
  for (const b of G.balls) if (!b.out) drawBall(b, b.x, b.y);
  G.sparks = G.sparks.filter(s => s.life-- > 0);
  ctx.fillStyle = "#fff";
  for (const s of G.sparks) { s.x += s.vx; s.y += s.vy; ctx.globalAlpha = s.life / 16; ctx.fillRect(s.x - 1, s.y - 1, 2.5, 2.5); }
  ctx.globalAlpha = 1;
  ctx.restore();
  const cue = G.balls[0];
  const human = !curP().isAI && !G.demo && G.type !== "watch";
  if (!G.moving && !G.over && !cue.out) {
    if (G.ballInHand && human && !G.strike) drawHand(FX + cue.x, FY + cue.y);
    if ((human && !G.strike) || (G.aiTask && !G.demo)) drawGuide(G);
    const pull = G.strike ? G.strike.power * Math.max(0, 1 - G.strike.t / 4) : human ? input.power : G.aiPull;
    drawCue(G, pull);
  }
  ctx.restore();
  if (!G.demo) {
    drawHUD(G);
    drawControls(G, human);
    if (G.type !== "lucky") drawTray(G);
    drawPill(G);
    drawBanner(G);
    if (G.spinOpen) drawSpinUI(G);
  }
  const v = ctx.createRadialGradient(W / 2, H / 2, H * 0.45, W / 2, H / 2, W * 0.75);
  v.addColorStop(0, "rgba(0,0,0,0)"); v.addColorStop(1, "rgba(0,0,0,.45)");

}

  const nm = i => `<span>${AVATARS[P[i].avatar]}</span>${esc(P[i].name)}`;
  const row = (i, w) => `<div class="${i === 0 ? "me " : ""}${w === undefined ? "" : w === i ? "w" : "l"}">${nm(i)}</div>`;
  const mt = (a, b, w) => `<div class="match">${row(a, w)}${row(b, w)}</div>`;
  const tbd = '<div class="match"><div>?</div><div>?</div></div>';
  const qf = [[0, 1, r >= 1 ? 0 : undefined], [2, 3, r >= 1 ? tour.w[0] : undefined], [4, 5, r >= 1 ? tour.w[1] : undefined], [6, 7, r >= 1 ? tour.w[2] : undefined]];
  const sf = r >= 1 ? [[0, tour.w[0], r >= 2 ? 0 : undefined], [tour.w[1], tour.w[2], r >= 2 ? tour.w[3] : undefined]] : null;
  const fin = r >= 2 ? [0, tour.w[3], undefined] : null;
  body.innerHTML = `<div class="bracket">
    <div><h4>Chorak final</h4>${qf.map(m => mt(...m)).join("")}</div>
    <div><h4>Yarim final</h4>${sf ? sf.map(m => mt(...m)).join("") : tbd + tbd}</div>
    <div><h4>Final</h4>${fin ? mt(...fin) : tbd}<div style="text-align:center;font-size:54px">🏆</div>
      <div style="text-align:center" class="h"><span class="coin"></span> ${fmt(c.prize)}</div></div>
  </div>
  <button class="btn green" id="tourNext" style="margin-top:16px;font-size:24px;padding:12px 40px">${["CHORAK FINAL", "YARIM FINAL", "FINAL"][r]} — O'YNASH</button>`;
  $("tourNext").onclick = () => {
    const opp = P[[1, tour.w[0], tour.w[3]][r]];
    vsScreen(CITIES[c.city], c.prize, opp, o => startMatch("tour", CITIES[c.city], o));
  };
}
function joinTour(c) {
  if (profile.coins < c.fee) return openModal({icon: "😕", title: "Tanga yetmaydi", text: `Kirish uchun ${fmt(c.fee)} tanga kerak.`, buttons: [{label: "OK", cls: "gray", fn: () => go("tourScr")}]});
  profile.coins -= c.fee; save(); updateNav();
  const players = [mePlayer()], used = new Set([profile.name]);
  while (players.length < 8) { const b = botPlayer(CITIES[c.city].lvl + 1, CITIES[c.city].lvl + 8); if (!used.has(b.name)) { used.add(b.name); players.push(b); } }
  const w0 = pick([2, 3]), w1 = pick([4, 5]), w2 = pick([6, 7]), w3 = pick([w1, w2]);
  tour = {cup: c.id, players, round: 0, w: [w0, w1, w2, w3]};
  Snd.coin(3); go("tourScr");
}
function tourAfterMatch(won, why, winner) {
  const c = CUPS.find(q => q.id === tour.cup);
  if (!won) {
    tour = null;
    return resultModal(false, `${winner.name}: ${why}. Turnirdan chiqdingiz.`, winner, 0, [{label: "Turnirlar", cls: "orange", fn: () => toMenu("tourScr")}, {label: "Menyu", cls: "gray", fn: () => toMenu()}]);
  }
  tour.round++; addXp(30);
  if (tour.round >= 3) {
    tour = null; profile.tours++; profile.won += c.prize; save(); unlock("champ"); addXp(100);
    return resultModal(true, `Siz ${c.name} chempionisiz! 👑`, mePlayer(), c.prize, [{label: "Menyu", cls: "green", fn: () => toMenu()}]);
  }
  openModal({icon: "✅", title: "Raund yutildi!", text: `Keyingi bosqich: ${["", "Yarim final", "Final"][tour.round]}`, buttons: [{label: "Davom etish", cls: "green", fn: () => toMenu("tourScr")}]});
}

// ---------------------------------------------------------------- shop
function cueGradient(c) { return `linear-gradient(90deg,#2f6fd6 0 1.5%,#f7f3e6 1.5% 5%,${c.c[0]} 5%,${c.c[1]} 50%,${c.band} 50% 52%,${c.c[2]} 52% 70%,${c.band} 70% 71.5%,${c.c[3]} 71.5% 97%,#111 97%)`; }
function buildShop(tab) {
  document.querySelectorAll("#shop .tab").forEach(t => t.classList.toggle("on", t.dataset.tab === tab));
  const body = $("shopBody"); body.innerHTML = "";
  if (tab === "bank") {
    body.innerHTML = `<div class="grid">${[[5, 2000], [20, 9000], [60, 30000]].map(([cash, coins]) => `
      <div class="card" style="text-align:center"><div style="font-size:44px">💱</div>
        <div class="h" style="font-size:22px;margin:6px 0"><span class="cash"></span> ${cash} → <span class="coin"></span> ${fmt(coins)}</div>
        <button class="btn green" data-x="${cash},${coins}">ALMASHTIRISH</button></div>`).join("")}</div>
      <p class="muted" style="text-align:center;margin-top:14px">💵 Pul — sovg'alar yo'li, omadli zarba va g'ildirakdan olinadi. Hech qanday haqiqiy to'lov yo'q.</p>`;
    body.querySelectorAll("[data-x]").forEach(b => b.onclick = () => {
      const [cash, coins] = b.dataset.x.split(",").map(Number);
      if (profile.cash < cash) { toast("😕", "Pul yetmaydi", "Almashtirish"); return; }
      profile.cash -= cash; addCoins(coins); Snd.coin(6); toast("💱", `+${fmt(coins)} tanga`, "Almashtirildi");
    });
    return;
  }
  const grid = document.createElement("div"); grid.className = "grid";
  CUES.forEach(c => {
    const owned = profile.cues.includes(c.id), sel = profile.cue === c.id;
    const el = document.createElement("div"); el.className = "card" + (sel ? " sel" : "");
    el.innerHTML = `<div class="h" style="font-size:20px">${c.name}</div>
      <div class="cuebar" style="background:${cueGradient(c)}"></div>
      ${c.st.map((v, i) => `<div class="stat"><span>${STAT_NAMES[i]}</span><div class="bars">${Array.from({length: 10}, (_, k) => `<i class="${k < v ? "on" : ""}"></i>`).join("")}</div></div>`).join("")}
      <div style="margin-top:10px">${sel ? `<button class="btn gray" disabled style="width:100%">✓ TANLANGAN</button>`
        : owned ? `<button class="btn blue" style="width:100%">TANLASH</button>`
        : `<button class="btn ${c.cur === "cash" ? "purple" : "green"}" style="width:100%">${c.cur === "cash" ? '<span class="cash"></span>' : '<span class="coin"></span>'} ${fmt(c.price)}</button>`}</div>`;
    const btn = el.querySelector("button");
    if (!sel) btn.onclick = () => {
      if (!owned) {
        const bal = c.cur === "cash" ? profile.cash : profile.coins;
        if (bal < c.price) { toast("😕", c.cur === "cash" ? "Pul yetmaydi" : "Tanga yetmaydi", c.name); return; }
        if (c.cur === "cash") profile.cash -= c.price; else profile.coins -= c.price;
        profile.cues.push(c.id); Snd.coin(6); toast("🎱", c.name, "Yangi kiy!");
        if (profile.cues.length >= 4) unlock("collector");
      }
      profile.cue = c.id; save(); updateNav(); buildShop("cues");
    };
    grid.appendChild(el);
  });
  body.appendChild(grid);
  body.insertAdjacentHTML("beforeend", `<p class="muted" style="margin-top:12px">Kuch — zarba kuchi · Nishon — yo'naltiruvchi chiziq uzunligi · Aylanish — spin ta'siri · Vaqt — har bir zarba uchun soniyalar</p>`);
}

// ---------------------------------------------------------------- rewards (daily streak)
function streakIndex() {
  if (!profile.lastClaim) return 0;
  const d = dayDiff(profile.lastClaim, today());
  if (d === 0) return (profile.streak - 1) % REWARDS.length;
  if (d === 1) return profile.streak % REWARDS.length;
  return 0;
}
function buildRewards() {
  const claimable = profile.lastClaim !== today();
  if (profile.lastClaim && dayDiff(profile.lastClaim, today()) > 1) { profile.streak = 0; save(); }
  const idx = streakIndex();
  $("streakTxt").textContent = profile.streak;
  const box = $("routeList"); box.innerHTML = "";
  REWARDS.forEach((r, i) => {
    let cls = "rw", btn;
    if (i < idx || (i === idx && !claimable)) { cls += " done"; btn = "✓ Olindi"; }
    else if (i === idx && claimable) { cls += " now"; btn = "OLISH!"; }
    else { cls += " lockd"; btn = "🔒"; }
    const el = document.createElement("div"); el.className = cls;
    el.innerHTML = `<span class="dayn">${i + 1}-kun</span><div class="ri">${r.icon}</div><div class="rl">${r.label}</div><div class="rb">${btn}</div>`;
    if (i === idx && claimable) el.onclick = () => claimReward(r);
    box.appendChild(el);
  });
  const mid = new Date(); mid.setHours(24, 0, 0, 0); const ms = mid - Date.now();
  $("rwTimer").textContent = claimable ? "Bugungi sovg'angiz tayyor — bosing!" : `Keyingi sovg'a: ${Math.floor(ms / 36e5)} soat ${Math.floor(ms % 36e5 / 6e4)} daqiqadan keyin`;
}
function claimReward(r) {
  const d = profile.lastClaim ? dayDiff(profile.lastClaim, today()) : 99;
  profile.streak = d === 1 ? profile.streak + 1 : 1;
  profile.lastClaim = today();
  if (r.t === "coins") profile.coins += r.v;
  if (r.t === "cash") profile.cash += r.v;
  if (r.t === "lucky") profile.luckyTries += r.v;
  if (r.t === "wheel") profile.wheelTries += r.v;
  if (profile.streak >= 7) unlock("streak7");
  save(); updateNav(); Snd.coin(8); burst();
  toast(r.icon, r.label, "Kunlik sovg'a");
  buildRewards();
}

// ---------------------------------------------------------------- leaderboard
function buildLeader() {
  let seed = Math.floor(Date.now() / (7 * 864e5)) % 233280;
  const rand = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
  const rows = BOT_NAMES.slice(0, 20).map((n, i) => ({name: n, av: (i * 7) % AVATARS.length, col: AV_COLORS[i % AV_COLORS.length], won: Math.round(Math.pow(rand(), 2.2) * 180000 + 300)}));
  rows.push({name: profile.name + " (siz)", av: profile.avatar, col: AV_COLORS[profile.avatar % AV_COLORS.length], won: profile.won, me: true});
  rows.sort((a, b) => b.won - a.won);
  const medal = i => i === 0 ? "🥇" : i === 1 ? "🥈" : i === 2 ? "🥉" : i + 1;
  $("lbList").innerHTML = rows.map((r, i) => `<div class="lbr${r.me ? " me" : ""}"><div class="rk">${medal(i)}</div>
    <div class="av" style="background:${r.col}">${AVATARS[r.av]}</div><div>${esc(r.name)}</div>
    <div class="h" style="color:#ffe27a"><span class="coin" style="width:16px;height:16px"></span> ${fmt(r.won)}</div></div>`).join("");
}

// ---------------------------------------------------------------- mini games
function buildMini() {
  $("luckyInfo").textContent = luckyFree() ? "Bugun bepul! 🎉" : profile.luckyTries ? `Bepul urinishlar: ${profile.luckyTries}` : "Urinish: 200 tanga";
  $("wheelInfo").textContent = profile.lastWheel !== today() ? "Bugun bepul! 🎉" : profile.wheelTries ? `Bepul aylantirish: ${profile.wheelTries}` : "Aylantirish: 300 tanga";
}
let wheelRot = 0, wheelBusy = false;
function buildWheel() {
  const w = $("wheel"), seg = 360 / WHEEL.length;
  w.style.background = `conic-gradient(${WHEEL.map((s, i) => `${s.color} ${i * seg}deg ${(i + 1) * seg}deg`).join(",")})`;
  w.innerHTML = WHEEL.map((s, i) => `<div class="lbl" style="transform:rotate(${i * seg + seg / 2 - 90}deg)">${s.label}</div>`).join("") +
    WHEEL.map((s, i) => `<div style="position:absolute;left:50%;top:50%;width:50%;height:2px;background:#fff6;transform-origin:0 50%;transform:rotate(${i * seg - 90}deg)"></div>`).join("");
  const free = profile.lastWheel !== today();
  $("spinBtn").textContent = free || profile.wheelTries ? "AYLANTIRISH (BEPUL)" : "AYLANTIRISH · 300 🪙";
  $("wheelNote").textContent = free ? "Kunlik bepul aylantirish" : profile.wheelTries ? `Qo'shimcha bepul: ${profile.wheelTries}` : "";
}
$("spinBtn").onclick = () => {
  if (wheelBusy) return;
  if (profile.lastWheel !== today()) profile.lastWheel = today();
  else if (profile.wheelTries > 0) profile.wheelTries--;
  else if (profile.coins >= 300) profile.coins -= 300;
  else { toast("😕", "Tanga yetmaydi", "G'ildirak"); return; }
  save(); updateNav(); wheelBusy = true; $("spinBtn").disabled = true;
  const total = WHEEL_WEIGHTS.reduce((a, b) => a + b, 0);
  let r = Math.random() * total, idx = 0;
  while (r > WHEEL_WEIGHTS[idx]) { r -= WHEEL_WEIGHTS[idx]; idx++; }
  const seg = 360 / WHEEL.length;
  const targetMod = (360 - (idx * seg + seg / 2) + rnd(-seg * 0.35, seg * 0.35) + 360) % 360;
  wheelRot += 360 * 6 + ((targetMod - wheelRot % 360) + 360) % 360;
  const w = $("wheel"); w.style.transform = `rotate(${wheelRot}deg)`;
  let last = -1;
  const tick = () => {
    const m = getComputedStyle(w).transform;
    if (m && m !== "none") {
      const v = m.split("(")[1].split(",").map(Number), a = (Math.atan2(v[1], v[0]) * 180 / Math.PI + 360) % 360;
      const s = Math.floor(a / seg); if (s !== last) { last = s; Snd.wheelTick(); }
    }
    if (wheelBusy) requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
  setTimeout(() => {
    wheelBusy = false; $("spinBtn").disabled = false;
    const p = WHEEL[idx];
    if (p.t === "cash") profile.cash += p.v; else profile.coins += p.v;
    save(); updateNav(); Snd.win(); burst();
    openModal({icon: "🎡", title: "Tabriklaymiz!", text: "G'ildirakdan yutuq:",
      extra: `<div class="reward">${p.t === "cash" ? '<span class="cash"></span>' : '<span class="coin"></span>'} +${fmt(p.v)}</div>`,
      buttons: [{label: "Ajoyib!", cls: "green", fn: () => go("wheelScr")}]});
  }, 5100);
};

// ---------------------------------------------------------------- profile
function buildProfile() {
  const wr = profile.games ? Math.round(profile.wins / profile.games * 100) : 0;
  $("profBody").innerHTML = `
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px">
      <div><div class="muted">Ism</div><input class="name" id="pName" maxlength="14" value="${esc(profile.name)}">
        <div class="muted" style="margin-top:10px">Avatar</div>
        <div class="avs">${AVATARS.map((a, i) => `<button data-a="${i}" class="${i === profile.avatar ? "on" : ""}" style="background:${AV_COLORS[i % AV_COLORS.length]}">${a}</button>`).join("")}</div></div>
      <div><div class="grid" style="grid-template-columns:1fr 1fr">
        ${[["⭐", "Daraja", profile.level], ["🎱", "O'yinlar", profile.games], ["🏆", "G'alabalar", profile.wins], ["📈", "G'alaba %", wr + "%"], ["💰", "Jami yutuq", fmt(profile.won)], ["👑", "Turnirlar", profile.tours]]
          .map(([i, n, v]) => `<div class="card" style="text-align:center;padding:8px"><div style="font-size:24px">${i}</div><div class="muted">${n}</div><div class="h" style="font-size:22px">${v}</div></div>`).join("")}
      </div></div>
    </div>
    <h3 class="h" style="font-weight:400;margin:16px 0 8px;color:var(--gold)">Yutuqlar</h3>
    <div class="achs">${Object.entries(ACHS).map(([id, a]) => `<div class="ach${profile.ach[id] ? "" : " off"}"><span>${a.icon}</span><div>${a.name}<small>${a.d}</small></div></div>`).join("")}</div>`;
  $("pName").oninput = e => { profile.name = e.target.value.trim() || "Siz"; save(); updateNav(); };
  $("profBody").querySelectorAll("[data-a]").forEach(b => b.onclick = () => { profile.avatar = +b.dataset.a; save(); updateNav(); buildProfile(); });
}

// ---------------------------------------------------------------- chat & cheers
function closeChat() { $("chatPanel").classList.remove("on"); }
$("chatPanel").innerHTML = CHAT.map(c => `<button>${c}</button>`).join("");
$("chatPanel").querySelectorAll("button").forEach(b => b.onclick = () => {
  const G = game; if (!G || mode !== "game") return;
  const who = G.type === "pvp" ? G.cur : 0;
  bubble(who, b.textContent); closeChat();
  if (G.players[1] && G.players[1].isAI && who === 0) {
    const rep = AI_REPLY[b.textContent];
    if (rep || Math.random() < 0.3) setTimeout(() => game === G && bubble(1, pick(rep || ["😅", "👍", "😎"])), rnd(900, 1800));
  }
});
$("gChat").onclick = () => $("chatPanel").classList.toggle("on");
$("cheerBar").querySelectorAll("button").forEach(b => b.onclick = () => {
  const G = game; if (!G) return;
  for (let i = 0; i < 3; i++) {
    const el = document.createElement("div"); el.className = "floater"; el.textContent = b.textContent;
    el.style.left = (innerWidth - 170 + rnd(-40, 40)) + "px"; el.style.top = (innerHeight - 100) + "px";
    el.style.setProperty("--dx", rnd(-80, 40) + "px"); el.style.animationDelay = i * 0.12 + "s";
    document.body.appendChild(el); setTimeout(() => el.remove(), 2700);
  }
  bubble(G.cur, b.textContent);
});
$("gMenu").onclick = () => {
  const G = game; if (!G) return;
  const money = (G.type === "ai" || G.type === "tour") && !G.over;
  openModal({icon: "⏸️", title: "Pauza", text: money ? "Chiqsangiz, o'yin mag'lubiyat hisoblanadi." : "",
    buttons: [
      {label: "Davom etish", cls: "green", fn: () => {}},
      {label: profile.muted ? "🔊 Ovozni yoqish" : "🔇 Ovozni o'chirish", cls: "blue", fn: toggleMute},
      {label: money ? "Taslim bo'lish" : "Chiqish", cls: "red", fn: () => {
        if (money) { profile.games++; save(); if (G.type === "tour") tour = null; }
        toMenu(G.type === "lucky" ? "mini" : G.type === "tour" ? "tourScr" : "home");
      }},
    ]});
};
function toggleMute() { profile.muted = !profile.muted; save(); Snd.setMuted(profile.muted); updateNav(); }

// ---------------------------------------------------------------- wiring
document.addEventListener("click", e => {
  if (e.target.closest("button,.rw.now,.pchip,.mchip")) Snd.click();
  const g = e.target.closest("[data-go]"); if (g) go(g.dataset.go, g.dataset.tab);
});
document.querySelectorAll("#shop .tab").forEach(t => t.addEventListener("click", () => buildShop(t.dataset.tab)));
$("pchip").onclick = () => go("profileScr");
$("muteBtn").onclick = toggleMute;
$("tPlay").onclick = () => go("cities");
$("tTour").onclick = () => go("tourScr");
$("tMini").onclick = () => go("mini");
$("tPvp").onclick = () => startMatch("pvp", CITIES[1]);
$("tWatch").onclick = () => startMatch("watch", pick(CITIES));
$("tPractice").onclick = () => startMatch("practice", CITIES[0]);
$("mLucky").onclick = startLucky;
$("mWheel").onclick = () => go("wheelScr");

for (let i = 0; i < 18; i++) {
  const s = document.createElement("div"); s.className = "spark";
  s.style.left = rnd(0, 100) + "%"; s.style.top = rnd(60, 100) + "%";
  s.style.animationDuration = rnd(6, 14) + "s"; s.style.animationDelay = rnd(0, 10) + "s";
  $("shade").appendChild(s);
}

toMenu();
if (profile.lastClaim !== today()) setTimeout(() => toast("🎁", "Kunlik sovg'a tayyor!", "Sovg'alar yo'li"), 1200);
requestAnimationFrame(frame);
</script>
