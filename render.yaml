# Render Blueprint: Dashboard → New → Blueprint → pick this repo.
services:
  - type: web
    name: bilyard8
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    plan: starter            # persistent disks need a paid instance
    healthCheckPath: /api/health
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DATA_DIR
        value: /data
      - key: NODE_VERSION
        value: "20"
      - key: APP_URL          # e.g. https://bilyard8.onrender.com
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
