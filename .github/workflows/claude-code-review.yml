name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          # Set ONE of these in Settings → Secrets and variables → Actions
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. Read the diff with `gh pr diff`, not whole files
            (index.html is ~9 MB). Ignore the screenshot PNGs.

            Focus on:
            - Bugs and broken game logic in index.html (rules, scoring, rewards, UI state)
            - server/: security (input validation, auth, Stripe webhook verification,
              SQL injection, secrets), money/coin/reward exploits, race conditions
            - Performance problems on phones

            Post concrete problems as inline comments on the exact lines
            (mcp__github_inline_comment__create_inline_comment). Then post one short
            summary with `gh pr comment`. Skip style nitpicks. If nothing is wrong, say so briefly.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
