name: Android app (Play Market)

# Builds the Android App Bundle (.aab) of the game: Actions tab -> "Android app (Play Market)" -> Run workflow.
# The file appears at the bottom of the finished run (Artifacts -> royal-billiard-8-aab) - upload it in Google Play Console.
# Signing: add the 4 repository secrets below (Settings -> Secrets and variables -> Actions). Without them a debug-signed bundle is made (fine for testing, NOT accepted by Play).
#   ANDROID_KEYSTORE_BASE64  the upload keystore (.jks) as base64      ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS                                                   ANDROID_KEY_PASSWORD
on:
  workflow_dispatch:
    inputs:
      version_code:
        description: "versionCode (a whole number, bigger than the one uploaded before: 1, 2, 3 ...)"
        default: "1"
      version_name:
        description: "versionName shown to players"
        default: "1.0.0"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Game files (light build, no HD pack, no card buttons; the 💎 packs are bought with Google Play Billing)
        env:
          APP_VER: ${{ inputs.version_name }} (${{ inputs.version_code }})   # shown on the start screen and in Settings
        run: bash tools/build_android.sh
      - name: Capacitor + Android project
        working-directory: android
        run: |
          npm install
          npx cap add android
          npx capacitor-assets generate --android --iconBackgroundColor '#0b1030' --iconBackgroundColorDark '#0b1030'
          # voice chat (lobby room + in-match 🎤): the WebView may use the microphone - Android asks the player once, the game then keeps the microphone open
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#&\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />#' android/app/src/main/AndroidManifest.xml
          grep -c "RECORD_AUDIO" android/app/src/main/AndroidManifest.xml
          # Google Play Billing (the 💎 packs, plugin @capgo/native-purchases in android/package.json): the billing library adds this permission by itself when the manifests merge; written here too so the check below can prove it
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#&\n    <uses-permission android:name="com.android.vending.BILLING" />#' android/app/src/main/AndroidManifest.xml
          grep -c "com.android.vending.BILLING" android/app/src/main/AndroidManifest.xml
          # Play's automatic protection needs minSdk 24 (Android 7+); Capacitor 8 already uses 24 (and target / compile SDK 36, which Play now asks for) - kept as a guard
          sed -i 's/minSdkVersion = 22/minSdkVersion = 24/' android/variables.gradle
          grep -c "minSdkVersion = 24" android/variables.gradle
          # a game: always landscape, full screen (status + navigation bars hidden, see SystemBars in capacitor.config.json), drawn into the camera cut-out, dark window behind the page
          sed -i 's#android:launchMode="singleTask"#&\n            android:screenOrientation="sensorLandscape"#' android/app/src/main/AndroidManifest.xml
          sed -i 's#<item name="android:background">@null</item>#&\n        <item name="android:windowLayoutInDisplayCutoutMode">shortEdges</item>\n        <item name="android:windowBackground">\#0b1030</item>#' android/app/src/main/res/values/styles.xml
          grep -c "sensorLandscape" android/app/src/main/AndroidManifest.xml
          grep -c "shortEdges" android/app/src/main/res/values/styles.xml
          # sign-in with Google / Facebook goes through the phone's own browser (both refuse an app's embedded WebView, see android/README.md): the page the browser ends on opens royalbilliard8://auth, which brings the game back to the front (launchMode singleTask)
          sed -i '0,/<\/intent-filter>/s##&\n            <intent-filter>\n                <action android:name="android.intent.action.VIEW" />\n                <category android:name="android.intent.category.DEFAULT" />\n                <category android:name="android.intent.category.BROWSABLE" />\n                <data android:scheme="royalbilliard8" android:host="auth" />\n            </intent-filter>#' android/app/src/main/AndroidManifest.xml
          grep -c 'android:scheme="royalbilliard8"' android/app/src/main/AndroidManifest.xml
          # the bars STAY hidden: Capacitor hides them once at start, but a swipe from the screen edge (or a dialog, the microphone question ...) brought the navigation bar back and it stayed on screen.
          # MainActivity hides them again every time the window gets focus, and a swipe from the edge shows them only for a moment
          MA=$(find android/app/src/main/java -name MainActivity.java | head -1)
          PKG=$(grep -m1 '^package ' "$MA")
          cat > "$MA" <<JAVA
          $PKG

          import android.os.Bundle;
          import android.view.Window;
          import androidx.core.view.WindowCompat;
          import androidx.core.view.WindowInsetsCompat;
          import androidx.core.view.WindowInsetsControllerCompat;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(RbAdsPlugin.class);   // the AppLovin MAX ads (android/native/RbAdsPlugin.java), must be registered before super.onCreate
                  super.onCreate(savedInstanceState);
              }

              private void hideBars() {
                  Window w = getWindow();
                  WindowInsetsControllerCompat c = WindowCompat.getInsetsController(w, w.getDecorView());
                  c.setSystemBarsBehavior(WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE);
                  c.hide(WindowInsetsCompat.Type.systemBars());
              }

              @Override
              public void onResume() {
                  super.onResume();
                  hideBars();
              }

              @Override
              public void onWindowFocusChanged(boolean hasFocus) {
                  super.onWindowFocusChanged(hasFocus);
                  if (hasFocus) hideBars();
              }
          }
          JAVA
          cat "$MA"
          grep -c "hideBars" "$MA"
          # ads: rewarded video + a short break between games through AppLovin MAX (own small plugin, ids come from the game server). The SDK adds the AD_ID permission by itself
          sed "1s/.*/$PKG/" native/RbAdsPlugin.java > "$(dirname "$MA")/RbAdsPlugin.java"
          head -3 "$(dirname "$MA")/RbAdsPlugin.java"
          sed -i "/^dependencies {/a\\    implementation 'com.applovin:applovin-sdk:13.7.0'" android/app/build.gradle
          grep -c "applovin-sdk:13.7.0" android/app/build.gradle
          grep -c "registerPlugin(RbAdsPlugin.class)" "$MA"
          npx cap sync android
          # the billing plugin must be in the project (without it the app says 'not open yet' instead of selling 💎)
          grep -c "NativePurchases" android/app/src/main/assets/capacitor.plugins.json
      - name: Version + release signing
        working-directory: android/android
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          sed -i "s/versionCode [0-9]*/versionCode ${{ inputs.version_code }}/; s/versionName \"[^\"]*\"/versionName \"${{ inputs.version_name }}\"/" app/build.gradle
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > app/upload.jks
            cat >> app/build.gradle <<GRADLE

          android {
              signingConfigs { release { storeFile file("upload.jks"); storePassword System.getenv("KS_PASS"); keyAlias System.getenv("KS_ALIAS"); keyPassword System.getenv("KEY_PASS") } }
              buildTypes { release { signingConfig signingConfigs.release } }
          }
          GRADLE
            echo "SIGNED=1" >> "$GITHUB_ENV"
          else
            echo "No keystore secrets: the bundle is built unsigned (testing only)"
          fi
      - name: Build the bundle
        working-directory: android/android
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: ./gradlew bundleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: royal-billiard-8-aab
          path: android/android/app/build/outputs/bundle/release/*.aab
